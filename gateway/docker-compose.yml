name: rationsmart-gateway

# The only service published on the host. It reaches the frontend and the api over
# the shared "rationsmart_edge" network (created by deploy.sh, or by hand:
# docker network create rationsmart_edge). Start the backend and frontend first.
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    name: rationsmart_edge
    external: true
