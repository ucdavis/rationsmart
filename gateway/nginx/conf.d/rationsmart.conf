# RationSmart gateway. Included by the stock nginx.conf inside its http {} block,
# so http-level directives (limit_req_zone, gzip, ...) are valid at the top level here.
#
# Public surface:
#   /                                 -> frontend:3000 (Next.js; it proxies /api/proxy/* to the backend itself)
#   = /v1/auth/verify-email-link      -> api:8000      (the link in verification emails)
#   everything else under /v1, docs   -> 404
# Plain HTTP only for now; TLS is added later (certs + a 443 server block).

server_tokens off;
client_max_body_size 10m;          # Next proxy caps bodies at 5 MB, responses at 10 MB
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

# Per-client-IP request limits (nginx sees the real client IP: nothing sits in front of it).
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=session:10m rate=5r/s;
limit_req_status 429;

# Needed because upstreams are resolved at request time (see the variables below), so
# nginx still starts when the frontend/api containers are not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    set $frontend_upstream http://frontend:3000;
    set $api_upstream      http://api:8000;

    # The Next.js proxy waits up to 65 s on the backend; stay above that.
    proxy_connect_timeout 5s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Gateway liveness for its own healthcheck; does not touch upstreams.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The only backend route exposed directly: the email-verification link.
    location = /v1/auth/verify-email-link {
        limit_req zone=general burst=20 nodelay;
        proxy_pass $api_upstream;
    }

    # Keep the rest of the backend (API, Swagger UI, OpenAPI schema) off the internet.
    # The app reaches it through the Next.js proxy over the private network.
    location ~ ^/(v1(/|$)|docs|redoc|openapi\.json) {
        return 404;
    }

    # Session endpoint (login/logout cookie handling): tighter limit.
    location /api/session {
        limit_req zone=session burst=10 nodelay;
        proxy_pass $frontend_upstream;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $frontend_upstream;
    }
}
