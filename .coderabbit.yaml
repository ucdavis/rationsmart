# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
---
reviews:
  request_changes_workflow: true
  # Generated / binary / vendored frontend content is excluded so real
  # findings aren't buried in noise (carried over from the PWA's own config).
  path_filters:
    - "!frontend/public/**"
    - "!frontend/src/lib/data/ui-labels/*.json"
    - "!frontend/**/*.docx"
    - "!frontend/**/*.xlsx"
    - "!frontend/package-lock.json"
    - "!frontend/**/*.tsbuildinfo"
  path_instructions:
    - path: "frontend/src/**/*.tsx"
      instructions: >-
        Screens mirror an Android app pixel-for-pixel; inline styles encode
        Android dimensions on purpose (see CLAUDE.md §14). Flag behaviour and
        security issues first.
