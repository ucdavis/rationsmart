# CodeRabbit review config. Generated / binary / vendored content is excluded
# so real findings aren't buried in noise.
language: en-US
reviews:
  profile: assertive
  path_filters:
    - "!public/**"
    - "!src/lib/data/ui-labels/*.json"
    - "!**/*.docx"
    - "!**/*.xlsx"
    - "!package-lock.json"
    - "!tsconfig.tsbuildinfo"
  path_instructions:
    - path: "src/**/*.tsx"
      instructions: >-
        Screens mirror an Android app pixel-for-pixel; inline styles encode
        Android dimensions on purpose (see CLAUDE.md §14). Flag behaviour and
        security issues first.
