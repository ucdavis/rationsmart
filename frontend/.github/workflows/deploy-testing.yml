# Auto-deploy the `testing` branch to https://rationsmart-testing.vercel.app
# as a PRODUCTION deployment.
#
# Earlier this workflow hit a Vercel Deploy Hook URL — that worked but
# produced *Preview* deployments because the rationsmart-testing
# project's productionBranch is locked to `main` (the Vercel API
# refused programmatic edits to change it). Preview deployments live
# at random URLs and never update the aliased rationsmart-testing.vercel.app.
#
# Workaround: use the Vercel CLI's `--prod` flag in CI, which forces a
# Production deployment regardless of the project's productionBranch
# setting. Then alias the new deployment to the canonical URL.
#
# Required GitHub secrets (already configured):
#   VERCEL_TOKEN                 — Vercel auth token (rotate from Vercel dashboard if leaked)
#   VERCEL_ORG_ID                — Vercel team id (see Vercel dashboard)
#   VERCEL_TESTING_PROJECT_ID    — rationsmart-testing project id

# Auto-deploy is OFF on purpose (CLAUDE.md §10.16): releases are manual
# `vercel deploy --prod` + `vercel alias set`. The trigger is therefore
# manual-only, so the job can never fire on a push — including in a copy of
# this repo where the workflow hasn't been disabled in the Actions UI.
name: Deploy testing branch
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_TESTING_PROJECT_ID }}
      # The CLI reads the token from the environment, which keeps it off
      # the command line (and out of process listings / debug logs).
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@53.2.0

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production

      - name: Build with Vercel
        run: vercel build --prod

      - name: Deploy as Production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Alias to rationsmart-testing.vercel.app
        run: |
          url="${{ steps.deploy.outputs.url }}"
          vercel alias set "$url" rationsmart-testing.vercel.app
