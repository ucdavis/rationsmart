# RationSmart gateway. Included by the stock nginx.conf inside its http {} block,
# so http-level directives (limit_req_zone, gzip, ...) are valid at the top level here.
#
# Public surface:
#   /                                 -> frontend:3000 (Next.js; it proxies /api/proxy/* to the backend itself)
#   = /v1/auth/verify-email-link      -> api:8000      (the link in verification emails)
#   everything else under /v1, docs   -> 404
# HTTPS behind Cloudflare; deployed locally outside the application checkout.

server_tokens off;
client_max_body_size 10m;          # Next proxy caps bodies at 5 MB, responses at 10 MB
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

# Trust client IP headers only from Cloudflare proxy addresses.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Apply request limits to the restored client IP.
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=session:10m rate=5r/s;
limit_req_status 429;

# Needed because upstreams are resolved at request time (see the variables below), so
# nginx still starts when the frontend/api containers are not up yet.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name rationsmart.ucdavis.edu;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 308 https://rationsmart.ucdavis.edu$request_uri; }
}

server {
    listen 443 ssl;
    server_name rationsmart.ucdavis.edu;
    ssl_certificate /etc/nginx/tls/rationsmart.ucdavis.edu.cert.pem;
    ssl_certificate_key /etc/nginx/tls/rationsmart.ucdavis.edu.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    set $frontend_upstream http://frontend:3000;
    set $api_upstream      http://api:8000;

    # The Next.js proxy waits up to 65 s on the backend; stay above that.
    proxy_connect_timeout 5s;
    proxy_send_timeout    75s;
    proxy_read_timeout    75s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Forward only the client IP restored from the trusted Cloudflare header.
    # The API trusts X-Forwarded-For, so discard any client-supplied chain.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Gateway liveness for its own healthcheck; does not touch upstreams.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The only backend route exposed directly: the email-verification link.
    location = /v1/auth/verify-email-link {
        limit_req zone=general burst=20 nodelay;
        proxy_pass $api_upstream;
    }

    # Keep the rest of the backend (API, Swagger UI, OpenAPI schema) off the internet.
    # The app reaches it through the Next.js proxy over the private network.
    location ~ ^/(v1(/|$)|docs|redoc|openapi\.json) {
        return 404;
    }

    # Session endpoint (login/logout cookie handling): tighter limit.
    location /api/session {
        limit_req zone=session burst=10 nodelay;
        proxy_pass $frontend_upstream;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass $frontend_upstream;
    }
}
