# Infrastructure: started by hand only (Run workflow). Checks the Bicep templates and, after a person approves
# the "stage-infra" environment, previews and applies them to Azure. Signs in to Azure with OIDC: there is no
# Azure password or client secret anywhere in GitHub. See INFRASTRUCTURE.md.
#
# There are deliberately no pull_request or push triggers, so nothing runs when this reaches main.
# To run automatically later, add them back here in a pull request to main.
#
# Deployments run in incremental mode only: nothing the template does not mention is ever deleted.
# Secrets are read by infra/params/*.bicepparam from environment variables; they are used once as Bicep inputs.
# No step below interpolates event data (titles, branch names, commit messages) into a command: every value
# reaches a script through env:.

name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "whatif shows the changes only; apply also deploys them"
        type: choice
        options: [whatif, apply]
        default: whatif

permissions:
  contents: read

# One group with the Deploy workflow: an infrastructure change and a release never run at the same time.
concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  # No Azure access: lints and compiles the templates and the parameter files.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint and compile the templates
        env:
          # Placeholder values: the parameter files only need the variables to exist to compile.
          ADMIN_SSH_PUBLIC_KEY: placeholder
          APP_IDENTITY_PRINCIPAL_ID: placeholder
          RUN_COMMAND_ROLE_ID: placeholder
          POSTGRES_ADMIN_PASSWORD: placeholder
          JWT_SECRET_KEY: placeholder
          REDIS_PASSWORD: placeholder
          SMTP_PASSWORD: placeholder
        run: |
          az bicep lint --file infra/main.bicep
          az bicep lint --file infra/bootstrap/oidc.bicep
          for f in infra/params/*.bicepparam; do az bicep build-params --file "$f" --stdout > /dev/null; done

  # Needs a person's approval (environment protection rules). Pull requests never reach this job.
  # A run with mode "whatif" shows the change and stops; mode "apply" also deploys it.
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: stage-infra
    permissions:
      id-token: write   # lets the job ask GitHub for the OIDC token that the sign-in step exchanges
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      # Read by infra/params/stage.bicepparam
      ADMIN_SSH_PUBLIC_KEY: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
      APP_IDENTITY_PRINCIPAL_ID: ${{ vars.APP_IDENTITY_PRINCIPAL_ID }}
      RUN_COMMAND_ROLE_ID: ${{ vars.RUN_COMMAND_ROLE_ID }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # The VM clones this repository on first boot (see infra/params/stage.bicepparam).
      REPO_URL: https://github.com/${{ github.repository }}.git
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Not azure/login: this repository only allows GitHub-owned actions. This does the same OIDC exchange with
      # the Azure CLI: GitHub issues the job's token (ACTIONS_ID_TOKEN_REQUEST_* exist because of id-token: write)
      # and Azure checks it against the identity's federated credential for this environment.
      - name: Sign in to Azure (OIDC)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token="$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az account show --query '{subscription:name, tenant:tenantId}' --output yaml

      - name: What would change
        env:
          AZURE_CORE_NO_COLOR: "true"   # plain text for the run summary
        run: |
          set -uo pipefail
          # The output goes to a file so that the exit code of az decides the step: a failed what-if must be red,
          # and its error text must still reach the run summary.
          out="$(mktemp)"
          rc=0
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/params/stage.bicepparam \
            --exclude-change-types NoChange Ignore > "$out" 2>&1 || rc=$?
          {
            echo '### What-if'
            echo '```'
            cat "$out"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Deploy (incremental)
        if: env.MODE == 'apply'
        run: |
          set -euo pipefail   # a failed deployment must fail the step, not just the tee after it
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name main \
            --template-file infra/main.bicep \
            --parameters infra/params/stage.bicepparam \
            --mode Incremental \
            --query 'properties.outputs.{vm:vmName.value, publicIp:vmPublicIp.value, registry:registryLoginServer.value, keyVault:keyVaultName.value, postgres:postgresHost.value}' \
            --output yaml | tee -a "$GITHUB_STEP_SUMMARY"
