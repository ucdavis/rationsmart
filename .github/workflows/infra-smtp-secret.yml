# Updates only the smtp-password secret of the Key Vault (infra/keyvault-smtp-secret.bicep). Started by hand only.
# Use it when the SMTP_PASSWORD secret of the stage-infra environment was wrong or has changed: the Infrastructure
# workflow would also rewrite the other secrets and re-evaluate the VM and the database, this one cannot.
# Afterwards run Deploy with app-release: the release rebuilds backend/.env from Key Vault.
#
# Same sign-in, environment approval and concurrency group as the Infrastructure workflow. Incremental mode only.
# No step interpolates event data into a command: every value reaches a script through env:.

name: Infrastructure (SMTP secret)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "whatif shows the change only; apply also writes the secret"
        type: choice
        options: [whatif, apply]
        default: whatif
      key_vault_name:
        description: "Name of the Key Vault (the keyVault output of the Infrastructure workflow; not secret)"
        type: string
        required: true

permissions:
  contents: read

# One group with the Deploy and Infrastructure workflows: a release and this change never run at the same time.
concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  # No Azure access: lints and compiles the template and its parameter file.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint and compile the template
        env:
          # Placeholder values: the parameter file only needs the variables to exist to compile.
          KEY_VAULT_NAME: placeholder
          SMTP_PASSWORD: placeholder
        run: |
          az bicep lint --file infra/keyvault-smtp-secret.bicep
          az bicep build-params --file infra/params/stage-smtp-secret.bicepparam --stdout > /dev/null

  # Needs a person's approval (environment protection rules).
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: stage-infra
    permissions:
      id-token: write   # lets the job ask GitHub for the OIDC token that the sign-in step exchanges
      contents: read
    env:
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      # Read by infra/params/stage-smtp-secret.bicepparam
      KEY_VAULT_NAME: ${{ inputs.key_vault_name }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing is printed about the value except what is wrong with it. vm-deploy.sh refuses a single quote
      # in a secret, so such a value would break the next release.
      - name: Check the inputs
        run: |
          set -euo pipefail
          [[ "$KEY_VAULT_NAME" =~ ^[a-zA-Z][a-zA-Z0-9-]{1,22}[a-zA-Z0-9]$ ]] || { echo "::error::key_vault_name is not a valid Key Vault name"; exit 1; }
          [[ -n "$SMTP_PASSWORD" ]] || { echo "::error::the SMTP_PASSWORD secret of the stage-infra environment is not set or is empty"; exit 1; }
          [[ "$SMTP_PASSWORD" != *[[:space:]]* ]] || { echo "::error::SMTP_PASSWORD contains whitespace or a newline (check the ends of the pasted value)"; exit 1; }
          [[ "$SMTP_PASSWORD" != *"'"* ]] || { echo "::error::SMTP_PASSWORD contains a single quote, which backend/.env cannot hold"; exit 1; }

      # Not azure/login: this repository only allows GitHub-owned actions (same exchange as infra.yml).
      - name: Sign in to Azure (OIDC)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token="$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az account show --query '{subscription:name, tenant:tenantId}' --output yaml

      # The what-if result decides the next step: if anything other than the smtp-password secret would change,
      # the run stops here, in both modes.
      - name: What would change
        env:
          AZURE_CORE_NO_COLOR: "true"   # plain text for the run summary
        run: |
          set -uo pipefail
          # stdout (the JSON) and stderr (warnings, errors) go to separate files: a warning must not corrupt the JSON.
          out="$(mktemp)"; err="$(mktemp)"
          rc=0
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name smtp-secret \
            --template-file infra/keyvault-smtp-secret.bicep \
            --parameters infra/params/stage-smtp-secret.bicepparam \
            --no-pretty-print > "$out" 2> "$err" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            { echo '### What-if failed'; echo '```'; cat "$err" "$out"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
          # Fail closed: without a parsed list of changes the run stops, in both modes.
          if ! jq -e '.changes | type == "array"' "$out" > /dev/null 2>&1; then
            echo "::error::the what-if result could not be read; nothing was applied"
            exit 1
          fi
          # Resources the template would change (NoChange and Ignore are not changes).
          changed="$(jq -c '[.changes[] | select(.changeType != "NoChange" and .changeType != "Ignore")]' "$out")" \
            || { echo "::error::the what-if result could not be read; nothing was applied"; exit 1; }
          others="$(jq -r '[.[] | select((.resourceId | endswith("/secrets/smtp-password")) | not)] | length' <<<"$changed")" \
            || { echo "::error::the what-if result could not be read; nothing was applied"; exit 1; }
          {
            echo '### What-if'
            jq -r '.[] | "- \(.changeType): \(.resourceId)"' <<<"$changed"
            [[ "$(jq length <<<"$changed")" -gt 0 ]] || echo '- no change reported (the value of a secret is not always compared; apply still writes it)'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ ! "$others" =~ ^[0-9]+$ || "$others" -ne 0 ]]; then
            echo "::error::the what-if reports changes to resources other than the smtp-password secret; nothing was applied"
            exit 1
          fi

      - name: Deploy (incremental)
        if: env.MODE == 'apply'
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name smtp-secret \
            --template-file infra/keyvault-smtp-secret.bicep \
            --parameters infra/params/stage-smtp-secret.bicepparam \
            --mode Incremental \
            --query 'properties.{state:provisioningState, resources:outputResources[].id}' \
            --output yaml | tee -a "$GITHUB_STEP_SUMMARY"
