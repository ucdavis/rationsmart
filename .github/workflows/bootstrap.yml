name: Bootstrap

# Two modes, both started by hand and both run as an identity that is Owner on the subscription. The jobs have no
# environment, so they read the repository-level variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID
# (the Owner identity). Run from a branch that identity trusts.
#
#   bootstrap  one-time setup: creates the resource group and the two pipeline identities (infra/bootstrap/oidc.bicep).
#              Afterwards, set the environment variables to the `infra` and `app` identities printed in the run summary,
#              and delete the repository-level variables.
#   preflight  read-only check before the Infrastructure workflow: resource provider registration, vCPU quota, VM and
#              PostgreSQL size availability and the policy assignments that apply. It changes nothing in Azure.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "bootstrap creates the resource group and identities; preflight only reads and reports"
        type: choice
        options: [bootstrap, preflight]
        default: bootstrap
      resource_group:
        description: Resource group to create or reuse (bootstrap)
        default: rg-rationsmart-stage
      location:
        description: Azure region (resource group for bootstrap, the region to check for preflight)
        default: eastus2

permissions:
  contents: read

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.mode == 'bootstrap'
    runs-on: ubuntu-latest
    # No `environment:` on purpose: the Owner identity is trusted for the branches main and test/azure-pipeline
    # (subject ref:refs/heads/<branch>), which GitHub issues only to jobs without an environment.
    permissions:
      id-token: write   # lets the job ask GitHub for the OIDC token that the sign-in step exchanges
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Not azure/login: this repository only allows GitHub-owned actions. This does the same OIDC exchange with
      # the Azure CLI: GitHub issues the job's token (ACTIONS_ID_TOKEN_REQUEST_* exist because of id-token: write)
      # and Azure checks it against the identity's federated credential.
      - name: Sign in to Azure (OIDC)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token="$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az account show --query '{subscription:name, tenant:tenantId}' --output yaml

      - name: Create the resource group
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          LOCATION: ${{ inputs.location }}
        run: az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

      - name: Create the pipeline identities
        env:
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail   # a failed deployment must fail the step, not just the tee after it
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name oidc \
            --template-file infra/bootstrap/oidc.bicep \
            --parameters githubRepo="$GITHUB_REPO" environmentName=stage \
            --query 'properties.outputs.{infraClientId:infraClientId.value, appClientId:appClientId.value, appPrincipalId:appPrincipalId.value, runCommandRoleId:runCommandRoleId.value, tenantId:tenantId.value}' \
            --output yaml | { echo '### Bootstrap outputs (not secret)'; echo '```yaml'; cat; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  # Read-only: nothing below creates, changes or deletes anything in Azure.
  preflight:
    if: inputs.mode == 'preflight'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job ask GitHub for the OIDC token that the sign-in step exchanges
      contents: read
    env:
      LOCATION: ${{ inputs.location }}
    steps:
      - name: Sign in to Azure (OIDC)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token="$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az account show --query '{subscription:name, tenant:tenantId}' --output yaml

      # Each check prints to the summary and never fails the job: a read that is not allowed is reported, not fatal.
      - name: Resource providers
        run: |
          set -uo pipefail
          {
            echo '### Resource providers (must be Registered)'
            echo '```'
            az provider list --query "[?contains('Microsoft.Compute Microsoft.Network Microsoft.DBforPostgreSQL Microsoft.KeyVault Microsoft.ManagedIdentity Microsoft.Authorization', namespace)].{namespace:namespace, state:registrationState}" --output table 2>&1 || echo "(failed)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: vCPU quota
        run: |
          set -uo pipefail
          {
            echo "### vCPU quota in $LOCATION (the VM needs 4 in the Dasv6 family)"
            echo '```'
            # Only the lines with a non-zero limit: a family at 0 cannot be used until the quota is raised.
            az vm list-usage --location "$LOCATION" --query "[].{name:name.localizedValue, used:currentValue, limit:limit}" --output tsv 2>&1 \
              | awk -F'\t' '$3 > 0' | grep -iE "regional vCPUs|D[a-z]*s? ?v[3-6]|B[a-z]* Family|E[a-z]*s? ?v[3-6]" || echo "(no matching line with a non-zero limit, or the command failed)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: VM size availability
        run: |
          set -uo pipefail
          {
            echo "### Standard_D4as_v6 in $LOCATION (zones, restrictions)"
            echo '```'
            az vm list-skus --location "$LOCATION" --size Standard_D4as_v6 --resource-type virtualMachines \
              --query "[].{name:name, zones:locationInfo[0].zones, restrictions:restrictions[].reasonCode}" --output yaml 2>&1 || echo "(failed)"
            echo '```'
            echo "### 4 to 8 vCPU D, E and B sizes in $LOCATION that this subscription can use (no restriction): name, vCPUs, GB RAM, zones"
            echo '```'
            az vm list-skus --location "$LOCATION" --resource-type virtualMachines --output json 2>/dev/null \
              | jq -r '.[] | select((.restrictions | length) == 0) | select(.name | test("^Standard_(D|E|B)[0-9]+[a-z]*_v[3-6]$|^Standard_B[0-9]+m?s$")) | [.name, (.capabilities[] | select(.name == "vCPUs").value), (.capabilities[] | select(.name == "MemoryGB").value), (.locationInfo[0].zones | join(","))] | @tsv' \
              | awk -F'\t' '$2 >= 4 && $2 <= 8 && $3 >= 16' | sort -u | head -40 || echo "(failed)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: PostgreSQL size availability
        run: |
          set -uo pipefail
          {
            echo "### PostgreSQL Flexible Server Standard_D2ds_v5 in $LOCATION"
            echo '```'
            az postgres flexible-server list-skus --location "$LOCATION" --output json 2>/dev/null \
              | jq '[.. | objects | select(.name? == "Standard_D2ds_v5")] | .[0:2]' || echo "(failed)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Policy assignments that apply
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -uo pipefail
          {
            echo '### Policy assignments that apply to this subscription'
            echo '```'
            az policy assignment list --query "[].{name:displayName, scope:scope, mode:enforcementMode}" --output table 2>&1 || echo "(failed)"
            echo '```'
            echo '### Policy assignments at the UCD management group and the tenant root (if readable)'
            echo '```'
            for mg in UCD "$AZURE_TENANT_ID"; do
              echo "-- $mg"
              az policy assignment list --scope "/providers/Microsoft.Management/managementGroups/$mg" --disable-scope-strict-match \
                --query "[].{name:displayName, effect:enforcementMode}" --output table 2>&1 | head -40 || echo "(not readable)"
            done
            echo '```'
            echo '### Policies inside the initiative that denied the registry (readable only with access to the management group)'
            echo '```'
            az policy set-definition show --name 239140fcd1414b3ebb6e9ba7 --management-group "$AZURE_TENANT_ID" \
              --query "policyDefinitions[].{policy:policyDefinitionReferenceId, effect:parameters.effect.value}" --output table 2>&1 \
              || echo "(not readable with this identity: ask the UCD policy administrator for the list)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
