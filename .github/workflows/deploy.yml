# Release: runs deploy/vm-deploy.sh on the VM (through an Azure run-command), which checks out this commit, builds the
# images on the VM and calls ./deploy.sh: backup, migrations, restart, smoke test, automatic rollback.
# Signs in to Azure with OIDC; a person must approve the "stage" environment first. See INFRASTRUCTURE.md.
#
# Started by hand only (Run workflow): there are deliberately no push or pull_request triggers, so nothing is
# released when this reaches main. To release on every merge later, add a push trigger back in a pull request to main.
# No step below interpolates event data (titles, branch names, commit messages) into a command: every value
# reaches a script through env:.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "up deploys this commit; rollback returns the VM to the previous images; seed-dry-run and seed load the data pack (see deploy/vm-data.sh)"
        type: choice
        options: [up, rollback, seed-dry-run, seed]
        default: up

permissions:
  contents: read

# One group with the Infrastructure workflow: a release never runs while infrastructure is being changed.
concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      id-token: write   # lets the job ask GitHub for the OIDC token that the sign-in step exchanges
      contents: read
    env:
      DEPLOY_ACTION: ${{ inputs.action || 'up' }}
      RELEASE_SHA: ${{ github.sha }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      VM_NAME: ${{ vars.VM_NAME }}
      KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      SMTP_SERVER: ${{ vars.SMTP_SERVER }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      FROM_EMAIL: ${{ vars.FROM_EMAIL }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Not azure/login: this repository only allows GitHub-owned actions. This does the same OIDC exchange with
      # the Azure CLI: GitHub issues the job's token (ACTIONS_ID_TOKEN_REQUEST_* exist because of id-token: write)
      # and Azure checks it against the identity's federated credential for this environment.
      - name: Sign in to Azure (OIDC)
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          token="$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::$token"
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az account show --query '{subscription:name, tenant:tenantId}' --output yaml

      # The script is sent as text: the workflow's own copy of deploy/vm-deploy.sh runs, preceded by the (non-secret)
      # variables it needs. Secrets are never sent: the VM reads them from Key Vault with its own identity.
      - name: Release on the VM
        run: |
          set -euo pipefail
          script="$(mktemp)"
          for v in DEPLOY_ACTION RELEASE_SHA KEY_VAULT_NAME POSTGRES_HOST POSTGRES_USER POSTGRES_DB \
                   SMTP_SERVER SMTP_PORT SMTP_USERNAME FROM_EMAIL API_BASE_URL ALLOWED_ORIGINS; do
            printf 'export %s=%q\n' "$v" "${!v}" >> "$script"
          done
          # The data actions run vm-data.sh (checkout plus ./deploy.sh seed); up and rollback run vm-deploy.sh.
          case "$DEPLOY_ACTION" in
            seed-dry-run|seed) printf 'export DATA_ACTION=%q\n' "$DEPLOY_ACTION" >> "$script"; cat deploy/vm-data.sh >> "$script" ;;
            *) cat deploy/vm-deploy.sh >> "$script" ;;
          esac

          # Sent base64-encoded and run with bash on the VM: the run-command's own shell is not guaranteed to be bash.
          payload="$(base64 -w0 "$script")"
          outer="set -eu; f=\$(mktemp); echo '$payload' | base64 -d > \"\$f\"; set +e; bash \"\$f\"; rc=\$?; rm -f \"\$f\"; exit \$rc"

          name="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Removes the run command (it holds the script text) however this step ends.
          trap 'az vm run-command delete --resource-group "$RESOURCE_GROUP" --vm-name "$VM_NAME" --name "$name" --yes --output none >/dev/null 2>&1 || true' EXIT

          # Without --location the CLI reads the resource group to find its region, and the "app" identity may not read
          # the group (its run-command role covers only the VM). The VM's own location is readable with that role.
          location="$(az vm show --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" --query location --output tsv)"

          # The create call can fail for a script that ran and failed, so its status alone does not decide the result.
          if ! az vm run-command create \
            --resource-group "$RESOURCE_GROUP" --vm-name "$VM_NAME" --name "$name" --location "$location" \
            --script "$outer" --async-execution false --timeout-in-seconds 3300 --output none; then
            echo "::warning::az vm run-command create returned an error (shown above); reading the command's own result"
          fi

          # The command's own result decides success.
          if ! result="$(az vm run-command show --resource-group "$RESOURCE_GROUP" --vm-name "$VM_NAME" --name "$name" --instance-view --output json)"; then
            echo "::error::the run command was not created: check the 'app' identity's run-command role on $VM_NAME, and that the VM is running"
            exit 1
          fi
          jq -r '.instanceView.output // ""' <<<"$result"
          jq -r '.instanceView.error // ""' <<<"$result" >&2
          code="$(jq -r '.instanceView.exitCode // 1' <<<"$result")"
          echo "exit code on the VM: $code"
          exit "$code"
