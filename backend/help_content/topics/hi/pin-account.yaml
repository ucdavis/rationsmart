# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: PIN और खाता
summary: PIN भूल जाना, PIN बदलना, अपनी प्रोफ़ाइल बदलना या अपना खाता हटाना।
screen_label: आपकी प्रोफ़ाइल
chapters:
- यह वीडियो क्या दिखाता है
- PIN भूल गए
- नया PIN बनाएँ
- अपना PIN बदलें
- अपनी प्रोफ़ाइल अपडेट करें
- पुराना 4 अंकों का PIN
- अपना खाता हटाएँ
steps:
- text: PIN भूल गए? लॉगिन स्क्रीन पर 'Forgot PIN? Tap here' (PIN भूल गए? यहाँ टैप करें) पर टैप करें, अपना पंजीकृत ईमेल पता लिखें और 'आगे बढ़ें' पर टैप करें।
- text: 'RationSmart से आया ईमेल खोलें और ''Reset my PIN'' (मेरा PIN रीसेट करें) पर टैप करें। एक पेज खुलेगा: अपना नया 6 अंकों का PIN दो बार लिखें और ''Save new PIN'' (नया PIN सहेजें) पर टैप करें। लिंक सिर्फ़ एक बार और 30 मिनट तक काम करता है; जब तक आप नया PIN सहेजते नहीं, आपका पुराना PIN काम करता रहता है।'
- text: 'अपने नए PIN से लॉगिन करें। PIN याद होने पर उसे किसी और समय बदलने के लिए मेनू खोलें, ''प्रोफ़ाइल'' पर टैप करें, फिर ''PIN बदलें'' पर: अपना मौजूदा PIN लिखें, फिर नया PIN दो बार, और ''PIN अपडेट करें'' पर टैप करें।'
- text: अपना नाम, देश या भाषा बदलने के लिए 'प्रोफ़ाइल' खोलें, बदलाव करें और 'प्रोफ़ाइल अपडेट करें' पर टैप करें। यह बटन तभी काम करता है जब आप कुछ बदलते हैं।
- text: अभी भी पुराना 4 अंकों का PIN है? उससे लॉगिन करने पर ऐप आपसे 6 अंकों का PIN बनाने को कहता है। पुराना PIN लिखें, फिर नया PIN दो बार।
- text: 'अपना खाता हटाने के लिए ''प्रोफ़ाइल'' खोलें, ''हटाएं'' पर टैप करें, फिर ''हाँ'' पर, और अपने PIN से पुष्टि करें। बाद में वापस आने के लिए उसी ईमेल पते से फिर से पंजीकरण करें: आपकी सहेजी गई रिपोर्टें वापस आ जाती हैं।'
problems:
- title: कोई ईमेल नहीं आया
  text: स्पैम फ़ोल्डर में देखें और अपना लिखा हुआ पता जाँचें। एक मिनट बाद आप फिर से माँग सकते हैं। आपकी सुरक्षा के लिए ऐप हर पते के लिए एक जैसा संदेश दिखाता है।
- title: '''Link expired'' (लिंक की समय-सीमा खत्म हो गई)'
  text: रीसेट लिंक सिर्फ़ एक बार और सिर्फ़ 30 मिनट तक काम करता है। ऐप खोलें, फिर से 'Forgot PIN? Tap here' पर टैप करें और सबसे नए ईमेल का उपयोग करें।
- title: '''नया PIN मेल नहीं खाता'''
  text: दोनों बॉक्स में बिल्कुल एक जैसा नया PIN लिखें।
- title: खाता हटाते समय 'Invalid PIN.' (अमान्य PIN)
  text: PIN गलत था, इसलिए कुछ भी नहीं हटाया गया। अपना मौजूदा PIN लिखें।
- title: '''नाम खाली नहीं हो सकता।'''
  text: '''प्रोफ़ाइल अपडेट करें'' पर टैप करने से पहले नाम लिखें।'
