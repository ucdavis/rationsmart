title: 'त्वरित शुरुआत: लॉगिन से रिपोर्ट तक'
summary: 'कुछ ही मिनटों में पूरा ऐप: लॉगिन करें, अपने पशु का विवरण दें, अपने पशु आहार चुनें और सबसे सस्ता आहार पाएँ।'
screen_label: सहायता एवं समर्थन
chapters:
- RationSmart क्या करता है
- लॉगिन करें
- अपने पशु का विवरण दें
- पशु आहार और कीमतें चुनें
- सबसे सस्ता आहार पाएँ
- रिपोर्ट सहेजें
- अगला पशु
steps:
- text: अपने ईमेल और 6 अंकों के PIN से लॉगिन करें। ऐप पशुओ से संबंधित जानकारी स्क्रीन पर खुलता है।
- text: पशुओ से संबंधित जानकारी स्क्रीन पर सिमुलेशन नाम लिखें, देश और शारीरिक अवस्था चुनें, और पशु का विवरण भरें। 'फीड (आहार) जारी रखें' पर टैप करें।
- text: पशु आहार का चयन स्क्रीन पर 'आहार सिफारिश' चुना रहने दें। हर पशु आहार कार्ड में पहले आहार प्रकार, फिर पशु आहार श्रेणी, फिर पशु आहार चुनें, और उसकी प्रति kg कीमत लिखें। कम से कम एक चारा (forage) ज़रूर शामिल करें।
- text: '''सिफारिश तैयार करें'' पर टैप करें। कुछ सेकंड बाद रिपोर्ट सबसे सस्ता आहार दिखाती है: हर पशु आहार प्रति दिन कितने kg देना है, और प्रति दिन की लागत।'
- text: रिपोर्ट रखने के लिए 'रिपोर्ट सहेजें' पर टैप करें। आपकी सहेजी गई रिपोर्टें और उनकी PDF मेनू में 'पशु आहार रिपोर्ट' के अंदर हैं।
- text: अगले पशु के लिए 'नया विवरण दर्ज करें' पर टैप करें।
problems:
- title: '''फीड (आहार) जारी रखें'' स्लेटी (ग्रे) ही रहता है'
  text: कोई ज़रूरी फ़ील्ड खाली है, या कोई मान अपनी सीमा से बाहर है (सीमा फ़ील्ड के नीचे लाल रंग में दिखती है)। उसे ठीक करें, बटन हरा हो जाएगा।
- title: मेरा पशु बछड़ा है
  text: शारीरिक अवस्था में 'बछड़े' चुनें। तब ऐप पशु आहार वाले आहार की जगह दूध पिलाने की योजना दिखाता है।
- title: '''चारा आवश्यक'''
  text: हर आहार में कम से कम एक पशु आहार चारा (Forage) प्रकार का होना चाहिए। एक चारा जोड़ें और फिर से आहार तैयार करें।
