title: अपनी रिपोर्टें सहेजें, साझा करें और ढूँढें
summary: रिपोर्ट रखें, उसकी PDF पाएँ, उसे साझा करें और बाद में फिर से खोलें।
screen_label: पशु आहार रिपोर्ट
chapters:
- यह वीडियो क्या दिखाता है
- रिपोर्ट सहेजें
- PDF पाएँ, देखें, साझा करें
- पशु आहार रिपोर्ट
- PDF तैयार होना बाकी है
- कई रिपोर्टें
- सहेजा गया केस दोबारा इस्तेमाल करें
- बिना सहेजी रिपोर्टें
steps:
- text: रिपोर्ट पर 'रिपोर्ट सहेजें' पर टैप करें। ऐप दिखाता है 'Report saved successfully' (रिपोर्ट सफलतापूर्वक सहेजी गई)। उसी रिपोर्ट को दोबारा सहेजने से दूसरी कॉपी नहीं बनती।
- text: PDF बनाने के लिए 'PDF पाएं' पर टैप करें। तैयार होने पर 'PDF देखें' उसे खोलता है और 'रिपोर्ट साझा करें' उसे आपके फ़ोन के साझा करने के विकल्पों से भेजता है (या PDF का लिंक कॉपी करता है)।
- text: अपनी सहेजी गई रिपोर्टें देखने के लिए मेनू खोलें और 'पशु आहार रिपोर्ट' पर टैप करें; सबसे नई रिपोर्ट सबसे ऊपर होती है। 'रिपोर्ट देखें' PDF खोलता है; रिपोर्ट ID, रिपोर्ट प्रकार और दिनांक देखने के लिए रिपोर्ट के नीचे वाली पट्टी पर टैप करें।
- text: नई रिपोर्ट पर एक मिनट तक 'PDF तैयार होना बाकी है' दिख सकता है, जब तक उसकी PDF बन रही हो। थोड़ी देर बाद 'पशु आहार रिपोर्ट' फिर से खोलें।
- text: 20 से ज़्यादा सहेजी गई रिपोर्टें होने पर नीचे दिए अगले और पिछले पेज के बटन इस्तेमाल करें।
- text: सहेजे गए केस को दोबारा इस्तेमाल करने के लिए पशुओ से संबंधित जानकारी खोलें और 'सिमुलेशन (अनुकरण) विवरण' के पास इतिहास (history) आइकन पर टैप करें। वहाँ सिर्फ़ सहेजी गई रिपोर्टें दिखती हैं।
- text: जो रिपोर्ट आपने नहीं सहेजी, वह इस फ़ोन पर 24 घंटे तक रहती है, फिर हट जाती है। जिनकी ज़रूरत है, उन्हें सहेज लें।
problems:
- title: '''कोई सहेजी गई रिपोर्ट उपलब्ध नहीं है।'''
  text: आपने अभी तक कोई रिपोर्ट नहीं सहेजी है। 'रिपोर्ट बनाएं' पर टैप करें, आहार तैयार करें और 'रिपोर्ट सहेजें' पर टैप करें।
- title: '''PDF तैयार होना बाकी है'' हटता नहीं'
  text: '''पशु आहार रिपोर्ट'' बंद करके फिर से खोलें। अगर कुछ मिनट बाद भी यही दिखे, तो सूची से रिपोर्ट खोलें और ''PDF पाएं'' पर टैप करें।'
- title: '''PDF लिंक क्लिपबोर्ड पर कॉपी किया गया'''
  text: यहाँ आपके फ़ोन में साझा करने का विकल्प (share sheet) नहीं है, इसलिए ऐप ने उसकी जगह लिंक कॉपी कर दिया। इसे किसी संदेश या ईमेल में चिपकाएँ (paste करें)।
- title: मेरी रिपोर्ट पशुओ से संबंधित जानकारी के इतिहास में नहीं है
  text: इतिहास में सिर्फ़ सहेजी गई रिपोर्टें दिखती हैं। केस को फिर से चलाएँ और 'रिपोर्ट सहेजें' पर टैप करें।
