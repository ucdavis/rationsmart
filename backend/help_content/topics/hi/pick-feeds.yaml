title: पशु आहार और कीमतें चुनें
summary: आपके पास जो पशु आहार हैं उन्हें चुनें, हर एक की कीमत लिखें और आहार की गणना चलाएँ।
screen_label: पशु आहार का चयन
chapters:
- यह वीडियो क्या दिखाता है
- तरीका (मोड) चुनें
- पशु आहार कार्ड भरें
- पशु आहार खोजें
- कीमत लिखें
- मूल्यांकन के लिए मात्राएँ
- और पशु आहार जोड़ें
- आहार की गणना चलाएँ
- अपने पशु आहार और सीमाएँ
steps:
- text: सबसे ऊपर 'आहार सिफारिश' चुनें (ऐप सबसे सस्ता आहार ढूँढता है) या 'आहार मूल्यांकन' (आप अभी जितनी मात्रा खिलाते हैं वह लिखते हैं, और ऐप उसकी जाँच करता है)।
- text: '''FEED 1'' (पशु आहार 1) में आहार प्रकार चुनें (चारा/Forage, दाना/Concentrate या संपूर्ण आहार/Complete diet), फिर पशु आहार श्रेणी, फिर पशु आहार। हर सूची तभी खुलती है जब आप उससे पहले वाली चुन लेते हैं।'
- text: 'या खोजें: किसी कार्ड पर टैप करें ताकि उस पर ''चयनित'' दिखे, फिर खोज बॉक्स में पशु आहार के नाम का कुछ हिस्सा लिखें (जैसे ''soybean'')। उस कार्ड को भरने के लिए किसी परिणाम पर टैप करें।'
- text: अपने देश की मुद्रा में प्रति kg कीमत लिखें। लेबल पर मुद्रा दिखती है, जैसे 'Price ETB/KG'।
- text: '''आहार मूल्यांकन'' में यह भी लिखें कि आप अभी प्रति दिन कितने kg खिलाते हैं। कार्ड लागत दिखाता है (कीमत × kg)।'
- text: हर अतिरिक्त पशु आहार के लिए 'और पशु आहार जोड़ें' पर टैप करें; किसी कार्ड को उसके कूड़ेदान (bin) आइकन से हटाएँ। कम से कम एक चारा ज़रूर शामिल करें।
- text: '''सिफारिश तैयार करें'' पर टैप करें (या ''आहार मूल्यांकन'' में ''मूल्यांकन प्राप्त करें'' पर)। कुछ सेकंड बाद रिपोर्ट खुल जाती है।'
- text: 'वैकल्पिक: ''अनुकूलित पशु आहार'' से आप अपना खुद का पशु आहार जोड़ सकते हैं (विषय 8)। ''अनुकूलित आहार सीमाएँ'' और कार्ड पर ''समावेशन सीमाएं सेट करें'' से आहार को नियंत्रित किया जाता है (विषय 9)।'
problems:
- title: '''चारा आवश्यक'''
  text: हर आहार में कम से कम एक पशु आहार चारा (Forage) प्रकार का होना चाहिए। 'ठीक है, चारा जोड़ें' पर टैप करें, एक चारा जोड़ें और फिर से आहार तैयार करें।
- title: '''अपूर्ण आहार'''
  text: किसी कार्ड में प्रकार चुना है लेकिन पशु आहार नहीं। उसे पूरा करने के लिए 'नहीं, समीक्षा करें' पर टैप करें, या उस कार्ड के बिना चलाने के लिए 'हाँ, आगे बढ़ें' पर।
- title: '''यह चारा पहले से चुना गया है'''
  text: हर पशु आहार सिर्फ़ एक कार्ड पर हो सकता है। जिस कार्ड पर वह पहले से है, उसी पर कीमत बदलें।
- title: '''कीमत ऋणात्मक नहीं हो सकती।'''
  text: 0 या उससे ज़्यादा कीमत लिखें।
- title: '''हर चारे के लिए 0 से अधिक मात्रा दर्ज करें, या चारा हटा दें।'''
  text: आहार मूल्यांकन में हर पशु आहार के लिए वह मात्रा (kg प्रति दिन) चाहिए जो आप अभी खिलाते हैं। उसे लिखें, या वह पशु आहार हटा दें।
- title: जिस पशु आहार की मुझे उम्मीद थी, वह सूची में नहीं है
  text: सूचियों में पशुओ से संबंधित जानकारी पर चुने गए देश के पशु आहार दिखते हैं, साथ में आपके अपने अनुकूलित पशु आहार। देश जाँचें, या 'अनुकूलित पशु आहार' से वह पशु आहार जोड़ें।
