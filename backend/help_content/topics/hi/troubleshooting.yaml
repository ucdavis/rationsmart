title: जब कोई आहार न मिले, और दूसरी समस्याएँ
summary: क्या करें जब रिपोर्ट में कोई आहार न मिले, कोई संदेश दिखे या ऐप जवाब न दे।
screen_label: सिफारिश रिपोर्ट
chapters:
- यह वीडियो क्या दिखाता है
- कोई समाधान नहीं मिला
- नोट्स पढ़ें
- पशु आहार जोड़ें
- अपनी सीमाएँ ढीली करें
- पशु की जाँच करें
- आहार मूल्यांकन इस्तेमाल करें
- फिर से कोशिश करें
steps:
- text: जब रिपोर्ट में 'कोई अनुकूलित समाधान नहीं मिला' लिखा हो, तो आपके पशु आहारों का कोई भी मिश्रण इस पशु की ज़रूरतें पूरी नहीं करता। तब आहार की तालिका नहीं होती; 'नोट्स' कार्ड बताता है कि क्यों।
- text: '''Violated Parameters'' (जो मानदंड पूरे नहीं हुए) पढ़ें: हर लाइन बताती है कि आहार क्या पूरा नहीं कर सका, जैसे ''Phosphorus Requirement: below minimum'' (फॉस्फोरस की ज़रूरत: न्यूनतम से कम) या ''Total Fibre (NDF): above maximum'' (कुल रेशा (NDF): अधिकतम से ज़्यादा)। ''Recommendations'' (सिफारिशें) बताती हैं कि क्या बदलें।'
- text: 'ऐसा पशु आहार जोड़ें जो कमी पूरी करे: कैल्शियम या फॉस्फोरस के लिए खनिज मिश्रण, प्रोटीन के लिए प्रोटीन खली, ऊर्जा के लिए अनाज। सिर्फ़ एक या दो पशु आहार वाला आहार अक्सर हर ज़रूरत पूरी नहीं कर पाता।'
- text: अगर आपने सीमाएँ तय की हैं ('समावेशन सीमाएं सेट करें' या 'अनुकूलित आहार सीमाएँ'), तो उन्हें ढीला करें या हटाएँ। रिपोर्ट का 'आपके द्वारा तय सीमाएँ' कार्ड दिखाता है कि आपने कौन-सी सीमाएँ तय की हैं।
- text: 'पशु की जाँच करें: आपके पास जो पशु आहार हैं, उनके हिसाब से बहुत ज़्यादा दूध का लक्ष्य पूरा नहीं हो सकता। दूध का लक्ष्य कम करें, या बेहतर पशु आहार जोड़ें।'
- text: आपने खुद जो आहार चुना है, उसमें किस पोषक तत्व की कमी है, यह देखने के लिए 'आहार मूल्यांकन' इस्तेमाल करें (विषय 6)।
- text: फिर पीछे वाले तीर से पशु आहार का चयन स्क्रीन पर जाएँ, बदलाव करें और फिर से 'सिफारिश तैयार करें' पर टैप करें।
problems:
- title: '''चारा आवश्यक'''
  text: हर आहार में कम से कम एक पशु आहार चारा (Forage) प्रकार का होना चाहिए। एक चारा जोड़ें और फिर से आहार तैयार करें।
- title: '''… of the selected feeds are no longer available'' (चुने गए पशु आहारों में से … अब उपलब्ध नहीं हैं)'
  text: कोई पशु आहार सूची (लाइब्रेरी) से हटा दिया गया है। उसे चयन से हटाएँ और पशु आहार फिर से चुनें।
- title: रिपोर्ट बहुत देर लेती है या खुलती नहीं
  text: अपना इंटरनेट कनेक्शन जाँचें और फिर से कोशिश करें। अगर ऐसा बार-बार हो, तो सिमुलेशन नाम के साथ 'संपर्क करें' से हमें लिखें।
- title: ऐप कोई गड़बड़ी (error) दिखाता है या जवाब देना बंद कर देता है
  text: एक स्क्रीन पीछे जाएँ और फिर से कोशिश करें; आपके भरे हुए मान बने रहते हैं। अगर फिर भी न चले, तो लॉगआउट करें, फिर से लॉगिन करें, और 'प्रतिक्रिया' या 'संपर्क करें' से हमें बताएँ।
