title: सबसे कम लागत वाला आहार पाएँ और रिपोर्ट पढ़ें
summary: सिफारिश चलाएँ और रिपोर्ट का हर हिस्सा समझें।
screen_label: सिफारिश रिपोर्ट
chapters:
- यह वीडियो क्या दिखाता है
- आहार तैयार करें
- रिपोर्ट विवरण
- लागत प्रभावी आहार
- परिणाम सारांश
- दूध लागत मार्जिन
- आपके द्वारा तय सीमाएँ
- नोट्स और मीथेन
- सहेजें, PDF, अगला केस
steps:
- text: पशु आहार का चयन स्क्रीन पर 'सिफारिश तैयार करें' पर टैप करें। कुछ सेकंड तक 'आपकी रिपोर्ट तैयार की जा रही है' दिखता है, फिर 'सिफारिश रिपोर्ट' खुलती है।
- text: सबसे ऊपर 'रिपोर्ट विवरण' में रिपोर्ट ID, सिमुलेशन ID, आपका नाम और रिपोर्ट बनने का समय दिखता है। 'पशु विशेषताएं' में आपके लिखे पशु के विवरण फिर से दिखते हैं, ताकि आप उन्हें जाँच सकें।
- text: '''लागत प्रभावी आहार'' ही जवाब है: हर पशु आहार के लिए प्रति दिन कितने kg देना है, जैसा खिलाया जाता है (as fed, यानी वह वजन जो आप गाय के सामने रखते हैं), उसकी प्रति kg कीमत और प्रति दिन की लागत। आखिरी लाइन में प्रति दिन की कुल आहार लागत (Total Diet Cost) है।'
- text: '''परिणाम सारांश'' में दैनिक लागत, आहार जितने दूध के लिए बनाया गया है वह दूध, शुष्क पदार्थ सेवन (Dry Matter Intake: पानी निकालकर पशु आहार, kg प्रति दिन) और चारा : दाना (Forage : Concentrate) अनुपात दिखता है।'
- text: '''दूध लागत मार्जिन'' दूध देने वाली गायों के लिए तब दिखता है जब आपने दूध की कीमत लिखी हो। ''आहार लागत प्रति लीटर'' हर लीटर दूध पर पशु आहार की लागत है, ''दूध की कीमत प्रति लीटर'' आपकी दूध की कीमत है, और दोनों का अंतर वह है जो दूध सिर्फ़ पशु आहार की लागत के ऊपर कमाता है। मज़दूरी, पशु चिकित्सा और दूसरे खर्च इसमें शामिल नहीं हैं।'
- text: '''आपके द्वारा तय सीमाएँ'' तब दिखता है जब आप पशु आहार या आहार की सीमाएँ तय करते हैं: इसमें हर सीमा और आहार में उस पशु आहार की इस्तेमाल हुई मात्रा दिखती है (विषय 9)।'
- text: '''नोट्स'' तभी दिखता है जब किसी बात पर आपका ध्यान देना ज़रूरी हो, जैसे कोई पोषक तत्व अपने लक्ष्य से कम हो, साथ में सलाह कि क्या बदलें। ''पर्यावरणीय प्रभाव'' बताता है कि इस आहार पर गाय कितनी मीथेन बनाती है।'
- text: रिपोर्ट रखने के लिए 'रिपोर्ट सहेजें' पर टैप करें; फिर 'PDF पाएं', 'PDF देखें' या 'रिपोर्ट साझा करें' (विषय 10)। 'नया विवरण दर्ज करें' उन्हीं भरे हुए मानों के साथ अगला पशु शुरू करता है। पीछे वाला तीर आपको पशु आहार का चयन स्क्रीन पर लौटाता है, जहाँ आप पशु आहार या कीमतें बदलकर फिर से आहार तैयार कर सकते हैं।
problems:
- title: '''कोई अनुकूलित समाधान नहीं मिला'''
  text: आपके पशु आहारों का कोई भी मिश्रण इस पशु की ज़रूरतें पूरी नहीं करता। नोट्स में लिखा होता है कि क्या कमी है और क्या बदलें। विषय 12 देखें।
- title: '''दूध लागत मार्जिन'' कार्ड नहीं दिखता'
  text: यह सिर्फ़ दूध देने वाली गायों के लिए दिखता है, और तभी जब पशुओ से संबंधित जानकारी पर दूध की कीमत लिखी गई हो। वापस जाएँ, दूध की कीमत लिखें और फिर से आहार तैयार करें।
- title: '''आहार सीमा नोट्स'''
  text: आहार उस सीमा के अंदर नहीं रह सका जो आपने 'अनुकूलित आहार सीमाएँ' में तय की थी। नोट में परिणाम और आपकी सीमा दिखती है। सीमा ढीली करें या दूसरे पशु आहार जोड़ें।
- title: किसी पशु आहार की बहुत कम मात्रा दिखती है, जैसे 0.01 kg
  text: सबसे सस्ते आहार को उस पशु आहार की लगभग ज़रूरत नहीं है। आप उसे हटाकर फिर से आहार तैयार कर सकते हैं; लागत बहुत कम बदलती है।
- title: कुछ शब्द अंग्रेज़ी में ही रहते हैं
  text: ऐप में स्थिति (status) बताने वाले शब्द जानबूझकर अंग्रेज़ी में रखे गए हैं। सहेजी गई PDF में शीर्षक, नोट्स और पशु आहार के नाम रिपोर्ट की भाषा में होते हैं, जहाँ उनका अनुवाद उपलब्ध है।
