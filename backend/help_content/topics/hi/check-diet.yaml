# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: अभी जो आहार (राशन) आप खिलाते हैं, उसकी जाँच करें
summary: लिखें कि आपका पशु आज क्या खाता है, और देखें कि उसमें क्या कमी है, यह आहार कितने दूध के लिए काफ़ी है और इसकी लागत कितनी है।
screen_label: मूल्यांकन रिपोर्ट
chapters:
- यह वीडियो क्या दिखाता है
- मूल्यांकन चलाएँ
- मूल्यांकन सारांश
- शुष्क पदार्थ सेवन
- दूध उत्पादन
- पोषक तत्व संतुलन
- लागत विश्लेषण
- दूध लागत मार्जिन
- सिफारिश पाएँ
steps:
- text: पशु आहार का चयन स्क्रीन पर 'आहार मूल्यांकन' चुनें। आप अभी जो भी पशु आहार देते हैं उसे चुनें, उसकी कीमत लिखें और यह लिखें कि प्रति दिन कितने kg खिलाते हैं (जैसा खिलाया जाता है, as fed)। 'मूल्यांकन प्राप्त करें' पर टैप करें। 'मूल्यांकन रिपोर्ट' खुल जाती है।
- text: '''मूल्यांकन सारांश'' में आहार की समग्र स्थिति (Overall Status, जैसे Marginal) और सीमित करने वाला कारक (Limiting Factor) दिखता है: वह पोषक तत्व जो गाय को पीछे रोकता है।'
- text: '''शुष्क पदार्थ सेवन'' आपके पशु आहार से मिलने वाले वास्तविक सेवन (Actual Intake) की तुलना लक्षित आहार सेवन (Target Intake) से करता है, यानी गाय जितना खा सकती है। ''Below target'' (लक्ष्य से कम) का मतलब है कि आहार उससे कम पशु आहार देता है जितना गाय खा सकती थी।'
- text: '''दूध उत्पादन विश्लेषण'': ''वास्तविक दूध'' वह दूध है जिसके लिए यह आहार काफ़ी है, आपके लक्ष्य के साथ दिखाया गया। ''ऊर्जा-समर्थित'' और ''प्रोटीन-समर्थित'' बताते हैं कि हर पोषक तत्व कितने दूध के लिए काफ़ी है; जो कम है, वही सीमित पोषक (Limiting Nutrient) है।'
- text: '''पोषक तत्व संतुलन'' हर पोषक तत्व को गाय की ज़रूरत के मुकाबले अधिकता (+) या कमी (−) के रूप में दिखाता है।'
- text: '''लागत विश्लेषण'' में प्रति दिन की कुल आहार लागत, ''पशु आहार विवरण'' में हर पशु आहार की लागत, और ''प्रति लीटर दूध की लागत'' दिखती है: आहार की लागत को उस दूध से भाग देकर, जिसके लिए यह आहार काफ़ी है (वास्तविक दूध)।'
- text: '''दूध लागत मार्जिन'' प्रति लीटर पशु आहार की लागत की तुलना आपकी दूध की कीमत से करता है। मूल्यांकन में असली मायने वाली लागत लागत विश्लेषण में दी गई ''प्रति लीटर दूध की लागत'' है, क्योंकि वह उस दूध पर आधारित है जिसके लिए यह आहार सच में काफ़ी है।'
- text: उसी पशु के लिए उन्हीं पशु आहार से सबसे सस्ता आहार पाने के लिए 'सुझाया गया आहार तैयार करें' पर टैप करें। मूल्यांकन को भी सिफारिश की तरह ही सहेजें और साझा करें (विषय 10)।
problems:
- title: '''वास्तविक दूध'' मेरे लक्ष्य से कम है'
  text: आहार में सीमित पोषक (Limiting Nutrient) की कमी है। उससे भरपूर कोई पशु आहार जोड़ें (जैसे प्रोटीन की कमी हो तो कोई प्रोटीन खली), या 'सुझाया गया आहार तैयार करें' पर टैप करें।
- title: '''हर चारे के लिए 0 से अधिक मात्रा दर्ज करें, या चारा हटा दें।'''
  text: मूल्यांकन में हर पशु आहार के लिए वह मात्रा (kg प्रति दिन) चाहिए जो आप अभी खिलाते हैं। उसे लिखें, या वह पशु आहार हटा दें।
- title: जो पशु आहार मैं खुद उगाता हूँ, उसकी कोई कीमत नहीं है
  text: उसकी कीमत 0 लिखें। मूल्यांकन फिर भी चलता है; वह पशु आहार लागत में कुछ नहीं जोड़ता।
- title: '''… of the selected feeds are no longer available'' (चुने गए पशु आहारों में से … अब उपलब्ध नहीं हैं)'
  text: पिछली बार इस्तेमाल के बाद कोई पशु आहार सूची (लाइब्रेरी) से हटा दिया गया है। उसे चयन से हटाएँ और पशु आहार फिर से चुनें।
- title: मेरे बछड़े के लिए 'आहार मूल्यांकन' नहीं है
  text: बछड़ों को पशु आहार वाले आहार की जगह दूध पिलाने की योजना मिलती है (विषय 7)।
