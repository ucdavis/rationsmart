title: बछड़े को दूध पिलाने की योजना
summary: बछड़े को हर दिन कितना दूध देना है, दिन में कितनी बार, और दूध कब छुड़ाना है।
screen_label: बछड़े को दूध पिलाना
chapters:
- यह वीडियो क्या दिखाता है
- '''बछड़े'' चुनें'
- दैनिक दूध
- दूध पिलाने की बारी और दूध छुड़ाना
- एक उदाहरण
- देखभाल के सुझाव
- सहेजें और PDF
steps:
- text: पशुओ से संबंधित जानकारी स्क्रीन पर शारीरिक अवस्था 'बछड़े' चुनें। बछड़े के शरीर का वजन kg में लिखें और 'जारी रखें' पर टैप करें।
- text: '''बछड़े को दूध पिलाना'' योजना खुलती है। ''दैनिक दूध'' प्रति दिन दूध के लीटर हैं: बछड़े के शरीर के वजन का दसवाँ हिस्सा।'
- text: '''प्रति आहार'' दैनिक दूध को दिन में 2 बार पिलाने में बाँटता है। ''दूध छुड़ाएं'' वह उम्र (दिनों में) बताता है जब तक दूध पिलाना बंद करना है (56 दिन)।'
- text: 'उदाहरण: 40 kg के बछड़े को दिन में 4.0 लीटर मिलता है, दिन में दो बार 2.0 लीटर करके।'
- text: 'योजना के नीचे देखभाल के सुझाव पढ़ें। योजना एक मार्गदर्शन है: अपने पशु चिकित्सक की सलाह से इसमें बदलाव करें।'
- text: योजना रखने के लिए 'रिपोर्ट सहेजें' पर टैप करें, फिर दूध पिलाने की पूरी समय-सारणी वाली कॉपी के लिए 'PDF पाएं' पर (विषय 10)।
problems:
- title: शरीर का वजन स्वीकार नहीं होता
  text: बछड़ों के लिए शरीर का वजन 30 से 100 kg के बीच होना चाहिए। अनुमत सीमा फ़ील्ड के नीचे दिखती है।
- title: मेरे बछड़े के लिए पशु आहार का चयन स्क्रीन नहीं दिखती
  text: बछड़ों को सिर्फ़ दूध पिलाने की योजना मिलती है; ऐप उनके लिए पशु आहार वाला आहार या मूल्यांकन नहीं बनाता।
- title: मेरा बछड़ा बड़ा है और ठोस पशु आहार खाता है
  text: बढ़ते हुए छोटे पशु का आहार पाने के लिए 'बछड़े' की जगह 'बछिया' चुनें।
