# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: भाषा, प्रतिक्रिया और सहायता
summary: ऐप को अपनी भाषा में इस्तेमाल करें, हमें अपनी राय बताएँ और सहायता पाएँ।
screen_label: प्रतिक्रिया
chapters:
- यह वीडियो क्या दिखाता है
- भाषा चुनें
- आपकी डिफ़ॉल्ट भाषा
- PDF की भाषा
- प्रतिक्रिया भेजें
- आपकी पिछली प्रतिक्रियाएँ
- सहायता एवं समर्थन
steps:
- text: पशुओ से संबंधित जानकारी पर 'सिमुलेशन (अनुकरण) विवरण' में भाषा चुनें। स्क्रीनें और रिपोर्ट तुरंत उस भाषा में बदल जाती हैं। सूची में वे भाषाएँ दिखती हैं जो आपके चुने हुए देश के लिए उपलब्ध की गई हैं।
- text: किसी भाषा को अपनी डिफ़ॉल्ट (हमेशा वाली) भाषा बनाने के लिए मेनू खोलें, 'प्रोफ़ाइल' पर टैप करें, भाषा चुनें और 'प्रोफ़ाइल अपडेट करें' पर टैप करें।
- text: सहेजी गई PDF में शीर्षक, नोट्स और पशु आहार के नाम रिपोर्ट की भाषा में होते हैं, जहाँ उनका अनुवाद उपलब्ध है। संख्याएँ नहीं बदलतीं। स्थिति बताने वाले कुछ शब्द जानबूझकर अंग्रेज़ी में रखे गए हैं।
- text: प्रतिक्रिया देने के लिए मेनू खोलें और 'प्रतिक्रिया' पर टैप करें। 'ऐप को रेट करें' में 1 से 5 स्टार चुनें, 'प्रतिक्रिया श्रेणी' चुनें, अपनी टिप्पणी लिखें (1000 अक्षरों तक) और 'प्रतिक्रिया भेजे' पर टैप करें।
- text: आपकी पिछली प्रतिक्रियाएँ 'आपकी प्रतिक्रियाएं' में दिखती हैं। किसी को फिर से पढ़ने के लिए उस पर टैप करें।
- text: 'सहायता के लिए मेनू खोलें और ''सहायता एवं समर्थन'' पर टैप करें: वहाँ उपयोगकर्ता मार्गदर्शिका, अक्सर पूछे जाने वाले प्रश्न, और ''संपर्क करें'' हैं; ''संपर्क करें'' RationSmart टीम को लिखने के लिए आपका ईमेल ऐप खोलता है। ''नियम और शर्तें'' भी मेनू में है।'
problems:
- title: '''प्रतिक्रिया भेजे'' स्लेटी (ग्रे) ही रहता है'
  text: पहले स्टार रेटिंग चुनें।
- title: मेरी भाषा सूची में नहीं है
  text: भाषाएँ हर देश के लिए RationSmart टीम जोड़ती है। पशुओ से संबंधित जानकारी पर देश जाँचें, या 'संपर्क करें' से अपनी भाषा जोड़ने का अनुरोध करें।
- title: कोई भाषा छोटे कोड के रूप में दिखती है
  text: कुछ भाषाएँ अपने नाम की जगह एक कोड दिखाती हैं (जैसे 'TI')। आप उसे फिर भी चुन सकते हैं; स्क्रीनें वैसे ही काम करती हैं।
- title: स्क्रीन का कुछ पाठ अब भी अंग्रेज़ी में है
  text: उस पाठ का आपकी भाषा में अभी अनुवाद नहीं हुआ है। 'प्रतिक्रिया' से हमें बताएँ कि आपको कौन-से शब्द दिखते हैं।
