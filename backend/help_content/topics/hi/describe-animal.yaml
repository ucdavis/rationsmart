title: अपने पशु का विवरण दें
summary: 'पशुओ से संबंधित जानकारी भरें: केस का नाम, देश, पशु की अवस्था, शरीर, दूध और पर्यावरण।'
screen_label: पशुओ से संबंधित जानकारी
chapters:
- यह वीडियो क्या दिखाता है
- सिमुलेशन विवरण
- शारीरिक अवस्था
- पशु विशेषताएं
- प्रजनन संबंधी जानकारी
- दूध उत्पादन
- पर्यावरण
- फीड (आहार) जारी रखें
- केस दोबारा इस्तेमाल करें या रीसेट करें
steps:
- text: '''सिमुलेशन (अनुकरण) विवरण'' में सिमुलेशन नाम लिखें (जैसे गाय का नाम और तारीख), देश और रिपोर्ट की भाषा चुनें। देश से तय होता है कि आप कौन-से पशु आहार चुन सकते हैं और कौन-सी मुद्रा (करेंसी) होगी।'
- text: '''Physiological State'' (शारीरिक अवस्था) चुनें: दूध देने वाली गायें, सूखी गायें (ब्याने से पहले), बछिया या बछड़े। फिर फ़ॉर्म में सिर्फ़ उसी अवस्था के फ़ील्ड दिखते हैं, जिनमें सामान्य मान पहले से भरे होते हैं।'
- text: '''पशु विशेषताएं'' में नस्ल चुनें और शरीर का वजन (kg), शारीरिक स्थिति स्कोर (Body Condition Score), ब्यांत संख्या (कितनी बार ब्याई) और शारीरिक वजन वृद्धि (BW Gain, kg प्रति दिन) लिखें।'
- text: '''प्रजनन संबंधी जानकारी'' में गर्भावस्था के दिन लिखें, और दूध देने वाली गायों के लिए दुग्धवस्था के दिन (Days in Milk) भी।'
- text: 'दूध देने वाली गायों के लिए ''दूध उत्पादन'' में प्रति दिन दूध (लीटर), दूध में वसा % और दूध में प्रोटीन % लिखें। दूध की कीमत लिखना ज़रूरी नहीं है: इसे लिखने पर रिपोर्ट दूध की आय की तुलना पशु आहार की लागत से करती है।'
- text: '''पर्यावरण'' में औसत तापमान (°C) लिखें। अगर पशु चरने के लिए चलकर जाता है, तो ''सक्रिय चराई (क्या पशु चराई पर जाता है?)'' चालू करें और भू-भाग (Topography) तथा चली गई दूरी (km) लिखें।'
- text: '''फीड (आहार) जारी रखें'' पर टैप करें। जब हर ज़रूरी फ़ील्ड भरा हो और अपनी सीमा के अंदर हो, तब यह हरा हो जाता है। बछड़े के लिए, दूध पिलाने की योजना देखने के लिए ''जारी रखें'' पर टैप करें।'
- text: किसी पुराने केस को दोबारा इस्तेमाल करने के लिए 'सिमुलेशन (अनुकरण) विवरण' के पास इतिहास (history) आइकन पर टैप करें और कोई सहेजा गया सिमुलेशन चुनें; आगे बढ़ने से पहले नया सिमुलेशन नाम लिखें। 'रीसेट' पशुओ से संबंधित जानकारी और पशु आहार का चयन दोनों को खाली कर देता है, ताकि आप नए सिरे से शुरू कर सकें।
problems:
- title: किसी मान के नीचे 'Value Range' (मान सीमा) लाल रंग में दिखती है
  text: यह संख्या इस पशु के लिए अनुमत सीमा से बाहर है। दिखाई गई सीमा के अंदर का मान लिखें।
- title: '''देश बदलें?'''
  text: हर देश की अपनी पशु आहार सूची होती है, इसलिए देश बदलने से आपके पहले चुने हुए पशु आहार हट जाते हैं। उन्हें हटाने के लिए 'जारी रखें' पर टैप करें, या पहले वाला देश रखने के लिए 'रद्द करें' पर।
- title: '''कुछ मान अनुमत सीमा में लाने के लिए बदले गए'''
  text: किसी सहेजे गए केस में कोई मान आज की सीमा से बाहर था, इसलिए ऐप ने उसे सीमा के अंदर कर दिया। आगे बढ़ने से पहले मान जाँच लें।
- title: '''चली गई दूरी कम से कम 1 km होनी चाहिए'''
  text: '''सक्रिय चराई (क्या पशु चराई पर जाता है?)'' चालू होने पर चली गई दूरी लिखें, 1 km या ज़्यादा। अगर पशु नहीं चरता, तो इसे बंद कर दें।'
