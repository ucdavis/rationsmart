title: पशु आहार और पूरे आहार के लिए सीमाएँ तय करें
summary: तय करें कि आहार में किसी पशु आहार का कितना इस्तेमाल हो सकता है, और पूरे आहार के लिए पोषक तत्वों की सीमाएँ तय करें।
screen_label: पशु आहार का चयन
chapters:
- यह वीडियो क्या दिखाता है
- एक पशु आहार की सीमा
- एक उदाहरण
- आहार की सीमाएँ
- रिपोर्ट पर सीमाएँ
- नरम सीमाएँ
- रिपोर्ट के साथ सहेजी जाती हैं
steps:
- text: 'पशु आहार की सीमा: किसी पशु आहार कार्ड पर, पशु आहार चुनने के बाद, ''समावेशन सीमाएं सेट करें'' चालू करें। प्रति दिन kg में (जैसा खिलाया जाता है) न्यूनतम (Min) और/या अधिकतम (Max) लिखें। कोई सीमा न रखने के लिए बॉक्स खाली छोड़ दें।'
- text: 'उदाहरण: सोयाबीन खली पर अधिकतम 2 kg रखने से ऐसा आहार मिलता है जिसमें वह 1.88 kg है। सीमा के बिना की तुलना में आहार महँगा हो सकता है, क्योंकि ऐप को दूसरे पशु आहार इस्तेमाल करने पड़ते हैं।'
- text: 'आहार की सीमाएँ: ''अनुकूलित आहार सीमाएँ'' पर टैप करें। हर सीमा अपनी अनुमत रेंज और उस शारीरिक अवस्था का सामान्य (डिफ़ॉल्ट) मान दिखाती है, जैसे ''NDF max'' या ''Starch max''। सिर्फ़ वही बदलें जो ज़रूरी है और ''सीमाएं लागू करें'' पर टैप करें।'
- text: आहार तैयार करें। रिपोर्ट के 'आपके द्वारा तय सीमाएँ' कार्ड में आपकी तय की हुई हर सीमा और आहार में हर सीमित पशु आहार की इस्तेमाल हुई मात्रा दिखती है। सहेजी गई PDF में भी यही भाग होता है।
- text: 'वसा, रेशा (फाइबर) और स्टार्च की सीमाएँ नरम हैं: ऐप उन्हें पाने की कोशिश करता है, और जब आहार किसी सीमा से उस सीमा के 2.5 % से ज़्यादा ऊपर चला जाता है, तब रिपोर्ट ''आहार सीमा नोट्स'' दिखाती है।'
- text: सीमाएँ रिपोर्ट के साथ सहेजी जाती हैं। जब आप पशुओ से संबंधित जानकारी पर इतिहास (history) से कोई सहेजा गया सिमुलेशन खोलते हैं, तो उसकी सीमाएँ भी वापस आ जाती हैं।
problems:
- title: '''न्यूनतम, अधिकतम से ज़्यादा नहीं हो सकता।'''
  text: न्यूनतम (Min) को अधिकतम (Max) से छोटा करें, या दोनों में से एक को खाली कर दें।
- title: अधिकतम (Max) 0 स्वीकार नहीं होता
  text: किसी पशु आहार को बाहर रखने के लिए उसका कार्ड हटाएँ। कोई सीमा न रखने के लिए बॉक्स खाली छोड़ दें।
- title: '''Value must be between … and …'' (मान … और … के बीच होना चाहिए)'
  text: हर आहार सीमा की एक रेंज होती है, जो पोषण विशेषज्ञों ने उस शारीरिक अवस्था के लिए तय की है। उसके अंदर का मान लिखें; 'सीमाएं लागू करें' फिर से काम करने लगता है।
- title: '''चारा NDF न्यूनतम, NDF अधिकतम से अधिक नहीं हो सकता'''
  text: चारे से मिलने वाला रेशा कुल रेशे से ज़्यादा नहीं हो सकता। चारा NDF न्यूनतम (Forage NDF Min) कम करें या NDF अधिकतम (NDF Max) बढ़ाएँ।
- title: '''समावेशन सीमाएं सेट करें'' स्लेटी (ग्रे) है'
  text: पहले कार्ड में कोई पशु आहार चुनें।
- title: सीमाएँ लगाने पर कोई आहार नहीं मिलता
  text: इन पशु आहारों के लिए सीमाएँ बहुत सख्त हैं। कोई सीमा ढीली करें या हटाएँ, या कोई और पशु आहार जोड़ें (विषय 12)।
