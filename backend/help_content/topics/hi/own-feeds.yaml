title: अपने पशु आहार और उनके मान
summary: ऐसा पशु आहार जोड़ें जो सूची में नहीं है, या किसी पशु आहार के लिए अपनी लैब (प्रयोगशाला) जाँच के मान इस्तेमाल करें।
screen_label: पशु आहार का चयन
chapters:
- यह वीडियो क्या दिखाता है
- अनुकूलित पशु आहार जोड़ें
- इसे कार्ड में इस्तेमाल करें
- श्रेणी के अनुसार फ़ील्ड
- सूची के पशु आहार के लिए आपके मान
- अपना पशु आहार बदलें
- सिर्फ़ आपके लिए
steps:
- text: पशु आहार का चयन स्क्रीन पर 'अनुकूलित पशु आहार' पर टैप करें। 'अनुकूलित आहार सामग्री जोड़ें' में आहार प्रकार और पशु आहार श्रेणी चुनें, पशु आहार का नाम लिखें, और उसके पोषक मान शुष्क पदार्थ (DM) के % में भरें। 'प्रस्तुत करें' पर टैप करें।
- text: ऐप दिखाता है 'कस्टम फीड सफलतापूर्वक सहेज लिया गया! यह फीड सूची में दिखाई देगा।' इसे किसी भी पशु आहार कार्ड में उसके प्रकार और श्रेणी के अंदर चुनें, या उसका नाम खोजें।
- text: फ़ील्ड श्रेणी पर निर्भर करते हैं। खनिज (Minerals) में सिर्फ़ शुष्क पदार्थ, राख (Ash), कैल्शियम और फॉस्फोरस पूछे जाते हैं; योजक (Additive) में NPN भी पूछा जाता है।
- text: 'सूची के किसी पशु आहार के लिए अपने मान इस्तेमाल करने के लिए: उसे किसी कार्ड में चुनें और पेंसिल आइकन पर टैप करें। फ़ॉर्म उस पशु आहार के मानों के साथ खुलता है; उन्हें बदलें और ''प्रस्तुत करें'' पर टैप करें। इससे आपकी अपनी कॉपी सहेजी जाती है (उसका नाम आपके पहले नाम से शुरू होता है) और कार्ड उसी का इस्तेमाल करता है। सबके लिए साझा पशु आहार नहीं बदलता।'
- text: अपने किसी अनुकूलित पशु आहार को बदलने के लिए उसकी पेंसिल पर टैप करें; ऐप दिखाता है 'आपका कस्टम फीड सफलतापूर्वक अपडेट हो गया है!'।
- text: 'आपके अनुकूलित पशु आहार निजी हैं: दूसरे उपयोगकर्ता उन्हें कभी नहीं देखते। पशुओ से संबंधित जानकारी पर आप जो भी देश चुनें, वे हर देश में आपके साथ रहते हैं।'
problems:
- title: '''पशु आहार का नाम और प्रकार आवश्यक हैं'''
  text: '''प्रस्तुत करें'' पर टैप करने से पहले नाम लिखें और आहार प्रकार चुनें।'
- title: '''पोषक मान 0 से 100 % के बीच की संख्या होने चाहिए।'''
  text: पोषक तत्व शुष्क पदार्थ के % में होते हैं, इसलिए हर एक 0 से 100 तक होना चाहिए। देखें कि दशमलव बिंदु गलत जगह तो नहीं लगा।
- title: मुझे अपना अनुकूलित पशु आहार नहीं मिल रहा
  text: उसे सहेजते समय आपने जो आहार प्रकार और पशु आहार श्रेणी चुनी थी, उसके अंदर देखें, या उसका नाम खोजें।
- title: मुझे पोषक मान कहाँ से मिलेंगे?
  text: सबसे अच्छा है अपने पशु आहार की लैब जाँच से। अगर ऐसी जाँच नहीं है, तो सूची के किसी मिलते-जुलते पशु आहार से शुरू करें और सिर्फ़ वही बदलें जो आप जानते हैं।
