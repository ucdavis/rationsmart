title: ऐप इंस्टॉल करें, पंजीकरण करें, लॉगिन करें
summary: RationSmart को अपने फ़ोन में जोड़ें, खाता बनाएँ और लॉगिन करें।
screen_label: लॉगिन
chapters:
- यह वीडियो क्या दिखाता है
- ऐप खोलें
- इसे अपने फ़ोन में जोड़ें
- पंजीकरण करें
- अपने ईमेल की पुष्टि करें
- लॉगिन करें
- लॉगआउट करें
steps:
- text: 'अपने फ़ोन के ब्राउज़र में RationSmart खोलें: Android पर Chrome, iPhone पर Safari। स्वागत (Welcome) स्क्रीन पर ''जारी रखें'' पर टैप करें।'
- text: 'इसे ऐप की तरह इस्तेमाल करने के लिए, कुछ सेकंड इंस्टॉल बैनर का इंतज़ार करें और ''इंस्टॉल करें'' पर टैप करें। Android पर: मेनू (तीन बिंदु) पर टैप करें, फिर ''Add to Home screen'' (होम स्क्रीन में जोड़ें), फिर ''Add'' (जोड़ें)। iPhone पर: Share (शेयर) बटन पर टैप करें, फिर ''Add to Home Screen'', फिर ''Add''। इसके बाद RationSmart को उसके आइकन से खोलें।'
- text: 'नए उपयोगकर्ता हैं? लॉगिन स्क्रीन पर ''यहाँ पंजीकरण करे'' पर टैप करें। अपना नाम, ईमेल पता और देश लिखें, और अपनी भाषा चुनें: लॉगिन के बाद ऐप इसी भाषा में खुलेगा। 6 अंकों का PIN चुनें, उसे ''PIN की पुष्टि करें'' में दोबारा लिखें, और ''आगे बढ़ें'' पर टैप करें।'
- text: RationSmart से आया ईमेल खोलें और उसमें दिए लिंक पर टैप करें। अब आपका खाता तैयार है।
- text: लॉगिन स्क्रीन पर अपना ईमेल पता और PIN लिखें और 'आगे बढ़ें' पर टैप करें। ऐप पशुओ से संबंधित जानकारी स्क्रीन पर खुलता है। अगली बार ऐप खोलने पर आप लॉगिन ही रहेंगे।
- text: लॉगआउट करने के लिए मेनू खोलें, 'लॉगआउट' पर टैप करें, फिर 'हाँ, लॉगआउट' पर।
problems:
- title: सत्यापन ईमेल नहीं आया
  text: स्पैम फ़ोल्डर में देखें। 'अपना ईमेल देखें' स्क्रीन पर 'सत्यापन ईमेल पुनः भेजें' पर टैप करें। आप एक मिनट में एक बार नया ईमेल माँग सकते हैं।
- title: '''Please verify your email address'' (कृपया अपना ईमेल पता सत्यापित करें)'
  text: आपका PIN सही है, लेकिन खाता अभी सत्यापित नहीं हुआ है। सत्यापन ईमेल खोलें और उसके लिंक पर टैप करें, फिर से लॉगिन करें।
- title: '''ईमेल या PIN गलत है।'''
  text: ईमेल पता और 6 अंक जाँचें। PIN भूल गए? 'Forgot PIN? Tap here' (PIN भूल गए? यहाँ टैप करें) पर टैप करें (विषय 2)।
- title: कई बार कोशिश के बाद लॉगिन रुक जाता है
  text: कम समय में कई बार गलत कोशिश करने पर ऐप कुछ देर के लिए लॉगिन लेना बंद कर देता है। एक मिनट रुकें और फिर से कोशिश करें।
- title: '''This account was deleted'' (यह खाता हटा दिया गया था)'
  text: उसी ईमेल पते से फिर से पंजीकरण करें। ईमेल सत्यापित करने के बाद आपकी पहले सहेजी गई रिपोर्टें वापस आ जाती हैं।
- title: ऐप मेरी भाषा में नहीं है
  text: 'अगर आपने पंजीकरण के समय भाषा नहीं चुनी थी, या कोई दूसरी भाषा चाहते हैं: लॉगिन के बाद मेनू खोलें, ''प्रोफ़ाइल'' पर टैप करें, अपनी भाषा चुनें और ''प्रोफ़ाइल अपडेट करें'' पर टैप करें।'
