title: PIN และบัญชี
summary: ลืม PIN เปลี่ยน PIN แก้ไขโปรไฟล์ หรือลบบัญชี
screen_label: ข้อมูลส่วนตัวของคุณ
chapters:
- วิดีโอนี้แสดงอะไร
- ลืม PIN
- ตั้ง PIN ใหม่
- เปลี่ยน PIN
- อัปเดตโปรไฟล์
- PIN เก่า 4 หลัก
- ลบบัญชี
steps:
- text: ลืม PIN? ที่หน้าเข้าสู่ระบบ แตะ 'Forgot PIN? Tap here' พิมพ์อีเมลที่ลงทะเบียนไว้ แล้วแตะ 'ดำเนินการต่อ'
- text: 'เปิดอีเมลจาก RationSmart แล้วแตะ ''Reset my PIN'' หน้าเว็บจะเปิดขึ้น: พิมพ์ PIN ใหม่ 6 หลักสองครั้ง แล้วแตะ ''Save new PIN'' ลิงก์ใช้ได้ครั้งเดียว ภายใน 30 นาที ก่อนบันทึก PIN เดิมยังใช้ได้'
- text: 'เข้าสู่ระบบด้วย PIN ใหม่ หากต้องการเปลี่ยน PIN ในครั้งอื่นขณะที่ยังจำได้ เปิดเมนู แตะ ''โปรไฟล์'' แล้ว ''เปลี่ยน PIN'': ใส่ PIN ปัจจุบัน แล้วใส่ PIN ใหม่สองครั้ง และแตะ ''อัปเดต PIN'''
- text: หากต้องการเปลี่ยนชื่อ ประเทศ หรือภาษา เปิด 'โปรไฟล์' แก้ไขแล้วแตะ 'อัปเดตข้อมูลส่วนตัว' ปุ่มจะใช้ได้หลังจากคุณเปลี่ยนแปลงบางอย่างเท่านั้น
- text: ยังใช้ PIN เก่า 4 หลักอยู่? เมื่อเข้าสู่ระบบด้วย PIN นั้น แอปจะให้คุณตั้ง PIN 6 หลัก ใส่ PIN เก่า แล้วใส่ PIN ใหม่สองครั้ง
- text: 'หากต้องการลบบัญชี เปิด ''โปรไฟล์'' แตะ ''ลบ'' แล้ว ''ใช่'' และยืนยันด้วย PIN ของคุณ หากต้องการกลับมาใช้ภายหลัง ให้ลงทะเบียนใหม่ด้วยอีเมลเดิม: รายงานที่บันทึกไว้จะกลับมา'
problems:
- title: ไม่ได้รับอีเมล
  text: ดูในโฟลเดอร์สแปม และตรวจสอบอีเมลที่คุณพิมพ์ ขอใหม่ได้หลังจากหนึ่งนาที เพื่อความปลอดภัยของคุณ แอปจะแสดงข้อความเดียวกันสำหรับทุกอีเมล
- title: '''Link expired'''
  text: ลิงก์รีเซ็ตใช้ได้ครั้งเดียว และภายใน 30 นาทีเท่านั้น เปิดแอป แตะ 'Forgot PIN? Tap here' อีกครั้ง แล้วใช้อีเมลฉบับล่าสุด
- title: '''PIN ใหม่ไม่ตรงกัน'''
  text: พิมพ์ PIN ใหม่ให้เหมือนกันทุกตัวในทั้งสองช่อง
- title: '''Invalid PIN.'' ตอนลบบัญชี'
  text: PIN ไม่ถูกต้อง จึงยังไม่มีอะไรถูกลบ พิมพ์ PIN ปัจจุบันของคุณ
- title: '''ชื่อไม่สามารถเว้นว่างได้'''
  text: พิมพ์ชื่อก่อนแตะ 'อัปเดตข้อมูลส่วนตัว'
