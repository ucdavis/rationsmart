title: กรอกข้อมูลสัตว์
summary: 'กรอกหน้าข้อมูลโค: ชื่อกรณี ประเทศ สถานะของสัตว์ ร่างกาย น้ำนม และสภาพแวดล้อม'
screen_label: ข้อมูลโค
chapters:
- วิดีโอนี้แสดงอะไร
- รายละเอียดการจำลอง
- สถานะทางสรีรวิทยา
- ลักษณะของสัตว์
- ข้อมูลการสืบพันธุ์
- การผลิตน้ำนม
- สิ่งแวดล้อม
- ดำเนินการต่อไปยังอาหาร
- ใช้กรณีเดิมซ้ำหรือล้างค่า
steps:
- text: ใต้ 'รายละเอียดการจำลอง' พิมพ์ชื่อการจำลอง (เช่น ชื่อโคและวันที่) เลือกประเทศและภาษาของรายงาน ประเทศจะกำหนดว่าคุณเลือกอาหารใดได้บ้างและใช้สกุลเงินใด
- text: 'เลือก ''สถานะทางสรีรวิทยา'': โคนมรีดนม โคนมพักรีด โคสาว หรือลูกโค จากนั้นแบบฟอร์มจะแสดงเฉพาะช่องสำหรับสถานะนั้น โดยกรอกค่าที่ใช้ทั่วไปไว้ให้แล้ว'
- text: ใต้ 'ลักษณะของสัตว์' เลือกพันธุ์ แล้วกรอกน้ำหนักตัว (kg) คะแนนสภาพร่างกาย จำนวนครั้งที่คลอด และน้ำหนักตัวที่เพิ่มขึ้น (BW Gain, kg ต่อวัน)
- text: ใต้ 'ข้อมูลการสืบพันธุ์' กรอกจำนวนวันตั้งท้อง และสำหรับโคนมรีดนม ให้กรอกจำนวนวันที่ให้นมด้วย
- text: 'สำหรับโคนมรีดนม ใต้ ''การผลิตน้ำนม'' กรอกปริมาณน้ำนมต่อวัน (ลิตร) ไขมันนม % และโปรตีนนม % ราคานมจะกรอกหรือไม่ก็ได้: ถ้ากรอก รายงานจะเปรียบเทียบรายได้จากน้ำนมกับค่าอาหาร'
- text: ใต้ 'สิ่งแวดล้อม' กรอกอุณหภูมิเฉลี่ย (°C) หากสัตว์เดินไปกินหญ้า ให้เปิด 'การปล่อยกินหญ้า' แล้วกรอกภูมิประเทศและระยะทางที่เดิน (km)
- text: แตะ 'ดำเนินการต่อไปยังอาหาร' ปุ่มจะเป็นสีเขียวเมื่อกรอกทุกช่องที่จำเป็นและค่าอยู่ในช่วงที่กำหนด สำหรับลูกโค ให้แตะ 'ดำเนินการต่อ' เพื่อดูแผนการให้นม
- text: หากต้องการใช้กรณีเดิมซ้ำ แตะไอคอนประวัติข้าง 'รายละเอียดการจำลอง' แล้วเลือกการจำลองที่บันทึกไว้ พิมพ์ชื่อการจำลองใหม่ก่อนดำเนินการต่อ 'รีเซ็ต' จะล้างหน้าข้อมูลโคและการเลือกอาหารเพื่อเริ่มใหม่
problems:
- title: ค่าแสดง 'Value Range' เป็นสีแดง
  text: ตัวเลขอยู่นอกช่วงที่อนุญาตสำหรับสัตว์ตัวนี้ พิมพ์ค่าที่อยู่ในช่วงที่แสดง
- title: '''เปลี่ยนประเทศหรือไม่?'''
  text: แต่ละประเทศมีรายการอาหารของตัวเอง การเปลี่ยนประเทศจึงล้างอาหารที่คุณเลือกไว้แล้ว แตะ 'ดำเนินการต่อ' เพื่อล้าง หรือ 'ยกเลิก' เพื่อใช้ประเทศเดิม
- title: '''ค่าบางค่าถูกปรับให้อยู่ในช่วงที่อนุญาต'''
  text: กรณีที่บันทึกไว้มีค่าอยู่นอกช่วงที่ใช้ในปัจจุบัน แอปจึงปรับค่าให้อยู่ในช่วง ตรวจสอบค่าต่าง ๆ ก่อนดำเนินการต่อ
- title: '''ระยะทางที่เดินต้องอย่างน้อย 1 km'''
  text: เมื่อเปิด 'การปล่อยกินหญ้า' ให้กรอกระยะทางที่เดิน 1 km ขึ้นไป หากสัตว์ไม่ได้ออกไปกินหญ้า ให้ปิดไว้
