# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: บันทึก แชร์ และค้นหารายงาน
summary: เก็บรายงาน รับไฟล์ PDF แชร์ และเปิดดูอีกครั้งภายหลัง
screen_label: รายงานอาหาร
chapters:
- วิดีโอนี้แสดงอะไร
- บันทึกรายงาน
- รับ ดู และแชร์ PDF
- รายงานอาหาร
- กำลังสร้างไฟล์ PDF
- รายงานจำนวนมาก
- ใช้กรณีที่บันทึกไว้ซ้ำ
- รายงานที่ไม่ได้บันทึก
steps:
- text: ในรายงาน แตะ 'บันทึกรายงาน' แอปจะแสดง 'Report saved successfully' การบันทึกรายงานเดิมซ้ำจะไม่สร้างสำเนาที่สอง
- text: แตะ 'รับ PDF' เพื่อสร้าง PDF เมื่อพร้อมแล้ว 'ดู PDF' จะเปิดไฟล์ และ 'แชร์รายงาน' จะส่งไฟล์ผ่านตัวเลือกการแชร์ของโทรศัพท์ (หรือคัดลอกลิงก์ PDF)
- text: เปิดเมนูแล้วแตะ 'รายงานอาหาร' เพื่อดูรายงานที่บันทึกไว้ เรียงจากล่าสุด 'ดูรายงาน' เปิด PDF แตะแถบใต้รายงานเพื่อดูรหัสรายงาน ประเภทรายงาน และวันที่
- text: รายงานใหม่อาจแสดง 'กำลังสร้างไฟล์ PDF' ประมาณหนึ่งนาทีระหว่างที่สร้าง PDF เปิด 'รายงานอาหาร' อีกครั้งในอีกสักครู่
- text: เมื่อมีรายงานที่บันทึกไว้มากกว่า 20 ฉบับ ให้ใช้ปุ่มหน้าถัดไปและหน้าก่อนหน้าที่ด้านล่าง
- text: หากต้องการใช้กรณีที่บันทึกไว้ซ้ำ เปิดหน้าข้อมูลโคแล้วแตะไอคอนประวัติข้าง 'รายละเอียดการจำลอง' ที่นั่นจะแสดงเฉพาะรายงานที่บันทึกไว้
- text: รายงานที่คุณไม่ได้บันทึกจะอยู่ในโทรศัพท์เครื่องนี้ 24 ชั่วโมง แล้วจะหายไป บันทึกรายงานที่คุณต้องการไว้
problems:
- title: '''ไม่มีรายงานที่บันทึกไว้'''
  text: คุณยังไม่ได้บันทึกรายงาน แตะ 'สร้างรายงาน' ทำสูตรอาหาร แล้วแตะ 'บันทึกรายงาน'
- title: '''กำลังสร้างไฟล์ PDF'' ไม่หายไป'
  text: ปิดแล้วเปิด 'รายงานอาหาร' ใหม่ ถ้าผ่านไปหลายนาทียังแสดงอยู่ ให้เปิดรายงานจากรายการแล้วแตะ 'รับ PDF'
- title: '''คัดลอกลิงก์ PDF ไปยังคลิปบอร์ดแล้ว'''
  text: โทรศัพท์ของคุณไม่มีหน้าต่างแชร์ตรงนี้ แอปจึงคัดลอกลิงก์ให้แทน วางลิงก์ในข้อความหรืออีเมล
- title: รายงานของฉันไม่อยู่ในประวัติในหน้าข้อมูลโค
  text: ประวัติแสดงเฉพาะรายงานที่บันทึกไว้ คำนวณกรณีนั้นใหม่แล้วแตะ 'บันทึกรายงาน'
