# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: แผนการให้นมลูกโค
summary: ควรให้นมลูกโควันละเท่าไร แบ่งให้กี่มื้อ และหย่านมเมื่อไร
screen_label: การให้นมลูกโค
chapters:
- วิดีโอนี้แสดงอะไร
- เลือก 'ลูกโค'
- น้ำนมต่อวัน
- จำนวนมื้อและการหย่านม
- ตัวอย่าง
- คำแนะนำการดูแล
- บันทึกและ PDF
steps:
- text: ที่หน้าข้อมูลโค เลือกสถานะทางสรีรวิทยา 'ลูกโค' พิมพ์น้ำหนักตัวของลูกโคเป็น kg แล้วแตะ 'ดำเนินการต่อ'
- text: 'แผน ''การให้นมลูกโค'' จะเปิดขึ้น ''น้ำนมต่อวัน'' คือจำนวนลิตรของน้ำนมต่อวัน: หนึ่งในสิบของน้ำหนักตัวลูกโค'
- text: '''ต่อมื้อ'' แบ่งน้ำนมต่อวันเป็น 2 มื้อต่อวัน ''หย่านมเมื่อ'' บอกอายุเป็นวันที่ควรหยุดให้นม (56 วัน)'
- text: 'ตัวอย่าง: ลูกโคหนัก 40 kg ได้นมวันละ 4.0 ลิตร แบ่งให้ครั้งละ 2.0 ลิตร วันละสองครั้ง'
- text: 'อ่านคำแนะนำการดูแลใต้แผน แผนนี้เป็นแนวทาง: ปรับใช้ร่วมกับสัตวแพทย์ของคุณ'
- text: แตะ 'บันทึกรายงาน' เพื่อเก็บแผนไว้ แล้วแตะ 'รับ PDF' เพื่อรับสำเนาที่มีตารางการให้นมครบถ้วน (หัวข้อ 10)
problems:
- title: น้ำหนักตัวไม่ผ่าน
  text: สำหรับลูกโค น้ำหนักตัวต้องอยู่ระหว่าง 30 ถึง 100 kg ช่วงที่อนุญาตแสดงอยู่ใต้ช่อง
- title: ฉันไม่เห็นหน้าการเลือกอาหารสำหรับลูกโค
  text: ลูกโคได้เฉพาะแผนการให้นม แอปไม่ได้คำนวณสูตรอาหารหรือการประเมินให้ลูกโค
- title: ลูกโคของฉันโตแล้วและกินอาหารแข็ง
  text: เลือก 'โคสาว' แทน 'ลูกโค' เพื่อรับสูตรอาหารสำหรับสัตว์อายุน้อยที่กำลังเติบโต
