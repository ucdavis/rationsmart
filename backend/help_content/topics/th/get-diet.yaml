title: รับสูตรอาหารต้นทุนต่ำสุดและอ่านรายงาน
summary: สร้างคำแนะนำและทำความเข้าใจแต่ละส่วนของรายงาน
screen_label: รายงานคำแนะนำ
chapters:
- วิดีโอนี้แสดงอะไร
- สร้างสูตรอาหาร
- รายละเอียดรายงาน
- อาหารคุ้มทุน
- สรุปวิธีการแก้ปัญหา
- ส่วนต่างต้นทุนน้ำนม
- ขีดจำกัดที่คุณตั้งไว้
- หมายเหตุและมีเทน
- บันทึก, PDF, กรณีถัดไป
steps:
- text: ที่หน้าการเลือกอาหาร แตะ 'สร้างคำแนะนำ' ข้อความ 'กำลังสร้างรายงานของคุณ' จะแสดงสักครู่ แล้ว 'รายงานคำแนะนำ' จะเปิดขึ้น
- text: '''รายละเอียดรายงาน'' ด้านบนแสดงรหัสรายงาน รหัสการจำลอง ชื่อของคุณ และเวลาที่สร้างรายงาน ''ลักษณะของสัตว์'' แสดงรายละเอียดสัตว์ที่คุณกรอกซ้ำอีกครั้ง เพื่อให้คุณตรวจสอบได้'
- text: '''อาหารคุ้มทุน'' คือคำตอบ: อาหารแต่ละชนิดต้องให้วันละกี่ kg แบบตามที่ให้จริง (as fed คือน้ำหนักที่วางให้โคกิน) ราคาต่อ kg และค่าใช้จ่ายต่อวัน บรรทัดสุดท้ายคือต้นทุนอาหารรวมต่อวัน'
- text: '''สรุปวิธีการแก้ปัญหา'' แสดงต้นทุนต่อวัน ปริมาณน้ำนมที่สูตรอาหารวางแผนไว้ ปริมาณการกินได้วัตถุแห้ง (อาหารที่ไม่รวมน้ำ kg ต่อวัน) และอัตราส่วนอาหารหยาบ : อาหารข้น'
- text: '''ส่วนต่างต้นทุนน้ำนม'' แสดงสำหรับโคนมรีดนม เมื่อคุณกรอกราคานม ''ต้นทุนอาหาร / ลิตร'' คือค่าอาหารต่อน้ำนมหนึ่งลิตร ''ราคานม / ลิตร'' คือราคานมของคุณ และส่วนต่างคือรายได้จากน้ำนมที่เหลือหลังหักค่าอาหารเท่านั้น ไม่รวมค่าแรง ค่าสัตวแพทย์ และค่าใช้จ่ายอื่น'
- text: '''ขีดจำกัดที่คุณตั้งไว้'' จะแสดงเมื่อคุณตั้งขีดจำกัดของอาหารหรือของสูตรอาหาร โดยแสดงขีดจำกัดแต่ละข้อ และปริมาณอาหารชนิดนั้นที่สูตรอาหารใช้ (หัวข้อ 9)'
- text: '''หมายเหตุ'' จะแสดงเฉพาะเมื่อมีสิ่งที่ต้องใส่ใจ เช่น สารอาหารต่ำกว่าเป้าหมาย พร้อมคำแนะนำว่าควรเปลี่ยนอะไร ''ผลกระทบต่อสิ่งแวดล้อม'' แสดงก๊าซมีเทนที่โคปล่อยออกมาเมื่อกินสูตรอาหารนี้'
- text: แตะ 'บันทึกรายงาน' เพื่อเก็บไว้ แล้ว 'รับ PDF' 'ดู PDF' หรือ 'แชร์รายงาน' (หัวข้อ 10) 'กรณีใหม่' เริ่มสัตว์ตัวถัดไปโดยใช้ข้อมูลเดิม ลูกศรย้อนกลับจะพากลับไปหน้าการเลือกอาหาร ซึ่งคุณเปลี่ยนอาหารหรือราคาแล้วสร้างใหม่ได้
problems:
- title: '''ไม่พบสูตรที่เหมาะสมที่สุด'''
  text: ไม่มีการผสมอาหารของคุณแบบใดที่ตรงกับความต้องการของสัตว์ตัวนี้ หมายเหตุจะบอกว่าขาดอะไรและควรเปลี่ยนอะไร ดูหัวข้อ 12
- title: ไม่มีการ์ด 'ส่วนต่างต้นทุนน้ำนม'
  text: การ์ดนี้แสดงเฉพาะโคนมรีดนม และเฉพาะเมื่อกรอกราคานมในหน้าข้อมูลโคแล้ว ย้อนกลับไป พิมพ์ราคานม แล้วสร้างใหม่อีกครั้ง
- title: '''หมายเหตุขีดจำกัดอาหาร'''
  text: สูตรอาหารไม่สามารถอยู่ภายในขีดจำกัดที่คุณตั้งไว้ใน 'ขีดจำกัดอาหารกำหนดเอง' หมายเหตุจะแสดงผลลัพธ์และขีดจำกัดของคุณ ผ่อนขีดจำกัดลง หรือเพิ่มอาหารชนิดอื่น
- title: อาหารบางชนิดแสดงปริมาณน้อยมาก เช่น 0.01 kg
  text: สูตรอาหารที่ถูกที่สุดแทบไม่ต้องใช้อาหารชนิดนั้น คุณตัดออกแล้วสร้างใหม่ได้ ค่าใช้จ่ายจะเปลี่ยนน้อยมาก
- title: บางคำยังเป็นภาษาอังกฤษ
  text: คำแสดงสถานะในแอปตั้งใจให้เป็นภาษาอังกฤษ PDF ที่บันทึกไว้ใช้ภาษาของรายงานสำหรับหัวข้อ หมายเหตุ และชื่ออาหาร ในส่วนที่มีคำแปล
