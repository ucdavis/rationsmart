# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: เลือกอาหารและราคา
summary: เลือกอาหารที่คุณมี พิมพ์ราคาของแต่ละชนิด แล้วคำนวณสูตรอาหาร
screen_label: การเลือกอาหาร
chapters:
- วิดีโอนี้แสดงอะไร
- เลือกโหมด
- กรอกการ์ดอาหาร
- ค้นหาอาหาร
- พิมพ์ราคา
- ปริมาณสำหรับการประเมิน
- เพิ่มอาหาร
- คำนวณสูตรอาหาร
- อาหารของคุณเองและขีดจำกัด
steps:
- text: ที่ด้านบน เลือก 'คำแนะนำอาหาร' (แอปหาสูตรอาหารที่ถูกที่สุดให้) หรือ 'การประเมินอาหาร' (คุณพิมพ์ปริมาณที่ให้อยู่ตอนนี้ แล้วแอปตรวจสอบให้)
- text: ใน 'FEED 1' เลือกประเภทอาหาร (อาหารหยาบ อาหารข้น หรืออาหารผสมครบส่วน) แล้วหมวดหมู่อาหาร แล้วอาหาร แต่ละรายการจะเปิดได้หลังจากคุณเลือกรายการก่อนหน้าแล้วเท่านั้น
- text: 'หรือค้นหา: แตะการ์ดให้แสดง ''เลือกแล้ว'' แล้วพิมพ์ส่วนหนึ่งของชื่ออาหาร (เช่น ''ถั่วเหลือง'') ในช่องค้นหา แตะผลลัพธ์เพื่อกรอกลงการ์ดนั้น'
- text: พิมพ์ราคาต่อ kg เป็นสกุลเงินของประเทศคุณ ชื่อช่องจะแสดงสกุลเงิน เช่น 'ราคา ETB/กก.'
- text: ใน 'การประเมินอาหาร' ให้พิมพ์จำนวน kg ต่อวันที่คุณให้อยู่ตอนนี้ด้วย การ์ดจะแสดงค่าใช้จ่าย (ราคา × kg)
- text: แตะ 'เพิ่มอาหารเพิ่มเติม' สำหรับอาหารแต่ละชนิดที่เพิ่ม ลบการ์ดด้วยไอคอนถังขยะ ต้องมีอาหารหยาบอย่างน้อยหนึ่งชนิด
- text: แตะ 'สร้างคำแนะนำ' (หรือ 'รับการประเมิน' ในโหมดการประเมินอาหาร) รายงานจะเปิดขึ้นในไม่กี่วินาที
- text: 'ไม่บังคับ: ''อาหารกำหนดเอง'' ใช้เพิ่มอาหารของคุณเอง (หัวข้อ 8) ''ขีดจำกัดอาหารกำหนดเอง'' และ ''กำหนดปริมาณการใช้'' บนการ์ด ใช้ควบคุมสูตรอาหาร (หัวข้อ 9)'
problems:
- title: '''ต้องการอาหารหยาบ'''
  text: ทุกสูตรอาหารต้องมีอาหารประเภทอาหารหยาบอย่างน้อยหนึ่งชนิด แตะ 'ตกลง เพิ่มอาหารหยาบ' เพิ่มหนึ่งชนิด แล้วสร้างใหม่อีกครั้ง
- title: '''อาหารไม่ครบถ้วน'''
  text: มีการ์ดที่เลือกประเภทแล้วแต่ยังไม่ได้เลือกอาหาร แตะ 'ไม่, ทบทวน' เพื่อกรอกให้ครบ หรือ 'ใช่, ดำเนินการต่อ' เพื่อคำนวณโดยไม่ใช้การ์ดนั้น
- title: '''อาหารนี้ถูกเลือกไว้แล้ว'''
  text: อาหารแต่ละชนิดอยู่ได้ในการ์ดเดียวเท่านั้น ให้เปลี่ยนราคาในการ์ดที่มีอาหารนั้นอยู่แล้ว
- title: '''ราคาต้องไม่ติดลบ'''
  text: พิมพ์ราคาตั้งแต่ 0 ขึ้นไป
- title: '''ป้อนปริมาณมากกว่า 0 สำหรับอาหารทุกรายการ หรือลบอาหารนั้นออก'''
  text: ในการประเมินอาหาร อาหารทุกชนิดต้องมีจำนวน kg ต่อวันที่คุณให้อยู่ตอนนี้ พิมพ์ค่านั้น หรือลบอาหารออก
- title: ไม่พบอาหารที่ฉันคาดว่าจะมี
  text: รายการแสดงอาหารของประเทศที่เลือกไว้ในหน้าข้อมูลโค รวมกับอาหารกำหนดเองของคุณ ตรวจสอบประเทศ หรือเพิ่มอาหารด้วย 'อาหารกำหนดเอง'
