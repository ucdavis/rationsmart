# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: ตรวจสอบสูตรอาหารที่ให้อยู่ตอนนี้
summary: พิมพ์อาหารที่สัตว์กินอยู่วันนี้ แล้วดูว่าขาดอะไร ให้น้ำนมได้เท่าไร และมีค่าใช้จ่ายเท่าไร
screen_label: รายงานการประเมิน
chapters:
- วิดีโอนี้แสดงอะไร
- เริ่มการประเมิน
- สรุปการประเมิน
- ปริมาณการกินได้วัตถุแห้ง
- การผลิตน้ำนม
- สมดุลสารอาหาร
- การวิเคราะห์ต้นทุน
- ส่วนต่างต้นทุนน้ำนม
- รับคำแนะนำ
steps:
- text: ที่หน้าการเลือกอาหาร เลือก 'การประเมินอาหาร' เลือกอาหารแต่ละชนิดที่ให้อยู่ตอนนี้ พิมพ์ราคาและจำนวน kg ต่อวันที่ให้ (as fed ตามที่ให้จริง) แตะ 'รับการประเมิน' แล้ว 'รายงานการประเมิน' จะเปิดขึ้น
- text: '''สรุปการประเมิน'' แสดงสถานะโดยรวมของสูตรอาหาร (เช่น Marginal) และปัจจัยจำกัด: สารอาหารที่ฉุดรั้งโคไว้'
- text: '''ปริมาณการกินได้วัตถุแห้ง'' เปรียบเทียบปริมาณที่บริโภคจริงจากอาหารของคุณ กับปริมาณการกินเป้าหมายที่โคกินได้ ''Below target'' หมายถึงสูตรอาหารให้อาหารน้อยกว่าที่โคกินได้'
- text: '''การวิเคราะห์การผลิตนม'': ''นมแท้'' คือปริมาณน้ำนมที่สูตรอาหารนี้รองรับได้ แสดงคู่กับเป้าหมายของคุณ ''พลังงานสนับสนุน'' และ ''โปรตีนสนับสนุน'' แสดงปริมาณน้ำนมที่สารอาหารแต่ละอย่างรองรับได้ ค่าที่ต่ำกว่าคือสารอาหารจำกัด'
- text: '''สมดุลสารอาหาร'' แสดงสารอาหารแต่ละอย่างว่าเกิน (+) หรือขาด (−) เมื่อเทียบกับความต้องการของโค'
- text: '''การวิเคราะห์ต้นทุน'' แสดงต้นทุนอาหารรวมต่อวัน ค่าใช้จ่ายของอาหารแต่ละชนิดใน ''รายละเอียดอาหาร'' และ ''ต้นทุน/ลิตรนม'': ต้นทุนอาหารหารด้วยปริมาณน้ำนมที่สูตรอาหารนี้รองรับได้ (นมแท้)'
- text: '''ส่วนต่างต้นทุนน้ำนม'' เปรียบเทียบค่าอาหารต่อลิตรกับราคานมของคุณ สำหรับการประเมิน ต้นทุนที่ควรใช้คือ ''ต้นทุน/ลิตรนม'' ในการวิเคราะห์ต้นทุน เพราะคิดจากปริมาณน้ำนมที่สูตรอาหารนี้รองรับได้จริง'
- text: แตะ 'สร้างคำแนะนำอาหาร' เพื่อรับสูตรอาหารที่ถูกที่สุดจากอาหารชุดเดิมสำหรับสัตว์ตัวเดิม บันทึกและแชร์การประเมินได้แบบเดียวกับคำแนะนำ (หัวข้อ 10)
problems:
- title: '''นมแท้'' ต่ำกว่าเป้าหมายของฉัน'
  text: สูตรอาหารขาดสารอาหารจำกัด เพิ่มอาหารที่มีสารอาหารนั้นมาก (เช่น กากโปรตีน เมื่อโปรตีนเป็นตัวจำกัด) หรือแตะ 'สร้างคำแนะนำอาหาร'
- title: '''ป้อนปริมาณมากกว่า 0 สำหรับอาหารทุกรายการ หรือลบอาหารนั้นออก'''
  text: อาหารทุกชนิดในการประเมินต้องมีจำนวน kg ต่อวันที่คุณให้อยู่ตอนนี้ พิมพ์ค่านั้น หรือลบอาหารนั้นออก
- title: อาหารที่ฉันปลูกเองไม่มีราคา
  text: พิมพ์ราคาเป็น 0 การประเมินยังทำงานได้ อาหารนั้นจะไม่เพิ่มค่าใช้จ่าย
- title: '''… of the selected feeds are no longer available'''
  text: อาหารถูกนำออกจากคลังอาหารหลังจากที่คุณใช้ครั้งล่าสุด ลบออกจากรายการที่เลือก แล้วเลือกอาหารใหม่อีกครั้ง
- title: ไม่มี 'การประเมินอาหาร' สำหรับลูกโคของฉัน
  text: ลูกโคจะได้แผนการให้นมแทนสูตรอาหาร (หัวข้อ 7)
