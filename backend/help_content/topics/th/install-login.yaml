title: ติดตั้งแอป ลงทะเบียน เข้าสู่ระบบ
summary: เพิ่ม RationSmart ลงในโทรศัพท์ สร้างบัญชี และเข้าสู่ระบบ
screen_label: เข้าสู่ระบบ
chapters:
- วิดีโอนี้แสดงอะไร
- เปิดแอป
- เพิ่มลงในโทรศัพท์
- ลงทะเบียน
- ยืนยันอีเมล
- เข้าสู่ระบบ
- ออกจากระบบ
steps:
- text: 'เปิด RationSmart ในเบราว์เซอร์ของโทรศัพท์: Chrome บน Android หรือ Safari บน iPhone ที่หน้าต้อนรับ แตะ ''ดำเนินการต่อ'''
- text: 'หากต้องการใช้เหมือนแอป ให้รอไม่กี่วินาทีจนแถบติดตั้งขึ้นมา แล้วแตะ ''ติดตั้ง'' บน Android: แตะเมนู (จุดสามจุด) แล้ว ''Add to Home screen'' (เพิ่มไปยังหน้าจอหลัก) แล้ว ''Add'' (เพิ่ม) บน iPhone: แตะปุ่มแชร์ แล้ว ''Add to Home Screen'' (เพิ่มไปยังหน้าจอโฮม) แล้ว ''Add'' (เพิ่ม) จากนั้นเปิด RationSmart จากไอคอนของแอป'
- text: 'ผู้ใช้ใหม่? ที่หน้าเข้าสู่ระบบ แตะ ''ลงทะเบียนที่นี่'' กรอกชื่อ อีเมล และประเทศ แล้วเลือกภาษา: แอปจะเปิดเป็นภาษานั้นหลังจากคุณเข้าสู่ระบบ ตั้ง PIN 6 หลัก พิมพ์อีกครั้งในช่อง ''ยืนยัน PIN'' แล้วแตะ ''ดำเนินการต่อ'''
- text: เปิดอีเมลจาก RationSmart แล้วแตะลิงก์ในอีเมล บัญชีของคุณพร้อมใช้งานแล้ว
- text: ที่หน้าเข้าสู่ระบบ กรอกอีเมลและ PIN แล้วแตะ 'ดำเนินการต่อ' แอปจะเปิดที่หน้าข้อมูลโค ครั้งต่อไปที่เปิดแอป คุณยังอยู่ในระบบ
- text: หากต้องการออกจากระบบ เปิดเมนู แตะ 'ออกจากระบบ' แล้วแตะ 'ใช่ ออกจากระบบ'
problems:
- title: ไม่ได้รับอีเมลยืนยัน
  text: ดูในโฟลเดอร์สแปม ที่หน้า 'ตรวจสอบอีเมลของคุณ' แตะ 'ส่งอีเมลยืนยันอีกครั้ง' ขออีเมลใหม่ได้นาทีละครั้ง
- title: '''Please verify your email address'''
  text: PIN ของคุณถูกต้อง แต่บัญชียังไม่ได้ยืนยัน เปิดอีเมลยืนยันแล้วแตะลิงก์ในอีเมล จากนั้นเข้าสู่ระบบอีกครั้ง
- title: '''อีเมลหรือ PIN ไม่ถูกต้อง'''
  text: ตรวจสอบอีเมลและตัวเลข 6 หลัก ลืม PIN? แตะ 'Forgot PIN? Tap here' (หัวข้อ 2)
- title: การเข้าสู่ระบบถูกพักไว้หลังพยายามหลายครั้ง
  text: หากใส่ผิดหลายครั้งในเวลาสั้น ๆ แอปจะหยุดรับการเข้าสู่ระบบชั่วคราว รอหนึ่งนาทีแล้วลองอีกครั้ง
- title: '''This account was deleted'''
  text: ลงทะเบียนใหม่ด้วยอีเมลเดิม หลังจากยืนยันอีเมลแล้ว รายงานที่คุณเคยบันทึกไว้จะกลับมา
- title: แอปไม่ได้เป็นภาษาของฉัน
  text: 'หากคุณไม่ได้เลือกภาษาตอนลงทะเบียน หรืออยากใช้ภาษาอื่น: หลังเข้าสู่ระบบ เปิดเมนู แตะ ''โปรไฟล์'' เลือกภาษา แล้วแตะ ''อัปเดตข้อมูลส่วนตัว'''
