# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: เมื่อไม่พบสูตรอาหาร และปัญหาอื่น ๆ
summary: สิ่งที่ควรทำเมื่อรายงานไม่พบสูตรอาหาร มีข้อความแจ้งเตือนขึ้น หรือแอปไม่ตอบสนอง
screen_label: รายงานคำแนะนำ
chapters:
- วิดีโอนี้แสดงอะไร
- ไม่พบสูตรอาหาร
- อ่านหมายเหตุ
- เพิ่มอาหาร
- ผ่อนขีดจำกัด
- ตรวจสอบข้อมูลสัตว์
- ใช้การประเมินอาหาร
- ลองอีกครั้ง
steps:
- text: เมื่อรายงานแสดง 'ไม่พบสูตรที่เหมาะสมที่สุด' แปลว่าไม่มีการผสมอาหารของคุณแบบใดที่ตรงกับความต้องการของสัตว์ตัวนี้ จะไม่มีตารางสูตรอาหาร การ์ด 'หมายเหตุ' จะอธิบายสาเหตุ
- text: 'อ่าน ''Violated Parameters'': แต่ละบรรทัดบอกสิ่งที่สูตรอาหารทำไม่ได้ตามเกณฑ์ เช่น ''Phosphorus Requirement: below minimum'' (ฟอสฟอรัสต่ำกว่าค่าขั้นต่ำ) หรือ ''Total Fibre (NDF): above maximum'' (เยื่อใยทั้งหมดสูงกว่าค่าสูงสุด) ''Recommendations'' แนะนำสิ่งที่ควรเปลี่ยน'
- text: 'เพิ่มอาหารที่ให้สิ่งที่ขาด: อาหารแร่ธาตุสำหรับแคลเซียมหรือฟอสฟอรัส กากโปรตีนสำหรับโปรตีน ธัญพืชสำหรับพลังงาน สูตรอาหารที่มีอาหารเพียงหนึ่งหรือสองชนิดมักให้ไม่ครบทุกความต้องการ'
- text: หากคุณตั้งขีดจำกัดไว้ ('กำหนดปริมาณการใช้' หรือ 'ขีดจำกัดอาหารกำหนดเอง') ให้ผ่อนหรือลบออก การ์ด 'ขีดจำกัดที่คุณตั้งไว้' ในรายงานแสดงว่าคุณตั้งขีดจำกัดใดไว้
- text: 'ตรวจสอบข้อมูลสัตว์: เป้าหมายน้ำนมที่สูงมากเกินกว่าอาหารที่คุณมีจะทำได้ ลดเป้าหมายน้ำนม หรือเพิ่มอาหารที่ดีกว่า'
- text: หากต้องการดูว่าสูตรอาหารที่คุณเลือกเองขาดสารอาหารใด ให้ใช้ 'การประเมินอาหาร' (หัวข้อ 6)
- text: จากนั้นแตะลูกศรย้อนกลับไปหน้าการเลือกอาหาร แก้ไข แล้วแตะ 'สร้างคำแนะนำ' อีกครั้ง
problems:
- title: '''ต้องการอาหารหยาบ'''
  text: ทุกสูตรอาหารต้องมีอาหารประเภทอาหารหยาบอย่างน้อยหนึ่งชนิด เพิ่มหนึ่งชนิดแล้วสร้างใหม่อีกครั้ง
- title: '''… of the selected feeds are no longer available'''
  text: อาหารถูกนำออกจากคลังอาหารแล้ว ลบออกจากรายการที่เลือก แล้วเลือกอาหารใหม่อีกครั้ง
- title: รายงานใช้เวลานานมากหรือไม่เปิด
  text: ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองอีกครั้ง ถ้ายังเกิดขึ้นอยู่ ให้เขียนถึงเราผ่าน 'ติดต่อเรา' พร้อมชื่อการจำลอง
- title: แอปแสดงข้อผิดพลาดหรือหยุดตอบสนอง
  text: ย้อนกลับไปหนึ่งหน้าจอแล้วลองอีกครั้ง ข้อมูลที่กรอกไว้ยังอยู่ ถ้ายังไม่ได้ ให้ออกจากระบบ เข้าสู่ระบบใหม่ และแจ้งเราผ่าน 'ความคิดเห็น' หรือ 'ติดต่อเรา'
