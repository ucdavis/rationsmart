title: ภาษา ความคิดเห็น และความช่วยเหลือ
summary: ใช้แอปเป็นภาษาของคุณ บอกเราว่าคุณคิดอย่างไร และขอความช่วยเหลือ
screen_label: ความคิดเห็น
chapters:
- วิดีโอนี้แสดงอะไร
- เลือกภาษา
- ภาษาเริ่มต้นของคุณ
- ภาษาของ PDF
- ส่งความคิดเห็น
- ความคิดเห็นที่ผ่านมา
- ความช่วยเหลือและการสนับสนุน
steps:
- text: ที่หน้าข้อมูลโค เลือกภาษาใต้ 'รายละเอียดการจำลอง' หน้าจอและรายงานจะเปลี่ยนเป็นภาษานั้นทันที รายการแสดงภาษาที่ตั้งค่าไว้สำหรับประเทศที่คุณเลือก
- text: หากต้องการตั้งภาษาเป็นค่าเริ่มต้น เปิดเมนู แตะ 'โปรไฟล์' เลือกภาษา แล้วแตะ 'อัปเดตข้อมูลส่วนตัว'
- text: PDF ที่บันทึกไว้ใช้ภาษาของรายงานสำหรับหัวข้อ หมายเหตุ และชื่ออาหาร ในส่วนที่มีคำแปล ตัวเลขไม่เปลี่ยน คำแสดงสถานะบางคำตั้งใจให้เป็นภาษาอังกฤษ
- text: หากต้องการให้ความคิดเห็น เปิดเมนูแล้วแตะ 'ความคิดเห็น' เลือก 1 ถึง 5 ดาวใต้ 'ให้คะแนนแอป' เลือก 'หมวดหมู่ความคิดเห็น' เขียนความคิดเห็น (ไม่เกิน 1000 ตัวอักษร) แล้วแตะ 'ส่งความคิดเห็น'
- text: ความคิดเห็นที่คุณเคยส่งจะแสดงอยู่ใต้ 'ความคิดเห็นของคุณ' แตะรายการเพื่ออ่านอีกครั้ง
- text: 'หากต้องการความช่วยเหลือ เปิดเมนูแล้วแตะ ''ความช่วยเหลือและการสนับสนุน'': มีคู่มือผู้ใช้ คำถามที่พบบ่อย และ ''ติดต่อเรา'' ซึ่งเปิดแอปอีเมลเพื่อเขียนถึงทีม RationSmart ''ข้อกำหนดและเงื่อนไข'' ก็อยู่ในเมนูเช่นกัน'
problems:
- title: '''ส่งความคิดเห็น'' ยังเป็นสีเทา'
  text: เลือกจำนวนดาวก่อน
- title: ไม่มีภาษาของฉันในรายการ
  text: ทีม RationSmart เพิ่มภาษาแยกตามประเทศ ตรวจสอบประเทศในหน้าข้อมูลโค หรือขอภาษาของคุณผ่าน 'ติดต่อเรา'
- title: ภาษาแสดงเป็นรหัสสั้น ๆ
  text: บางภาษาแสดงเป็นรหัส (เช่น 'TI') แทนชื่อภาษา คุณยังเลือกได้ หน้าจอทำงานเหมือนเดิม
- title: ข้อความบางส่วนบนหน้าจอยังเป็นภาษาอังกฤษ
  text: ข้อความนั้นยังไม่มีคำแปลในภาษาของคุณ บอกเราผ่าน 'ความคิดเห็น' ว่าคุณเห็นคำใดบ้าง
