# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
title: อาหารของคุณเองและค่าโภชนะของอาหาร
summary: เพิ่มอาหารที่ไม่มีในรายการ หรือใช้ค่าจากห้องปฏิบัติการของคุณเองสำหรับอาหาร
screen_label: การเลือกอาหาร
chapters:
- วิดีโอนี้แสดงอะไร
- เพิ่มอาหารกำหนดเอง
- ใช้ในการ์ด
- ช่องตามหมวดหมู่
- ค่าของคุณสำหรับอาหารในรายการ
- แก้ไขอาหารของคุณเอง
- เห็นเฉพาะคุณ
steps:
- text: ที่หน้าการเลือกอาหาร แตะ 'อาหารกำหนดเอง' ใน 'เพิ่มรายการวัตถุดิบอาหารสัตว์' เลือกประเภทอาหารและหมวดหมู่อาหาร พิมพ์ชื่ออาหาร แล้วกรอกค่าสารอาหารเป็น % ของวัตถุแห้ง (DM) แตะ 'ส่ง'
- text: แอปจะแสดง 'บันทึกอาหารกำหนดเองแล้ว จะปรากฏในรายการอาหาร' เลือกอาหารนั้นได้ในการ์ดอาหารใดก็ได้ ภายใต้ประเภทและหมวดหมู่ของมัน หรือค้นหาด้วยชื่อ
- text: ช่องที่ต้องกรอกขึ้นอยู่กับหมวดหมู่ แร่ธาตุ (Minerals) ถามเฉพาะวัตถุแห้ง เถ้า แคลเซียม และฟอสฟอรัส สารเสริม (Additive) ถาม NPN เพิ่มด้วย
- text: 'หากต้องการใช้ค่าของคุณเองกับอาหารจากรายการ: เลือกอาหารนั้นในการ์ดแล้วแตะไอคอนดินสอ แบบฟอร์มจะเปิดพร้อมค่าของอาหารนั้น แก้ไขแล้วแตะ ''ส่ง'' ระบบจะบันทึกเป็นสำเนาของคุณเอง (ชื่อขึ้นต้นด้วยชื่อจริงของคุณ) และการ์ดจะใช้สำเนานั้น อาหารในรายการกลางไม่เปลี่ยน'
- text: แตะดินสอบนอาหารกำหนดเองของคุณเพื่อแก้ไข แอปจะแสดง 'อัปเดตอาหารกำหนดเองแล้ว!'
- text: 'อาหารกำหนดเองของคุณเป็นข้อมูลส่วนตัว: ผู้ใช้อื่นจะไม่เห็น และใช้ได้ทุกประเทศที่คุณเลือกในหน้าข้อมูลโค'
problems:
- title: '''ต้องระบุชื่อและประเภทอาหาร'''
  text: พิมพ์ชื่อและเลือกประเภทอาหารก่อนแตะ 'ส่ง'
- title: '''ค่าสารอาหารต้องเป็นตัวเลขระหว่าง 0 ถึง 100 %'''
  text: ค่าสารอาหารเป็น % ของวัตถุแห้ง จึงต้องอยู่ระหว่าง 0 ถึง 100 ตรวจดูว่าใส่จุดทศนิยมผิดตำแหน่งหรือไม่
- title: ฉันหาอาหารกำหนดเองของฉันไม่เจอ
  text: ดูใต้ประเภทอาหารและหมวดหมู่อาหารที่คุณเลือกตอนบันทึก หรือค้นหาด้วยชื่อ
- title: จะหาค่าสารอาหารได้จากที่ไหน?
  text: ดีที่สุดคือผลวิเคราะห์จากห้องปฏิบัติการของอาหารของคุณเอง ถ้าไม่มี ให้เริ่มจากอาหารที่คล้ายกันในรายการ แล้วเปลี่ยนเฉพาะค่าที่คุณรู้
