title: ตั้งขีดจำกัดสำหรับอาหารและสำหรับสูตรอาหาร
summary: ควบคุมว่าสูตรอาหารใช้อาหารชนิดหนึ่งได้มากเท่าไร และตั้งขีดจำกัดสารอาหารสำหรับทั้งสูตรอาหาร
screen_label: การเลือกอาหาร
chapters:
- วิดีโอนี้แสดงอะไร
- จำกัดอาหารหนึ่งชนิด
- ตัวอย่าง
- ขีดจำกัดของสูตรอาหาร
- ขีดจำกัดในรายงาน
- ขีดจำกัดแบบยืดหยุ่น
- บันทึกไปกับรายงาน
steps:
- text: 'ขีดจำกัดอาหาร: บนการ์ดอาหาร หลังเลือกอาหารแล้ว ให้เปิด ''กำหนดปริมาณการใช้'' พิมพ์ค่าขั้นต่ำ และ/หรือค่าสูงสุด เป็น kg ต่อวันแบบตามที่ให้จริง (as fed) เว้นช่องว่างไว้หากไม่ต้องการจำกัด'
- text: 'ตัวอย่าง: กากถั่วเหลืองที่ตั้งค่าสูงสุด 2 kg ได้สูตรอาหารที่มีกากถั่วเหลือง 1.88 kg สูตรอาหารอาจแพงกว่าตอนไม่มีขีดจำกัด เพราะแอปต้องใช้อาหารชนิดอื่นแทน'
- text: 'ขีดจำกัดของสูตรอาหาร: แตะ ''ขีดจำกัดอาหารกำหนดเอง'' ขีดจำกัดแต่ละข้อแสดงช่วงที่อนุญาตและค่าเริ่มต้นตามสถานะทางสรีรวิทยา เช่น ''NDF สูงสุด'' หรือ ''แป้งสูงสุด'' เปลี่ยนเฉพาะที่จำเป็น แล้วแตะ ''ใช้ขีดจำกัด'''
- text: สร้างสูตรอาหาร การ์ด 'ขีดจำกัดที่คุณตั้งไว้' ในรายงานแสดงทุกขีดจำกัดที่คุณตั้ง และปริมาณอาหารแต่ละชนิดที่ถูกจำกัดซึ่งสูตรอาหารใช้ไป PDF ที่บันทึกไว้มีส่วนนี้เหมือนกัน
- text: 'ขีดจำกัดของไขมัน เยื่อใย และแป้งเป็นแบบยืดหยุ่น: แอปพยายามให้อยู่ในขีดจำกัด และรายงานจะแสดง ''หมายเหตุขีดจำกัดอาหาร'' เมื่อสูตรอาหารเกินขีดจำกัดใดขีดจำกัดหนึ่งมากกว่า 2.5 % ของขีดจำกัดนั้น'
- text: ขีดจำกัดจะถูกบันทึกไปกับรายงาน เมื่อคุณโหลดการจำลองที่บันทึกไว้จากประวัติในหน้าข้อมูลโค ขีดจำกัดก็จะกลับมาด้วย
problems:
- title: '''ค่าต่ำสุดต้องไม่มากกว่าค่าสูงสุด'''
  text: ทำให้ค่าขั้นต่ำน้อยกว่าค่าสูงสุด หรือลบค่าใดค่าหนึ่งออก
- title: ค่าสูงสุดเป็น 0 ไม่ได้
  text: หากไม่ต้องการใช้อาหารนั้น ให้ลบการ์ดของมัน หากไม่ต้องการจำกัด ให้เว้นช่องว่างไว้
- title: '''Value must be between … and …'''
  text: ขีดจำกัดของสูตรอาหารแต่ละข้อมีช่วงที่นักโภชนาการกำหนดไว้สำหรับสถานะทางสรีรวิทยานั้น พิมพ์ค่าที่อยู่ในช่วง แล้ว 'ใช้ขีดจำกัด' จะใช้ได้อีกครั้ง
- title: '''Forage NDF ต่ำสุดต้องไม่เกิน NDF สูงสุด'''
  text: เยื่อใยจากอาหารหยาบต้องไม่มากกว่าเยื่อใยทั้งหมด ลดค่า Forage NDF ต่ำสุด หรือเพิ่มค่า NDF สูงสุด
- title: '''กำหนดปริมาณการใช้'' เป็นสีเทา'
  text: เลือกอาหารในการ์ดก่อน
- title: ตั้งขีดจำกัดแล้วไม่พบสูตรอาหาร
  text: ขีดจำกัดเข้มงวดเกินไปสำหรับอาหารชุดนี้ ผ่อนหรือลบขีดจำกัดบางข้อ หรือเพิ่มอาหารอีกชนิด (หัวข้อ 12)
