title: 'เริ่มต้นใช้งานด่วน: จากเข้าสู่ระบบถึงรายงาน'
summary: 'ทั้งแอปในไม่กี่นาที: เข้าสู่ระบบ กรอกข้อมูลสัตว์ เลือกอาหาร แล้วรับสูตรอาหารที่ถูกที่สุด'
screen_label: ความช่วยเหลือและการสนับสนุน
chapters:
- RationSmart ทำอะไร
- เข้าสู่ระบบ
- กรอกข้อมูลสัตว์
- เลือกอาหารและราคา
- รับสูตรอาหารที่ถูกที่สุด
- บันทึกรายงาน
- สัตว์ตัวถัดไป
steps:
- text: เข้าสู่ระบบด้วยอีเมลและ PIN 6 หลักของคุณ แอปจะเปิดที่หน้าข้อมูลโค
- text: ที่หน้าข้อมูลโค พิมพ์ชื่อการจำลอง เลือกประเทศและสถานะทางสรีรวิทยา แล้วกรอกรายละเอียดของสัตว์ แตะ 'ดำเนินการต่อไปยังอาหาร'
- text: ที่หน้าการเลือกอาหาร ให้เลือก 'คำแนะนำอาหาร' ไว้ตามเดิม ในการ์ดอาหารแต่ละใบ เลือกประเภทอาหาร แล้วหมวดหมู่อาหาร แล้วอาหาร และพิมพ์ราคาต่อ kg ต้องมีอาหารหยาบอย่างน้อยหนึ่งชนิด
- text: 'แตะ ''สร้างคำแนะนำ'' ไม่กี่วินาทีต่อมา รายงานจะแสดงสูตรอาหารที่ถูกที่สุด: ให้อาหารแต่ละชนิดวันละกี่ kg และค่าใช้จ่ายต่อวัน'
- text: แตะ 'บันทึกรายงาน' เพื่อเก็บไว้ รายงานที่บันทึกและไฟล์ PDF อยู่ในเมนู 'รายงานอาหาร'
- text: แตะ 'กรณีใหม่' เพื่อทำต่อกับสัตว์ตัวถัดไป
problems:
- title: ปุ่ม 'ดำเนินการต่อไปยังอาหาร' ยังเป็นสีเทา
  text: มีช่องที่ต้องกรอกยังว่างอยู่ หรือมีค่าที่อยู่นอกช่วง (ช่วงที่ถูกต้องแสดงเป็นสีแดงใต้ช่อง) แก้ไขแล้วปุ่มจะเปลี่ยนเป็นสีเขียว
- title: สัตว์ของฉันเป็นลูกโค
  text: เลือก 'ลูกโค' เป็นสถานะทางสรีรวิทยา แอปจะแสดงแผนการให้นมแทนสูตรอาหาร
- title: '''ต้องการอาหารหยาบ'''
  text: ทุกสูตรอาหารต้องมีอาหารประเภทอาหารหยาบอย่างน้อยหนึ่งชนิด เพิ่มหนึ่งชนิดแล้วสร้างใหม่อีกครั้ง
