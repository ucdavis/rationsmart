title: መተግበሪያውን መጫን፣ መመዝገብ፣ መግባት
summary: RationSmartን ወደ ስልክዎ ያክሉ፣ መለያ ይፍጠሩ እና ይግቡ።
screen_label: መግቢያ
chapters:
- ይህ ቪዲዮ የሚያሳየው
- መተግበሪያውን ይክፈቱ
- ወደ ስልክዎ ያክሉት
- ይመዝገቡ
- ኢሜይልዎን ያረጋግጡ
- ይግቡ
- ይውጡ
steps:
- text: RationSmartን በስልክዎ አሳሽ (browser) ይክፈቱ፦ በAndroid ላይ Chrome፣ በiPhone ላይ Safari። በእንኳን ደህና መጡ (Welcome) ገጽ ላይ 'ይቀጥሉ' የሚለውን ይንኩ።
- text: እንደ መተግበሪያ ለመጠቀም፣ የመጫኛ ማሳሰቢያው (banner) እስኪታይ ጥቂት ሰከንዶች ይጠብቁ እና 'ጫን' የሚለውን ይንኩ። በAndroid ላይ፦ ምናሌውን (ሦስት ነጥቦች) ይንኩ፣ ከዚያ 'Add to Home screen' (ወደ መነሻ ገጽ ጨምር)፣ ከዚያ 'Add'። በiPhone ላይ፦ የማጋሪያ (Share) ቁልፉን ይንኩ፣ ከዚያ 'Add to Home Screen'፣ ከዚያ 'Add'። ከዚያም RationSmartን ከምልክቱ (icon) ይክፈቱ።
- text: አዲስ ተጠቃሚ ነዎት? በመግቢያ ገጹ ላይ 'እዚህ ይመዝገቡ' የሚለውን ይንኩ። ስምዎን፣ የኢሜይል አድራሻዎን እና አገርዎን ያስገቡ፣ ቋንቋዎንም ይምረጡ፦ ከገቡ በኋላ መተግበሪያው በዚያ ቋንቋ ይከፈታል። ባለ 6 አሃዝ PIN ይምረጡ፣ በ'የምስጥር ቁጥር (PIN) ያረጋግጡ' ውስጥ እንደገና ይጻፉት፣ እና 'ይቀጥሉ' የሚለውን ይንኩ።
- text: ከRationSmart የመጣውን ኢሜይል ይክፈቱ እና በውስጡ ያለውን አገናኝ (link) ይንኩ። መለያዎ አሁን ዝግጁ ነው።
- text: በመግቢያ ገጹ ላይ የኢሜይል አድራሻዎን እና PINዎን ያስገቡ እና 'ይቀጥሉ' የሚለውን ይንኩ። መተግበሪያው በከብት መረጃ ገጽ ላይ ይከፈታል። በሚቀጥለው ጊዜ መተግበሪያውን ሲከፍቱ፣ አሁንም እንደገቡ ነው።
- text: ለመውጣት ምናሌውን ይክፈቱ፣ 'ውጣ' የሚለውን ይንኩ፣ ከዚያ 'አዎ፣ ውጣ'።
problems:
- title: የማረጋገጫ ኢሜይል አልደረሰም
  text: በአይፈለጌ መልዕክት (spam) ማህደር ውስጥ ይመልከቱ። በ'ኢሜይልዎን ይዩ (ይፈትሹ)' ገጽ ላይ 'የማረጋገጫ ኢሜይል እንደገና ይላኩ' የሚለውን ይንኩ። በደቂቃ አንድ ጊዜ አዲስ ኢሜይል መጠየቅ ይችላሉ።
- title: '''Please verify your email address'' (እባክዎ የኢሜይል አድራሻዎን ያረጋግጡ)'
  text: PINዎ ትክክል ነው፣ ነገር ግን መለያው ገና አልተረጋገጠም። የማረጋገጫ ኢሜይሉን ይክፈቱ እና አገናኙን ይንኩ፣ ከዚያ እንደገና ይግቡ።
- title: '''ኢሜይል ወይም PIN ትክክል አይደለም።'''
  text: የኢሜይል አድራሻውን እና 6ቱን አሃዞች ይፈትሹ። PINዎን ረሱት? 'Forgot PIN? Tap here' (PIN ረሱ? እዚህ ይንኩ) የሚለውን ይንኩ (ርዕስ 2)።
- title: ከብዙ ሙከራዎች በኋላ መግባት ለጊዜው ይቆማል
  text: በአጭር ጊዜ ውስጥ ብዙ የተሳሳቱ ሙከራዎች ካሉ፣ መተግበሪያው ለተወሰነ ጊዜ መግባትን አይቀበልም። አንድ ደቂቃ ይጠብቁ እና እንደገና ይሞክሩ።
- title: '''This account was deleted'' (ይህ መለያ ተሰርዟል)'
  text: በተመሳሳይ የኢሜይል አድራሻ እንደገና ይመዝገቡ። ካረጋገጡት በኋላ፣ ቀደም ብለው ያስቀመጧቸው ሪፖርቶች ይመለሳሉ።
- title: መተግበሪያው በቋንቋዬ አይደለም
  text: ሲመዘገቡ ቋንቋ ካልመረጡ፣ ወይም ሌላ ቋንቋ ከፈለጉ፦ ከገቡ በኋላ ምናሌውን ይክፈቱ፣ 'መገለጫ' የሚለውን ይንኩ፣ ቋንቋዎን ይምረጡ እና 'መገለጫ ያዘምኑ' የሚለውን ይንኩ።
