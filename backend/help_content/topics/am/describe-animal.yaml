title: እንስሳዎን ይግለጹ
summary: የከብት መረጃን ይሙሉ፦ የጉዳዩ ስም፣ አገር፣ የእንስሳው ሁኔታ፣ የሰውነት፣ የወተት እና የአካባቢ መረጃ።
screen_label: የከብት መረጃ
chapters:
- ይህ ቪዲዮ የሚያሳየው
- የማስመሰል ዝርዝሮች
- የእንስሳው ሁኔታ
- የእንስሳት ባህሪያት
- የመራቢያ መረጃ
- የወተት ምርት
- አካባቢ
- ወደ መኖ ይቀጥሉ
- ጉዳይን እንደገና መጠቀም ወይም ማጽዳት
steps:
- text: በ'የማስመሰል ዝርዝሮች' ስር የማስመሰል ስም ይጻፉ (ለምሳሌ የላሟን ስም እና ቀኑን)፣ አገሩን እና የሪፖርቱን ቋንቋ ይምረጡ። አገሩ የትኞቹን መኖዎች መምረጥ እንደሚችሉ እና የገንዘብ ዓይነቱን ይወስናል።
- text: '''Physiological State'' (የእንስሳው ሁኔታ) ይምረጡ፦ የሚታለቡ ላሞች፣ ደረቅ ላሞች፣ ጊደሮች ወይም ጥጃዎች። ከዚያም ቅጹ ለዚያ ሁኔታ የሚያስፈልጉትን ቦታዎች ብቻ ያሳያል፤ የተለመዱ እሴቶችም አስቀድመው ተሞልተዋል።'
- text: በ'የእንስሳት ባህሪያት' ስር ዝርያውን ይምረጡ እና የሰውነት ክብደት (kg)፣ የሰውነት ሁኔታ ነጥብ (Body Condition Score)፣ የወሊድ ብዛት (Parity፣ የወለደችበት ጊዜ ብዛት) እና የክብደት ጭማሪ (BW Gain፣ kg በቀን) ያስገቡ።
- text: በ'የመራቢያ መረጃ' ስር የእርግዝና ቀናትን (Days of Pregnancy)፣ ለሚታለቡ ላሞች ደግሞ ከወለደች በኋላ የታለበችባቸውን ቀናት (Days in Milk) ያስገቡ።
- text: ለሚታለቡ ላሞች፣ በ'የወተት ምርት' ስር በቀን የሚገኘውን ወተት (ሊትር)፣ የወተት ስብ % (Milk Fat) እና የወተት ፕሮቲን % (Milk Protein) ያስገቡ። የወተት ዋጋ (Milk Price) አማራጭ ነው፦ ከገባ፣ ሪፖርቱ የወተት ገቢን ከመኖ ወጪ ጋር ያነጻጽራል።
- text: በ'አካባቢ' ስር አማካይ የሙቀት መጠን (°C) ያስገቡ። እንስሳው ለግጦሽ የሚጓዝ ከሆነ 'በግጦሽ ላይ ያሉ' የሚለውን ያብሩ እና የመሬት አቀማመጡን (Topography) እና የተጓዘውን ርቀት (km) ያስገቡ።
- text: '''ወደ መኖ ይቀጥሉ'' የሚለውን ይንኩ። የግድ መሞላት ያለባቸው ቦታዎች በሙሉ ሲሞሉ እና በክልላቸው ውስጥ ሲሆኑ አረንጓዴ ይሆናል። ለጥጃ፣ የወተት አመጋገብ ዕቅዱን ለማየት ''ይቀጥሉ'' የሚለውን ይንኩ።'
- text: ቀደም ያለ ጉዳይን እንደገና ለመጠቀም፣ ከ'የማስመሰል ዝርዝሮች' አጠገብ ያለውን የታሪክ ምልክት (history icon) ይንኩ እና የተቀመጠ ማስመሰል ይምረጡ፤ ከመቀጠልዎ በፊት አዲስ የማስመሰል ስም ይጻፉ። 'ቀይር' የከብት መረጃን እና የመኖ ምርጫን አጽድቶ ከአዲስ ያስጀምራል።
problems:
- title: አንድ እሴት 'Value Range' (የእሴት ክልል) በቀይ ያሳያል
  text: ቁጥሩ ለዚህ እንስሳ ከተፈቀደው ክልል ውጭ ነው። በሚታየው ክልል ውስጥ ያለ እሴት ይጻፉ።
- title: '''አገር ይቀየር?'''
  text: እያንዳንዱ አገር የራሱ የመኖ ዝርዝር አለው፤ ስለዚህ አገሩን መቀየር አስቀድመው የመረጧቸውን መኖዎች ያጠፋል። እነሱን ለማጽዳት 'ይቀጥሉ' የሚለውን፣ የነበረውን አገር ለማቆየት ደግሞ 'ሰርዝ' የሚለውን ይንኩ።
- title: '''አንዳንድ እሴቶች ከተፈቀደው ክልል ጋር እንዲስማሙ ተስተካክለዋል'''
  text: አንድ የተቀመጠ ጉዳይ ከዛሬው ክልል ውጭ የሆነ እሴት ነበረው፤ ስለዚህ መተግበሪያው ወደ ክልሉ ውስጥ አስገብቶታል። ከመቀጠልዎ በፊት እሴቶቹን ይፈትሹ።
- title: '''የተጓዘ ርቀት ቢያንስ 1 km መሆን አለበት'''
  text: '''በግጦሽ ላይ ያሉ'' ሲበራ፣ የተጓዘውን ርቀት ያስገቡ፤ 1 km ወይም ከዚያ በላይ። እንስሳው የማይግጥ ከሆነ ያጥፉት።'
