title: አሁን የሚመግቡትን ራሽን ይፈትሹ
summary: እንስሳዎ ዛሬ የሚበላውን ይጻፉ እና የሚጎድለውን፣ ምን ያህል ወተት ሊያስገኝ እንደሚችል እና ምን ያህል እንደሚያስወጣ ይመልከቱ።
screen_label: የግምገማ ሪፖርት
chapters:
- ይህ ቪዲዮ የሚያሳየው
- ግምገማ ያስሉ
- የግምገማ ማጠቃለያ
- የደረቅ ቁስ ቅበላ
- የወተት ምርት
- የንጥረ ምግብ ሚዛን
- የወጪ ትንተና
- የወተት ወጪ ህዳግ
- ምክር ያግኙ
steps:
- text: በመኖ ምርጫ ገጽ ላይ 'የአመጋገብ ግምገማ' የሚለውን ይምረጡ። አሁን የሚሰጡትን እያንዳንዱን መኖ ይምረጡ፣ ዋጋውን እና በቀን የሚመግቡትን kg (እንደተሰጠ፣ as fed) ይጻፉ። 'ግምገማ ይውሰዱ' የሚለውን ይንኩ። 'የግምገማ ሪፖርት' ይከፈታል።
- text: '''የግምገማ ማጠቃለያ'' የራሽኑን አጠቃላይ ሁኔታ (Overall Status፣ ለምሳሌ Marginal) እና ገዳቢ ምክንያቱን (Limiting Factor) ይሰጣል፦ ላሟን ወደ ኋላ የሚያስቀራት ንጥረ ምግብ።'
- text: '''አንድ ከብት በቀን የሚመገበው የደረቅ ቁስ አካል (ድርቆ መኖ) መጠን'' መኖዎችዎ የሚሰጡትን ትክክለኛ ቅበላ (Actual Intake) ላሟ መብላት ከምትችለው የታለመ ቅበላ (Target Intake) ጋር ያነጻጽራል። ''Below target'' (ከዒላማ በታች) ማለት ራሽኑ ላሟ መብላት ከምትችለው ያነሰ መኖ ይሰጣል ማለት ነው።'
- text: '''የወተት ምርት ትንተና''፦ ''እውን የወተት ምርት'' ይህ ራሽን ሊያስገኝ የሚችለው ወተት ነው፤ ከዒላማዎ (Target) ጎን ይታያል። ''በኃይል ሰጪ የተደገፈ'' እና ''በፕሮቲን የተደገፈ'' እያንዳንዱ ንጥረ ምግብ የሚፈቅደውን ወተት ያሳያሉ፤ ዝቅተኛው ገዳቢ ንጥረ ምግብ (Limiting Nutrient) ነው።'
- text: '''የንጥረ ምግብ ሚዛን'' እያንዳንዱን ንጥረ ምግብ ላሟ ከሚያስፈልጋት አንጻር እንደ ትርፍ (+) ወይም እጥረት (−) ያሳያል።'
- text: '''የወጪ ትንተና'' በቀን ጠቅላላ የአመጋገብ ወጪን፣ በ''የመኖ ዝርዝር'' ውስጥ የእያንዳንዱን መኖ ወጪ፣ እና ''ወጪ/ሊትር ወተት''ን ያሳያል፦ የአመጋገቡ ወጪ ይህ ራሽን ሊያስገኝ በሚችለው ወተት (እውን የወተት ምርት) ሲካፈል።'
- text: '''የወተት ወጪ ህዳግ'' የአንድ ሊትር የመኖ ወጪን ከወተት ዋጋዎ ጋር ያነጻጽራል። ለግምገማ፣ የሚቆጠረው ወጪ በወጪ ትንተና ውስጥ ያለው ''ወጪ/ሊትር ወተት'' ነው፤ ምክንያቱም ይህ ራሽን በእውነት ሊያስገኝ በሚችለው ወተት ላይ የተመሠረተ ነው።'
- text: ከተመሳሳይ መኖዎች ለተመሳሳይ እንስሳ ርካሹን አመጋገብ ለማግኘት 'የአመጋገብ ምክር አመንጩ' የሚለውን ይንኩ። ግምገማውን ልክ እንደ ምክር ያስቀምጡ እና ያጋሩ (ርዕስ 10)።
problems:
- title: '''እውን የወተት ምርት'' ከዒላማዬ ያነሰ ነው'
  text: ራሽኑ ገዳቢው ንጥረ ምግብ ያንሰዋል። በእሱ የበለጸገ መኖ ያክሉ (ለምሳሌ ፕሮቲን ገዳቢ ሲሆን የፕሮቲን ፋጉሎ (protein meal))፣ ወይም 'የአመጋገብ ምክር አመንጩ' የሚለውን ይንኩ።
- title: '''ለእያንዳንዱ መኖ ከ0 በላይ መጠን ያስገቡ፣ ወይም መኖውን ያስወግዱ።'''
  text: በግምገማ ውስጥ ያለ እያንዳንዱ መኖ አሁን በቀን የሚመግቡትን kg ይፈልጋል። ይጻፉት፣ ወይም ያንን መኖ ያስወግዱ።
- title: ራሴ የማበቅለው መኖ ዋጋ የለውም
  text: ዋጋውን 0 ብለው ይጻፉ። ግምገማው አሁንም ይሠራል፤ ያ መኖ በወጪው ላይ ምንም አይጨምርም።
- title: '''… of the selected feeds are no longer available'' (ከተመረጡት መኖዎች … አሁን አይገኙም)'
  text: ለመጨረሻ ጊዜ ከተጠቀሙበት በኋላ አንድ መኖ ከመኖ ቋቱ (library) ተወግዷል። ከምርጫው ያስወግዱት እና መኖዎቹን እንደገና ይምረጡ።
- title: ለጥጃዬ 'የአመጋገብ ግምገማ' የለም
  text: ጥጃዎች ከመኖ አመጋገብ ይልቅ የወተት አመጋገብ ዕቅድ ያገኛሉ (ርዕስ 7)።
