title: የራስዎ መኖዎች እና የመኖ እሴቶች
summary: በዝርዝሩ ውስጥ የሌለ መኖ ያክሉ፣ ወይም ለአንድ መኖ የራስዎን የላቦራቶሪ እሴቶች ይጠቀሙ።
screen_label: የመኖ ምርጫ
chapters:
- ይህ ቪዲዮ የሚያሳየው
- ብጁ መኖ ያክሉ
- በካርድ ውስጥ ይጠቀሙበት
- ቦታዎች በምድብ
- ለዝርዝሩ መኖ የራስዎ እሴቶች
- የራስዎን መኖ ይቀይሩ
- ለእርስዎ ብቻ የሚታይ
steps:
- text: በመኖ ምርጫ ገጽ ላይ 'ብጁ መኖ' የሚለውን ይንኩ። በ'ብጁ መኖ ጨምር' ውስጥ የመኖ ዓይነትን እና የመኖ ምድብን ይምረጡ፣ ለመኖው ስም ይጻፉ፣ እና የንጥረ ምግብ እሴቶቹን በደረቅ ቁስ (dry matter) % ይሙሉ። 'አስገባ' የሚለውን ይንኩ።
- text: መተግበሪያው 'ብጁ መኖ ተቀምጧል! በመኖ ዝርዝር ውስጥ ይታያል።' ይላል። በማንኛውም የመኖ ካርድ ውስጥ በዓይነቱ እና በምድቡ ስር ይምረጡት፣ ወይም ስሙን ይፈልጉ።
- text: ቦታዎቹ በምድቡ ላይ ይወሰናሉ። ማዕድናት (Minerals) ደረቅ ቁስ፣ አመድ (Ash)፣ ካልሲየም እና ፎስፈረስ ብቻ ይጠይቃሉ፤ ተጨማሪ ንጥረ ነገር (Additive) ደግሞ NPNም ይጠይቃል።
- text: ከዝርዝሩ ላለ መኖ የራስዎን እሴቶች ለመጠቀም፦ በካርድ ውስጥ ይምረጡት እና የእርሳስ ምልክቱን ይንኩ። ቅጹ ከመኖው እሴቶች ጋር ይከፈታል፤ ይቀይሯቸው እና 'አስገባ' የሚለውን ይንኩ። ይህ የራስዎን ቅጂ ያስቀምጣል (ስሙ በመጀመሪያ ስምዎ ይጀምራል)፣ ካርዱም ይጠቀምበታል። የጋራ መኖው አይቀየርም።
- text: ከራስዎ ብጁ መኖዎች አንዱን ለመቀየር በላዩ ያለውን እርሳስ ይንኩ፤ መተግበሪያው 'ብጁ መኖ ተዘምኗል!' ይላል።
- text: ብጁ መኖዎችዎ የግል ናቸው፦ ሌሎች ተጠቃሚዎች በጭራሽ አያዩዋቸውም። በከብት መረጃ ገጽ ላይ ወደሚመርጡት እያንዳንዱ አገር አብረውዎት ይሄዳሉ።
problems:
- title: '''የመኖ ስም እና ዓይነት ያስፈልጋል'''
  text: '''አስገባ'' የሚለውን ከመንካትዎ በፊት ስም ይጻፉ እና የመኖ ዓይነትን ይምረጡ።'
- title: '''የንጥረ ነገር እሴቶች ከ0 እስከ 100 % ያሉ ቁጥሮች መሆን አለባቸው።'''
  text: ንጥረ ምግቦች በደረቅ ቁስ % ናቸው፤ ስለዚህ እያንዳንዳቸው ከ0 እስከ 100 መሆን አለባቸው። የአስርዮሽ ነጥብ በተሳሳተ ቦታ እንዳልገባ ይፈትሹ።
- title: ብጁ መኖዬን ማግኘት አልቻልኩም
  text: ሲያስቀምጡት በመረጡት የመኖ ዓይነት እና የመኖ ምድብ ስር ይመልከቱ፣ ወይም ስሙን ይፈልጉ።
- title: የንጥረ ምግብ እሴቶቹን ከየት አገኛለሁ?
  text: በጣም ጥሩው የራስዎን መኖ በላቦራቶሪ ማስመርመር ነው። ከሌለዎት፣ በዝርዝሩ ውስጥ ካለ ተመሳሳይ መኖ ይጀምሩ እና የሚያውቁትን ብቻ ይቀይሩ።
