title: ሪፖርቶችዎን ያስቀምጡ፣ ያጋሩ እና ያግኙ
summary: ሪፖርትን ያቆዩ፣ PDFውን ያግኙ፣ ያጋሩት እና በኋላ እንደገና ይክፈቱት።
screen_label: የመኖ ሪፖርቶች
chapters:
- ይህ ቪዲዮ የሚያሳየው
- ሪፖርቱን ያስቀምጡ
- PDFውን ያግኙ፣ ይመልከቱ፣ ያጋሩ
- የመኖ ሪፖርቶች
- PDF እየተጠበቀ ነው
- ብዙ ሪፖርቶች
- የተቀመጠ ጉዳይን እንደገና ይጠቀሙ
- ያልተቀመጡ ሪፖርቶች
steps:
- text: በሪፖርት ላይ 'ሪፖርት አስቀምጥ' የሚለውን ይንኩ። መተግበሪያው 'Report saved successfully' (ሪፖርቱ በተሳካ ሁኔታ ተቀምጧል) ይላል። ተመሳሳዩን ሪፖርት እንደገና ማስቀመጥ ሁለተኛ ቅጂ አይፈጥርም።
- text: PDFውን ለማዘጋጀት 'PDF ያግኙ' የሚለውን ይንኩ። ዝግጁ ሲሆን፣ 'PDF ይመልከቱ' ይከፍተዋል፤ 'ሪፖርት አጋራ' ደግሞ በስልክዎ የማጋሪያ አማራጮች ይልከዋል (ወይም የPDF አገናኙን ይቀዳል)።
- text: የተቀመጡ ሪፖርቶችዎን ለማየት ምናሌውን ይክፈቱ እና 'የመኖ ሪፖርቶች' የሚለውን ይንኩ፤ አዲሶቹ ቀድመው ይታያሉ። 'ሪፖርት ይመልከቱ' PDFውን ይከፍታል፤ የሪፖርት መለያ ቁጥሩን (Report ID)፣ የሪፖርት ዓይነቱን እና ቀኑን ለማየት ከሪፖርቱ በታች ያለውን አሞሌ ይንኩ።
- text: አዲስ ሪፖርት PDFው እስኪዘጋጅ ለአንድ ደቂቃ ያህል 'PDF እየተጠበቀ ነው' ሊያሳይ ይችላል። ትንሽ ቆይተው 'የመኖ ሪፖርቶች' የሚለውን እንደገና ይክፈቱ።
- text: ከ20 በላይ የተቀመጡ ሪፖርቶች ሲኖሩ፣ ከታች ያሉትን የቀጣይ እና የቀዳሚ ገጽ ቁልፎች ይጠቀሙ።
- text: የተቀመጠ ጉዳይን እንደገና ለመጠቀም፣ የከብት መረጃ ገጽን ይክፈቱ እና ከ'የማስመሰል ዝርዝሮች' አጠገብ ያለውን የታሪክ ምልክት ይንኩ። እዚያ የሚዘረዘሩት የተቀመጡ ሪፖርቶች ብቻ ናቸው።
- text: ያላስቀመጡት ሪፖርት በዚህ ስልክ ላይ ለ24 ሰዓት ይቆያል፣ ከዚያ ይጠፋል። የሚያስፈልጉዎትን ያስቀምጡ።
problems:
- title: '''የተቀመጡ ሪፖርቶች የሉም'''
  text: እስካሁን ምንም ሪፖርት አላስቀመጡም። 'ሪፖርት ይፍጠሩ' የሚለውን ይንኩ፣ አመጋገብ ያዘጋጁ እና 'ሪፖርት አስቀምጥ' የሚለውን ይንኩ።
- title: '''PDF እየተጠበቀ ነው'' አይጠፋም'
  text: '''የመኖ ሪፖርቶች'' የሚለውን ዘግተው እንደገና ይክፈቱ። ከጥቂት ደቂቃዎች በኋላም ከታየ፣ ሪፖርቱን ከዝርዝሩ ይክፈቱ እና ''PDF ያግኙ'' የሚለውን ይንኩ።'
- title: '''የPDF አገናኝ ወደ ቅንጥብ ሰሌዳ ተቀድቷል'''
  text: ስልክዎ እዚህ የማጋሪያ ገጽ (share sheet) የለውም፤ ስለዚህ መተግበሪያው በምትኩ አገናኙን ቀድቷል። በመልዕክት ወይም በኢሜይል ውስጥ ይለጥፉት።
- title: ሪፖርቴ በከብት መረጃ ገጽ ታሪክ ውስጥ የለም
  text: ታሪኩ የተቀመጡ ሪፖርቶችን ብቻ ይዘረዝራል። ጉዳዩን እንደገና ያስሉ እና 'ሪፖርት አስቀምጥ' የሚለውን ይንኩ።
