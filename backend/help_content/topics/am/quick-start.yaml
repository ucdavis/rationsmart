title: ፈጣን መጀመሪያ፦ ከመግቢያ እስከ ሪፖርት
summary: ሙሉው መተግበሪያ በጥቂት ደቂቃዎች፦ ይግቡ፣ እንስሳዎን ይግለጹ፣ መኖዎችዎን ይምረጡ እና ርካሹን አመጋገብ ያግኙ።
screen_label: እርዳታ እና ድጋፍ
chapters:
- RationSmart ምን ይሠራል
- ይግቡ
- እንስሳዎን ይግለጹ
- መኖዎችን እና ዋጋዎችን ይምረጡ
- ርካሹን አመጋገብ ያግኙ
- ሪፖርቱን ያስቀምጡ
- ቀጣዩ እንስሳ
steps:
- text: በኢሜይልዎ እና ባለ 6 አሃዝ PINዎ (የምስጥር ቁጥር) ይግቡ። መተግበሪያው በከብት መረጃ (Cattle Info) ገጽ ላይ ይከፈታል።
- text: በከብት መረጃ ገጽ ላይ የማስመሰል ስም (Simulation Name) ይጻፉ፣ አገሩን እና የእንስሳውን ሁኔታ (Physiological State) ይምረጡ፣ የእንስሳውንም ዝርዝሮች ይሙሉ። 'ወደ መኖ ይቀጥሉ' የሚለውን ይንኩ።
- text: በመኖ ምርጫ (Feed Selection) ገጽ ላይ 'የአመጋገብ ምክር' እንደተመረጠ ይተዉት። በእያንዳንዱ የመኖ ካርድ ውስጥ በመጀመሪያ የመኖ ዓይነትን፣ ከዚያ የመኖ ምድብን፣ ከዚያ መኖውን ይምረጡ፣ የአንድ kg ዋጋውንም ይጻፉ። ቢያንስ አንድ አሰራማ መኖ (forage) ያካትቱ።
- text: '''ምክር አመንጪ'' የሚለውን ይንኩ። ከጥቂት ሰከንዶች በኋላ ሪፖርቱ ርካሹን አመጋገብ ያሳያል፦ ከእያንዳንዱ መኖ በቀን ስንት kg መስጠት እንዳለብዎት እና የዕለት ወጪውን።'
- text: ሪፖርቱን ለማቆየት 'ሪፖርት አስቀምጥ' የሚለውን ይንኩ። የተቀመጡ ሪፖርቶችዎ እና PDFዎቻቸው በምናሌው ውስጥ 'የመኖ ሪፖርቶች' ስር ይገኛሉ።
- text: በቀጣዩ እንስሳ ላይ ለመሥራት 'አዲስ ጉዳይ' የሚለውን ይንኩ።
problems:
- title: '''ወደ መኖ ይቀጥሉ'' ግራጫ ሆኖ ይቆያል'
  text: የግድ መሞላት ያለበት አንድ ቦታ ባዶ ነው፣ ወይም አንድ እሴት ከተፈቀደው ክልል ውጭ ነው (ክልሉ ከቦታው በታች በቀይ ይታያል)። ያስተካክሉት፤ ቁልፉም አረንጓዴ ይሆናል።
- title: እንስሳዬ ጥጃ ነው
  text: በእንስሳው ሁኔታ (Physiological State) ላይ 'ጥጃዎች' የሚለውን ይምረጡ። ከዚያም መተግበሪያው ከመኖ አመጋገብ ይልቅ የወተት አመጋገብ ዕቅድ ያሳያል።
- title: '''የሚያስፈልግ አሰራማ መኖ (Forage)'''
  text: እያንዳንዱ አመጋገብ የመኖ ዓይነቱ አሰራማ መኖ (Forage) የሆነ ቢያንስ አንድ መኖ ያስፈልገዋል። አንድ ይጨምሩ እና እንደገና ያመንጩ።
