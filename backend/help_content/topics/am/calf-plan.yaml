title: ለጥጃ የወተት አመጋገብ ዕቅድ
summary: ለጥጃ በቀን ምን ያህል ወተት እንደሚሰጥ፣ በስንት ጊዜ ተከፍሎ እንደሚሰጥ እና መቼ ጡት እንደሚያስጥሉ።
screen_label: የጥጃ ወተት መመገብ
chapters:
- ይህ ቪዲዮ የሚያሳየው
- '''ጥጃዎች'' ይምረጡ'
- ዕለታዊ ወተት
- የመመገቢያ ጊዜያት እና ጡት ማስጣል
- አንድ ምሳሌ
- የእንክብካቤ ምክሮች
- ማስቀመጥ እና PDF
steps:
- text: በከብት መረጃ ገጽ ላይ የእንስሳውን ሁኔታ (Physiological State) 'ጥጃዎች' ብለው ይምረጡ። የጥጃውን የሰውነት ክብደት በkg ይጻፉ እና 'ይቀጥሉ' የሚለውን ይንኩ።
- text: '''የጥጃ ወተት መመገብ'' ዕቅዱ ይከፈታል። ''ዕለታዊ ወተት'' በቀን የሚሰጠው ወተት በሊትር ነው፦ የጥጃው የሰውነት ክብደት አንድ አሥረኛ።'
- text: '''በምገባ ጊዜ'' ዕለታዊውን ወተት በቀን ለ2 ምገባዎች ይከፍለዋል። ''ጡት ማስጣል'' ወተት መመገብን ማቆም ያለብዎትን ዕድሜ በቀናት ይሰጣል (56 ቀናት)።'
- text: ምሳሌ፦ 40 kg የሚመዝን ጥጃ በቀን 4.0 ሊትር ያገኛል፤ በቀን ሁለት ጊዜ 2.0 ሊትር እየተሰጠው።
- text: ከዕቅዱ በታች ያሉትን የእንክብካቤ ምክሮች ያንብቡ። ዕቅዱ መመሪያ ነው፦ ከእንስሳት ሐኪምዎ ጋር ሆነው ያስተካክሉት።
- text: ዕቅዱን ለማቆየት 'ሪፖርት አስቀምጥ' የሚለውን ይንኩ፣ ከዚያ ሙሉ የወተት አመጋገብ መርሃ ግብር ያለበትን ቅጂ ለማግኘት 'PDF ያግኙ' የሚለውን ይንኩ (ርዕስ 10)።
problems:
- title: የሰውነት ክብደቱ ተቀባይነት አላገኘም
  text: ለጥጃዎች የሰውነት ክብደት ከ30 እስከ 100 kg መካከል መሆን አለበት። የተፈቀደው ክልል ከቦታው በታች ይታያል።
- title: ለጥጃዬ የመኖ ምርጫ ገጽ አይታየኝም
  text: ጥጃዎች የወተት አመጋገብ ዕቅድ ብቻ ያገኛሉ፤ መተግበሪያው ለእነሱ የመኖ አመጋገብም ሆነ ግምገማ አያዘጋጅም።
- title: ጥጃዬ ትልቅ ነው፣ ጠንካራ መኖም ይበላል
  text: ለወጣት እያደገ ላለ እንስሳ የመኖ አመጋገብ ለማግኘት ከ'ጥጃዎች' ይልቅ 'ጊደሮች' የሚለውን ይምረጡ።
