title: አመጋገብ ሳይገኝ ሲቀር፣ እና ሌሎች ችግሮች
summary: ሪፖርቱ ምንም አመጋገብ ሳያገኝ ሲቀር፣ መልዕክት ሲታይ ወይም መተግበሪያው ምላሽ ሳይሰጥ ሲቀር ምን ማድረግ እንዳለብዎት።
screen_label: የምክር ሪፖርት
chapters:
- ይህ ቪዲዮ የሚያሳየው
- መፍትሄ አልተገኘም
- ማስታወሻዎቹን ያንብቡ
- መኖ ያክሉ
- ገደቦችዎን ያላሉ
- እንስሳውን ይፈትሹ
- የአመጋገብ ግምገማን ይጠቀሙ
- እንደገና ይሞክሩ
steps:
- text: ሪፖርቱ 'የተመቻቸ መፍትሄ አልተገኘም' ሲል፣ የመኖዎችዎ ምንም ዓይነት ድብልቅ የዚህን እንስሳ ፍላጎት አያሟላም። የአመጋገብ ሰንጠረዥ የለም፤ 'ማስታወሻዎች' ካርዱ ምክንያቱን ያብራራል።
- text: '''Violated Parameters'' (ያልተሟሉ መለኪያዎች) የሚለውን ያንብቡ፦ እያንዳንዱ መስመር አመጋገቡ ሊያሟላው ያልቻለውን ይጠቅሳል፣ ለምሳሌ ''Phosphorus Requirement: below minimum'' (የፎስፈረስ ፍላጎት፦ ከዝቅተኛው በታች) ወይም ''Total Fibre (NDF): above maximum'' (ጠቅላላ ፋይበር፦ ከከፍተኛው በላይ)። ''Recommendations'' (ምክሮች) ምን መቀየር እንዳለብዎት ይጠቁማል።'
- text: የጎደለውን የሚያሟላ መኖ ያክሉ፦ ለካልሲየም ወይም ለፎስፈረስ የማዕድን መኖ፣ ለፕሮቲን የፕሮቲን ፋጉሎ፣ ለኃይል እህል። አንድ ወይም ሁለት መኖዎች ብቻ ያሉት ራሽን ብዙ ጊዜ ሁሉንም ፍላጎቶች ማሟላት አይችልም።
- text: ገደቦችን ካስቀመጡ ('የማካተት ገደቦችን ያቀናብሩ' ወይም 'ብጁ የአመጋገብ ገደቦች')፣ ያላሏቸው ወይም ያስወግዷቸው። በሪፖርቱ ላይ ያለው 'ያስቀመጧቸው ገደቦች' ካርድ የትኞቹን እንዳስቀመጡ ያሳያል።
- text: እንስሳውን ይፈትሹ፦ ካሉዎት መኖዎች አንጻር በጣም ከፍተኛ የሆነ የወተት ዒላማ ሊሟላ አይችልም። የወተቱን መጠን ይቀንሱ፣ ወይም የተሻሉ መኖዎችን ያክሉ።
- text: ራስዎ በመረጡት ራሽን ውስጥ የትኛው ንጥረ ምግብ እንደሚጎድል ለማየት 'የአመጋገብ ግምገማ' የሚለውን ይጠቀሙ (ርዕስ 6)።
- text: ከዚያ የኋላ ቀስቱን ይንኩ እና ወደ መኖ ምርጫ ይመለሱ፣ ለውጡን ያድርጉ እና 'ምክር አመንጪ' የሚለውን እንደገና ይንኩ።
problems:
- title: '''የሚያስፈልግ አሰራማ መኖ (Forage)'''
  text: እያንዳንዱ አመጋገብ የመኖ ዓይነቱ አሰራማ መኖ (Forage) የሆነ ቢያንስ አንድ መኖ ያስፈልገዋል። አንድ ይጨምሩ እና እንደገና ያመንጩ።
- title: '''… of the selected feeds are no longer available'' (ከተመረጡት መኖዎች … አሁን አይገኙም)'
  text: አንድ መኖ ከመኖ ቋቱ (library) ተወግዷል። ከምርጫው ያስወግዱት እና መኖዎቹን እንደገና ይምረጡ።
- title: ሪፖርቱ በጣም ይዘገያል ወይም አይከፈትም
  text: የኢንተርኔት ግንኙነትዎን ይፈትሹ እና እንደገና ይሞክሩ። ይህ መደጋገሙን ከቀጠለ፣ ከማስመሰል ስሙ (Simulation Name) ጋር በ'ያግኙን' በኩል ይጻፉልን።
- title: መተግበሪያው ስህተት ያሳያል ወይም ምላሽ መስጠት ያቆማል
  text: አንድ ገጽ ወደ ኋላ ይመለሱ እና እንደገና ይሞክሩ፤ ያስገቡት መረጃ አይጠፋም። አሁንም ካልሠራ፣ ይውጡ፣ እንደገና ይግቡ፣ እና በ'ግብረመልስ' ወይም በ'ያግኙን' በኩል ይንገሩን።
