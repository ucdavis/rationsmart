title: ቋንቋ፣ ግብረመልስ እና እርዳታ
summary: መተግበሪያውን በቋንቋዎ ይጠቀሙ፣ ሀሳብዎን ይንገሩን እና እርዳታ ያግኙ።
screen_label: ግብረመልስ
chapters:
- ይህ ቪዲዮ የሚያሳየው
- ቋንቋውን ይምረጡ
- ነባሪ ቋንቋዎ
- የPDF ቋንቋ
- ግብረመልስ ይላኩ
- የቀደሙ ግብረመልሶችዎ
- እርዳታ እና ድጋፍ
steps:
- text: በከብት መረጃ ገጽ ላይ በ'የማስመሰል ዝርዝሮች' ስር ቋንቋውን ይምረጡ። ገጾቹ እና ሪፖርቱ ወዲያውኑ ወደዚያ ቋንቋ ይቀየራሉ። ዝርዝሩ ለመረጡት አገር የተዘጋጁትን ቋንቋዎች ያሳያል።
- text: አንድን ቋንቋ ነባሪ ለማድረግ ምናሌውን ይክፈቱ፣ 'መገለጫ' የሚለውን ይንኩ፣ ቋንቋውን ይምረጡ እና 'መገለጫ ያዘምኑ' የሚለውን ይንኩ።
- text: የተቀመጠው PDF ትርጉም ባለበት ቦታ ለአርዕስቶቹ፣ ለማስታወሻዎቹ እና ለመኖ ስሞቹ የሪፖርቱን ቋንቋ ይጠቀማል። ቁጥሮች አይቀየሩም። ጥቂት የሁኔታ ቃላት ሆን ተብሎ በእንግሊዝኛ ይቀራሉ።
- text: ግብረመልስ ለመስጠት ምናሌውን ይክፈቱ እና 'ግብረመልስ' የሚለውን ይንኩ። በ'መተግበሪያውን ይገምግሙ' ስር ከ1 እስከ 5 ኮከቦች ይምረጡ፣ 'የግብረመልስ ምድብ' ይምረጡ፣ አስተያየትዎን ይጻፉ (እስከ 1000 ፊደላት) እና 'ግብረመልስ አስገባ' የሚለውን ይንኩ።
- text: የቀደሙ ግብረመልሶችዎ በ'ግብረመልሶችዎ' ስር ተዘርዝረዋል። እንደገና ለማንበብ አንዱን ይንኩ።
- text: ለእርዳታ ምናሌውን ይክፈቱ እና 'እርዳታ እና ድጋፍ' የሚለውን ይንኩ፦ የተጠቃሚ መመሪያው፣ በተደጋጋሚ የሚጠየቁ ጥያቄዎች፣ እና ለRationSmart ቡድን ለመጻፍ የኢሜይል መተግበሪያዎን የሚከፍተው 'ያግኙን' እዚያ አሉ። 'ውሎች እና ሁኔታዎች'ም በምናሌው ውስጥ አለ።
problems:
- title: '''ግብረመልስ አስገባ'' ግራጫ ሆኖ ይቆያል'
  text: በመጀመሪያ የኮከብ ደረጃ ይምረጡ።
- title: ቋንቋዬ በዝርዝሩ ውስጥ የለም
  text: ቋንቋዎች በየአገሩ የሚጨመሩት በRationSmart ቡድን ነው። በከብት መረጃ ገጽ ላይ ያለውን አገር ይፈትሹ፣ ወይም ቋንቋዎን በ'ያግኙን' በኩል ይጠይቁ።
- title: አንድ ቋንቋ እንደ አጭር ኮድ ይታያል
  text: አንዳንድ ቋንቋዎች ከስማቸው ይልቅ ኮድ (ለምሳሌ 'TI') ያሳያሉ። አሁንም መምረጥ ይችላሉ፤ ገጾቹ በተመሳሳይ መንገድ ይሠራሉ።
- title: አንዳንድ የገጽ ጽሑፎች አሁንም በእንግሊዝኛ ናቸው
  text: ያ ጽሑፍ በቋንቋዎ ገና ትርጉም የለውም። የትኞቹን ቃላት እንደሚያዩ በ'ግብረመልስ' በኩል ይንገሩን።
