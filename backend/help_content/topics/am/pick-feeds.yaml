title: መኖዎችን እና ዋጋዎችን ይምረጡ
summary: ያሉዎትን መኖዎች ይምረጡ፣ የእያንዳንዱን ዋጋ ይጻፉ እና አመጋገቡን ያስሉ።
screen_label: የመኖ ምርጫ
chapters:
- ይህ ቪዲዮ የሚያሳየው
- ዘዴውን ይምረጡ
- የመኖ ካርድ ይሙሉ
- መኖ ይፈልጉ
- ዋጋውን ይጻፉ
- ለግምገማ መጠኖች
- ተጨማሪ መኖዎችን ያክሉ
- አመጋገቡን ያስሉ
- የራስዎ መኖዎች እና ገደቦች
steps:
- text: ከላይ፣ 'የአመጋገብ ምክር' (መተግበሪያው ርካሹን አመጋገብ ያገኛል) ወይም 'የአመጋገብ ግምገማ' (አሁን የሚመግቡትን መጠን ይጽፋሉ፣ መተግበሪያውም ይፈትሻቸዋል) ይምረጡ።
- text: በ'FEED 1' (መኖ 1) ውስጥ የመኖ ዓይነትን (አሰራማ መኖ (Forage)፣ የተጠናከረ መኖ (Concentrate) ወይም የተሟላ አመጋገብ (Complete diet))፣ ከዚያ የመኖ ምድብን፣ ከዚያ መኖውን ይምረጡ። እያንዳንዱ ዝርዝር የሚከፈተው ከእሱ በፊት ያለውን ከመረጡ በኋላ ብቻ ነው።
- text: ወይም ይፈልጉ፦ 'ተመረጠ' እንዲያሳይ አንድ ካርድ ይንኩ፣ ከዚያ የመኖውን ስም በከፊል (ለምሳሌ 'soybean' - አኩሪ አተር) በፍለጋ ሳጥኑ ውስጥ ይጻፉ። ያንን ካርድ ለመሙላት አንድ ውጤት ይንኩ።
- text: የአንድ kg ዋጋን በአገርዎ ገንዘብ ይጻፉ። መለያው የገንዘብ ዓይነቱን ያሳያል፣ ለምሳሌ 'Price ETB/KG'።
- text: በ'የአመጋገብ ግምገማ' ውስጥ፣ አሁን በቀን የሚመግቡትን kg ደግሞ ይጻፉ። ካርዱ ወጪውን (ዋጋ × kg) ያሳያል።
- text: ለእያንዳንዱ ተጨማሪ መኖ 'ተጨማሪ መኖ ይጨምሩ' የሚለውን ይንኩ፤ ካርድን በቆሻሻ መጣያ ምልክቱ ያስወግዱ። ቢያንስ አንድ አሰራማ መኖ ያካትቱ።
- text: '''ምክር አመንጪ'' የሚለውን ይንኩ (በአመጋገብ ግምገማ ውስጥ ደግሞ ''ግምገማ ይውሰዱ'')። ሪፖርቱ ከጥቂት ሰከንዶች በኋላ ይከፈታል።'
- text: አማራጭ፦ 'ብጁ መኖ' የራስዎን መኖ ያክላል (ርዕስ 8)። 'ብጁ የአመጋገብ ገደቦች' እና በካርድ ላይ ያለው 'የማካተት ገደቦችን ያቀናብሩ' አመጋገቡን ይቆጣጠራሉ (ርዕስ 9)።
problems:
- title: '''የሚያስፈልግ አሰራማ መኖ (Forage)'''
  text: እያንዳንዱ አመጋገብ የመኖ ዓይነቱ አሰራማ መኖ (Forage) የሆነ ቢያንስ አንድ መኖ ያስፈልገዋል። 'እሺ፣ አሰራማ መኖ (Forage) ጨምር' የሚለውን ይንኩ፣ አንድ ይጨምሩ እና እንደገና ያመንጩ።
- title: '''ያልተሟላ መኖ'''
  text: አንድ ካርድ ዓይነት አለው ግን መኖ የለውም። ካርዱን ለመጨረስ 'አይ፣ ይከለሱ' የሚለውን፣ ያለዚያ ካርድ ለማስኬድ ደግሞ 'አዎ፣ ይቀጥሉ' የሚለውን ይንኩ።
- title: '''ይህ መኖ አስቀድሞ ተመርጧል'''
  text: እያንዳንዱ መኖ በአንድ ካርድ ላይ ብቻ መሆን ይችላል። ዋጋውን መኖው አስቀድሞ ባለበት ካርድ ላይ ይቀይሩ።
- title: '''Price can''t be negative.'' (ዋጋ ከዜሮ በታች መሆን አይችልም)'
  text: 0 ወይም ከዚያ በላይ የሆነ ዋጋ ይጻፉ።
- title: '''ለእያንዳንዱ መኖ ከ0 በላይ መጠን ያስገቡ፣ ወይም መኖውን ያስወግዱ።'''
  text: በአመጋገብ ግምገማ ውስጥ እያንዳንዱ መኖ አሁን በቀን የሚመግቡትን kg ይፈልጋል። ይጻፉት፣ ወይም መኖውን ያስወግዱ።
- title: የጠበቅሁት መኖ የለም
  text: ዝርዝሮቹ በከብት መረጃ ገጽ ላይ የተመረጠውን አገር መኖዎች እና የራስዎን ብጁ መኖዎች ያሳያሉ። አገሩን ይፈትሹ፣ ወይም መኖውን በ'ብጁ መኖ' ያክሉ።
