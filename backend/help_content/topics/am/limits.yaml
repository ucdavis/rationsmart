title: ለመኖዎች እና ለአመጋገቡ ገደቦችን ያስቀምጡ
summary: አመጋገቡ ከአንድ መኖ ምን ያህል መጠቀም እንደሚችል ይቆጣጠሩ፣ ለሙሉ አመጋገቡም የንጥረ ምግብ ገደቦችን ያስቀምጡ።
screen_label: የመኖ ምርጫ
chapters:
- ይህ ቪዲዮ የሚያሳየው
- አንድ መኖ ይገድቡ
- አንድ ምሳሌ
- የአመጋገብ ገደቦች
- በሪፖርቱ ላይ ያሉ ገደቦች
- ለስላሳ ገደቦች
- ከሪፖርቱ ጋር ይቀመጣሉ
steps:
- text: የመኖ ገደብ፦ በመኖ ካርድ ላይ፣ መኖውን ከመረጡ በኋላ 'የማካተት ገደቦችን ያቀናብሩ' የሚለውን ያብሩ። ዝቅተኛ (Min) እና/ወይም ከፍተኛ (Max) መጠን በቀን kg እንደተሰጠ (as fed) ይጻፉ። ገደብ ካልፈለጉ ሳጥኑን ባዶ ይተዉት።
- text: ምሳሌ፦ የአኩሪ አተር ፋጉሎ (Soybean meal) ከፍተኛ (Max) 2 kg ሲሆን፣ ከእሱ 1.88 kg የያዘ አመጋገብ ይገኛል። አመጋገቡ ያለገደቡ ከሚሆነው የበለጠ ሊያስወጣ ይችላል፤ ምክንያቱም መተግበሪያው ሌሎች መኖዎችን መጠቀም አለበት።
- text: የአመጋገብ ገደቦች፦ 'ብጁ የአመጋገብ ገደቦች' የሚለውን ይንኩ። እያንዳንዱ ገደብ የተፈቀደውን ክልል እና ለእንስሳው ሁኔታ (Physiological State) ነባሪ እሴቱን ያሳያል፣ ለምሳሌ 'NDF max' ወይም 'Starch max'። የሚያስፈልግዎትን ብቻ ይቀይሩ እና 'ገደቦችን ይተግብሩ' የሚለውን ይንኩ።
- text: አመጋገቡን ያመንጩ። በሪፖርቱ ውስጥ ያለው 'ያስቀመጧቸው ገደቦች' ካርድ ያስቀመጧቸውን ሁሉንም ገደቦች እና አመጋገቡ ከእያንዳንዱ የተገደበ መኖ ምን ያህል እንደተጠቀመ ይዘረዝራል። የተቀመጠው PDF ተመሳሳይ ክፍል አለው።
- text: የስብ፣ የፋይበር (ቃጫ) እና የስታርች ገደቦች ለስላሳ ናቸው፦ መተግበሪያው እነሱን ለማሳካት ይሞክራል፤ አመጋገቡ አንዱን ገደብ ከገደቡ 2.5 % በላይ ካለፈ ደግሞ ሪፖርቱ 'የአመጋገብ ገደብ ማስታወሻዎች' ያሳያል።
- text: ገደቦች ከሪፖርቱ ጋር ይቀመጣሉ። በከብት መረጃ ገጽ ላይ ካለው ታሪክ የተቀመጠ ማስመሰል ሲጭኑ፣ ገደቦቹም አብረው ይመለሳሉ።
problems:
- title: '''Minimum can''t be more than the maximum.'' (ዝቅተኛው ከከፍተኛው መብለጥ አይችልም)'
  text: ዝቅተኛውን (Min) ከከፍተኛው (Max) ያሳንሱ፣ ወይም አንዱን ያጽዱ።
- title: ከፍተኛ (Max) 0 ተቀባይነት የለውም
  text: አንድን መኖ ለማስቀረት ካርዱን ያስወግዱ። ገደብ ካልፈለጉ ሳጥኑን ባዶ ይተዉት።
- title: '''Value must be between … and …'' (እሴቱ ከ… እስከ … መሆን አለበት)'
  text: እያንዳንዱ የአመጋገብ ገደብ ለዚያ የእንስሳ ሁኔታ (Physiological State) በሥነ-ምግብ ባለሙያዎች የተወሰነ ክልል አለው። በውስጡ ያለ እሴት ይጻፉ፤ 'ገደቦችን ይተግብሩ' እንደገና ይሠራል።
- title: '''Forage NDF Min ከ NDF Max መብለጥ አይችልም'''
  text: ከአሰራማ መኖ የሚገኘው ፋይበር ከጠቅላላው ፋይበር መብለጥ አይችልም። Forage NDF Minን ይቀንሱ ወይም NDF Maxን ይጨምሩ።
- title: '''የማካተት ገደቦችን ያቀናብሩ'' ግራጫ ነው'
  text: በመጀመሪያ በካርዱ ውስጥ መኖ ይምረጡ።
- title: ከገደቦች ጋር ምንም አመጋገብ አልተገኘም
  text: ገደቦቹ ለእነዚህ መኖዎች በጣም ጥብቅ ናቸው። አንድ ገደብ ያላሉ ወይም ያስወግዱ፣ ወይም ሌላ መኖ ያክሉ (ርዕስ 12)።
