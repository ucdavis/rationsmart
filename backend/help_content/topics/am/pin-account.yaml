title: PIN እና መለያ
summary: የተረሳ PIN፣ PIN መቀየር፣ መገለጫዎን ማስተካከል ወይም መለያዎን መሰረዝ።
screen_label: የእርስዎ መገለጫ
chapters:
- ይህ ቪዲዮ የሚያሳየው
- PINዎን ከረሱ
- አዲስ PIN ያስቀምጡ
- PINዎን ይቀይሩ
- መገለጫዎን ያዘምኑ
- የቆየ ባለ 4 አሃዝ PIN
- መለያዎን ይሰርዙ
steps:
- text: PINዎን ረሱት? በመግቢያ ገጹ ላይ 'Forgot PIN? Tap here' (PIN ረሱ? እዚህ ይንኩ) የሚለውን ይንኩ፣ የተመዘገቡበትን የኢሜይል አድራሻ ይጻፉ እና 'ይቀጥሉ' የሚለውን ይንኩ።
- text: ከRationSmart የመጣውን ኢሜይል ይክፈቱ እና 'Reset my PIN' (PINዬን ዳግም አስጀምር) የሚለውን ይንኩ። አንድ ገጽ ይከፈታል፦ አዲሱን ባለ 6 አሃዝ PINዎን ሁለት ጊዜ ይጻፉ እና 'Save new PIN' (አዲሱን PIN አስቀምጥ) የሚለውን ይንኩ። አገናኙ የሚሠራው አንድ ጊዜ ብቻ፣ ለ30 ደቂቃ ነው፤ እስኪያስቀምጡ ድረስ የቆየው PINዎ መሥራቱን ይቀጥላል።
- text: በአዲሱ PINዎ ይግቡ። PINዎን እያስታወሱት በሌላ ጊዜ ለመቀየር፣ ምናሌውን ይክፈቱ፣ 'መገለጫ' የሚለውን ይንኩ፣ ከዚያ 'የምስጥር ቁጥር ይቀይሩ'፦ የአሁኑን PINዎን ያስገቡ፣ ከዚያ አዲሱን ሁለት ጊዜ፣ እና 'የምስጥር ቁጥርዎን ይቀይሩ' የሚለውን ይንኩ።
- text: ስምዎን፣ አገርዎን ወይም ቋንቋዎን ለመቀየር 'መገለጫ' የሚለውን ይክፈቱ፣ ለውጡን ያድርጉ እና 'መገለጫ ያዘምኑ' የሚለውን ይንኩ። ቁልፉ የሚሠራው አንድ ነገር ከቀየሩ በኋላ ብቻ ነው።
- text: አሁንም የቆየ ባለ 4 አሃዝ PIN አለዎት? በእሱ ሲገቡ፣ መተግበሪያው ባለ 6 አሃዝ PIN እንዲያስቀምጡ ይጠይቅዎታል። የቆየውን PIN እና አዲሱን ሁለት ጊዜ ያስገቡ።
- text: መለያዎን ለመሰረዝ 'መገለጫ' የሚለውን ይክፈቱ፣ 'ይሰርዙ' የሚለውን ይንኩ፣ ከዚያ 'አዎ'፣ እና በPINዎ ያረጋግጡ። በኋላ ለመመለስ በተመሳሳይ የኢሜይል አድራሻ እንደገና ይመዝገቡ፦ የተቀመጡ ሪፖርቶችዎ ይመለሳሉ።
problems:
- title: ምንም ኢሜይል አልደረሰም
  text: በአይፈለጌ መልዕክት (spam) ማህደር ውስጥ ይመልከቱ፣ የጻፉትንም አድራሻ ይፈትሹ። ከአንድ ደቂቃ በኋላ እንደገና መጠየቅ ይችላሉ። ለደህንነትዎ ሲባል፣ መተግበሪያው ለእያንዳንዱ አድራሻ ተመሳሳይ መልዕክት ያሳያል።
- title: '''Link expired'' (አገናኙ ጊዜው አልፎበታል)'
  text: የዳግም ማስጀመሪያ አገናኙ የሚሠራው አንድ ጊዜ ብቻ እና ለ30 ደቂቃ ብቻ ነው። መተግበሪያውን ይክፈቱ፣ እንደገና 'Forgot PIN? Tap here' የሚለውን ይንኩ፣ እና በጣም አዲሱን ኢሜይል ይጠቀሙ።
- title: '''አዲሶቹ የምስጥር ቁጥሮ አይዛመዱም'''
  text: በሁለቱም ሳጥኖች ውስጥ በትክክል አንድ አይነት አዲስ PIN ይጻፉ።
- title: መለያ ሲሰርዙ 'Invalid PIN.' (PIN ልክ አይደለም)
  text: PINው የተሳሳተ ነበር፣ ስለዚህ ምንም አልተሰረዘም። የአሁኑን PINዎን ይጻፉ።
- title: '''ስም ባዶ መሆን አይችልም'''
  text: '''መገለጫ ያዘምኑ'' የሚለውን ከመንካትዎ በፊት ስም ይጻፉ።'
