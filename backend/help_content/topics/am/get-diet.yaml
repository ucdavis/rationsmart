title: በዝቅተኛ ወጪ የሚዘጋጅ አመጋገብ ያግኙ እና ሪፖርቱን ያንብቡ
summary: ምክር ያስሉ እና የሪፖርቱን እያንዳንዱን ክፍል ይረዱ።
screen_label: የምክር ሪፖርት
chapters:
- ይህ ቪዲዮ የሚያሳየው
- አመጋገቡን ያመንጩ
- የሪፖርት ዝርዝሮች
- ወጪ ቆጣቢ አመጋገብ
- የመፍትሄ ማጠቃለያ
- የወተት ወጪ ህዳግ
- ያስቀመጧቸው ገደቦች
- ማስታወሻዎች እና ሚቴን
- ማስቀመጥ፣ PDF፣ ቀጣይ ጉዳይ
steps:
- text: በመኖ ምርጫ ገጽ ላይ 'ምክር አመንጪ' የሚለውን ይንኩ። 'ሪፖርትዎን በማመንጨት ላይ' ለጥቂት ሰከንዶች ይታያል፣ ከዚያ 'የምክር ሪፖርት' ይከፈታል።
- text: ከላይ ያለው 'የሪፖርት ዝርዝሮች' የሪፖርት መለያ ቁጥሩን (Report ID)፣ የማስመሰል መለያ ቁጥሩን (Simulation ID)፣ ስምዎን እና ሪፖርቱ የተዘጋጀበትን ጊዜ ያሳያል። 'የእንስሳት ባህሪያት' የጻፏቸውን የእንስሳ ዝርዝሮች ይደግማል፤ ስለዚህ ሊፈትሿቸው ይችላሉ።
- text: '''ወጪ ቆጣቢ አመጋገብ'' መልሱ ነው፦ ለእያንዳንዱ መኖ፣ በቀን ስንት kg እንደተሰጠ (as fed፣ ላሟ ፊት የሚያስቀምጡት ክብደት) መስጠት እንዳለብዎት፣ የአንድ kg ዋጋውን እና የዕለት ወጪውን። የመጨረሻው መስመር በቀን ጠቅላላ የአመጋገብ ወጪ (Total Diet Cost) ነው።'
- text: '''የመፍትሄ ማጠቃለያ'' የዕለት ወጪውን (Daily Cost)፣ አመጋገቡ የታቀደለትን የወተት መጠን፣ የደረቅ ቁስ ቅበላን (Dry Matter Intake፣ ውሃው ሳይቆጠር ያለው መኖ፣ kg በቀን) እና የአሰራማ መኖ : የተጠናከረ መኖ ጥምርታን ያሳያል።'
- text: '''የወተት ወጪ ህዳግ'' የሚታየው ለሚታለቡ ላሞች የወተት ዋጋ ሲጽፉ ነው። ''የአመጋገብ ወጪ / ሊትር'' ለእያንዳንዱ ሊትር ወተት የመኖ ወጪ ነው፣ ''የወተት ዋጋ / ሊትር'' የእርስዎ የወተት ዋጋ ነው፣ ልዩነቱ ደግሞ ወተቱ ከመኖ ወጪ ብቻ በላይ የሚያስገኘው ነው። የጉልበት፣ የእንስሳት ሕክምና እና ሌሎች ወጪዎች አልተካተቱበትም።'
- text: '''ያስቀመጧቸው ገደቦች'' የመኖ ወይም የአመጋገብ ገደቦችን ሲያስቀምጡ ይታያል፦ እያንዳንዱን ገደብ እና አመጋገቡ ከዚያ መኖ ምን ያህል እንደተጠቀመ ይዘረዝራል (ርዕስ 9)።'
- text: '''ማስታወሻዎች'' የሚታየው ትኩረትዎን የሚሻ ነገር ሲኖር ብቻ ነው፣ ለምሳሌ ከዒላማው በታች የሆነ ንጥረ ምግብ፣ ምን መቀየር እንዳለብዎት ከሚገልጽ ምክር ጋር። ''የአካባቢ ተጽዕኖ'' ላሟ በዚህ አመጋገብ የምታመነጨውን ሚቴን ያሳያል።'
- text: ሪፖርቱን ለማቆየት 'ሪፖርት አስቀምጥ' የሚለውን ይንኩ፤ ከዚያ 'PDF ያግኙ'፣ 'PDF ይመልከቱ' ወይም 'ሪፖርት አጋራ' (ርዕስ 10)። 'አዲስ ጉዳይ' ቀጣዩን እንስሳ በተመሳሳይ ግብዓቶች ይጀምራል። የኋላ ቀስቱ ወደ መኖ ምርጫ ይመልሳል፤ እዚያም መኖዎችን ወይም ዋጋዎችን ቀይረው እንደገና ማመንጨት ይችላሉ።
problems:
- title: '''የተመቻቸ መፍትሄ አልተገኘም'''
  text: የመኖዎችዎ ምንም ዓይነት ድብልቅ የዚህን እንስሳ ፍላጎት አያሟላም። ማስታወሻዎቹ የጎደለውን እና ምን መቀየር እንዳለብዎት ይዘረዝራሉ። ርዕስ 12ን ይመልከቱ።
- title: '''የወተት ወጪ ህዳግ'' ካርድ የለም'
  text: የሚታየው ለሚታለቡ ላሞች ብቻ ነው፣ እና በከብት መረጃ ገጽ ላይ የወተት ዋጋ ሲጻፍ ብቻ። ወደ ኋላ ይመለሱ፣ የወተት ዋጋውን ይጻፉ እና እንደገና ያመንጩ።
- title: '''የአመጋገብ ገደብ ማስታወሻዎች'''
  text: አመጋገቡ በ'ብጁ የአመጋገብ ገደቦች' ውስጥ ካስቀመጡት ገደብ ውስጥ መቆየት አልቻለም። ማስታወሻው ውጤቱን እና የእርስዎን ገደብ ያሳያል። ገደቡን ያላሉ ወይም ሌሎች መኖዎችን ያክሉ።
- title: አንድ መኖ በጣም ትንሽ መጠን ያሳያል፣ ለምሳሌ 0.01 kg
  text: ርካሹ አመጋገብ ያንን መኖ በጭራሽ አይፈልገውም ማለት ይቻላል። መኖውን አውጥተው እንደገና ማመንጨት ይችላሉ፤ ወጪው የሚቀየረው በጣም ትንሽ ነው።
- title: አንዳንድ ቃላት በእንግሊዝኛ ይቀራሉ
  text: በመተግበሪያው ውስጥ ያሉ የሁኔታ ቃላት (status words) ሆን ተብሎ በእንግሊዝኛ ይቀራሉ። የተቀመጠው PDF ትርጉም ባለበት ቦታ ለአርዕስቶቹ፣ ለማስታወሻዎቹ እና ለመኖ ስሞቹ የሪፖርቱን ቋንቋ ይጠቀማል።
