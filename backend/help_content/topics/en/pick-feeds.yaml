title: "Pick feeds and prices"
summary: "Choose the feeds you have, type the price of each and run the diet."
updated: "2026-11-16"
video: null
steps:
  - text: "At the top, choose 'Diet Recommendation' (the app finds the cheapest diet) or 'Diet Evaluation' (you type the amounts you feed now, and the app checks them)."
  - text: "In 'FEED 1', choose the Feed Type (Forage, Concentrate or Complete diet), then the Feed Category, then the Feed. Each list opens only after you choose the one before it."
  - text: "Or search: tap a card so it shows 'Selected', then type part of the feed name (for example 'soybean') in the search box. Tap a result to fill that card."
  - text: "Type the price per kg in your country's currency. The label shows the currency, for example 'Price ETB/KG'."
  - text: "In 'Diet Evaluation', also type the kg per day you feed now. The card shows the cost (price × kg)."
  - text: "Tap 'Add More Feed' for each extra feed; remove a card with its bin icon. Include at least one forage."
  - text: "Tap 'Generate Recommendation' (or 'Get Evaluation' in Diet Evaluation). The report opens after a few seconds."
  - text: "Optional: 'Custom Feed' adds a feed of your own (topic 8). 'Custom Diet Limits' and 'Set inclusion limits' on a card control the diet (topic 9)."
problems:
  - title: "'Forage Required'"
    text: "Every diet needs at least one feed of type Forage. Tap 'OK, Add a Forage', add one and generate again."
  - title: "'Incomplete Feeds'"
    text: "A card has a type but no feed. Tap 'No, Review' to finish it, or 'Yes, Proceed' to run without that card."
  - title: "'Already this feed is selected'"
    text: "Each feed can be on one card only. Change the price on the card that already has it."
  - title: "'Price can't be negative.'"
    text: "Type a price of 0 or more."
  - title: "'Enter a quantity greater than 0 for every feed, or remove the feed.'"
    text: "In Diet Evaluation every feed needs the kg per day you feed now. Type it, or remove the feed."
  - title: "A feed I expect is missing"
    text: "The lists show the feeds of the country chosen on Cattle Info, plus your own custom feeds. Check the country, or add the feed with 'Custom Feed'."
