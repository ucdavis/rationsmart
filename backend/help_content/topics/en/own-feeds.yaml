title: "Your own feeds and feed values"
summary: "Add a feed that is not in the list, or use your own lab values for a feed."
updated: "2026-11-19"
video:
  youtube_id: "Db3ll-oSFQI"
  seconds: 86
  poster: own-feeds-video-9x16.webp
  chapters:
    - {start: 0, label: "What this video shows"}
    - {start: 10, label: "Add a custom feed"}
    - {start: 27, label: "Use it in a card"}
    - {start: 37, label: "Fields by category"}
    - {start: 48, label: "Your values for a listed feed"}
    - {start: 65, label: "Change your own feed"}
