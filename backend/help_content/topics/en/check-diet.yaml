title: "Check the ration you feed now"
summary: "Type what your animal eats today and see what it lacks, what milk it can support and what it costs."
updated: "2026-11-17"
video: null
steps:
  - text: "On Feed Selection choose 'Diet Evaluation'. Pick each feed you give now, type its price and the kg per day you feed (as fed). Tap 'Get Evaluation'. The 'Evaluation Report' opens."
  - text: "'Evaluation Summary' gives the Overall Status of the ration (for example Marginal) and the Limiting Factor: the nutrient that holds the cow back."
  - text: "'Dry Matter Intake' compares the Actual Intake your feeds give with the Target Intake the cow can eat. 'Below target' means the ration gives less feed than the cow could eat."
  - text: "'Milk Production Analysis': 'Actual Milk' is the milk this ration can support, next to your Target. 'Energy-Supported' and 'Protein-Supported' show the milk each nutrient allows; the lower one is the Limiting Nutrient."
  - text: "'Nutrient Balance' shows each nutrient as a surplus (+) or a shortage (−) against what the cow needs."
  - text: "'Cost Analysis' shows the Total Diet Cost per day, the cost of each feed in 'Feed Breakdown', and 'Cost/Litre Milk': the diet cost divided by the milk this ration can support (Actual Milk)."
  - text: "'Milk Cost Margin' compares the feed cost per litre with your milk price. For an evaluation, the cost that counts is the 'Cost/Litre Milk' in Cost Analysis, because it is based on the milk this ration can really support."
  - text: "Tap 'Generate Diet Recommendation' to get the cheapest diet from the same feeds for the same animal. Save and share the evaluation the same way as a recommendation (topic 10)."
problems:
  - title: "'Actual Milk' is lower than my target"
    text: "The ration is short of the Limiting Nutrient. Add a feed rich in it (for example a protein meal when protein is limiting), or tap 'Generate Diet Recommendation'."
  - title: "'Enter a quantity greater than 0 for every feed, or remove the feed.'"
    text: "Every feed in an evaluation needs the kg per day you feed now. Type it, or remove that feed."
  - title: "A feed I grow myself has no price"
    text: "Type 0 as its price. The evaluation still runs; that feed adds nothing to the cost."
  - title: "'… of the selected feeds are no longer available'"
    text: "A feed was removed from the library since you last used it. Remove it from the selection and choose the feeds again."
  - title: "There is no 'Diet Evaluation' for my calf"
    text: "Calves get a milk-feeding plan instead of a feed diet (topic 7)."
