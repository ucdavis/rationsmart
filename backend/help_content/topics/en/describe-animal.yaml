title: "Describe your animal"
summary: "Fill in Cattle Info: the case name, country, animal state, body, milk and environment."
updated: "2026-11-16"
video: null
steps:
  - text: "Under 'Simulation Details', type a Simulation Name (for example the cow's name and the date), choose the Country and the Language of the report. The country decides which feeds you can pick and the currency."
    image: describe-animal-01.webp
  - text: "Choose the 'Physiological State': Lactating cows, Dry cows, Heifers or Calves. The form then shows only the fields for that state, with usual values already filled in."
    image: describe-animal-02.webp
  - text: "Under 'Animal Characteristics', choose the breed and enter the Body Weight (kg), Body Condition Score, Parity (number of calvings) and BW Gain (kg per day)."
    image: describe-animal-03.webp
  - text: "Under 'Reproductive Data', enter the Days of Pregnancy, and for lactating cows the Days in Milk."
  - text: "For lactating cows, under 'Milk Production' enter the milk per day (litres), Milk Fat % and Milk Protein %. The Milk Price is optional: with it, the report compares milk income with feed cost."
  - text: "Under 'Environment', enter the average temperature (°C). If the animal walks to graze, switch on 'Active Grazing' and enter the Topography and the distance walked (km)."
  - text: "Tap 'Continue to Feed'. It turns green when every required field is filled and inside its range. For a calf, tap 'Continue' to see the milk-feeding plan."
    image: describe-animal-07.webp
  - text: "To reuse an earlier case, tap the history icon next to 'Simulation Details' and pick a saved simulation; type a new Simulation Name before continuing. 'Reset' clears Cattle Info and Feed Selection to start fresh."
problems:
  - title: "A value shows 'Value Range' in red"
    text: "The number is outside the allowed range for this animal. Type a value inside the range shown."
  - title: "'Change country?'"
    text: "Each country has its own feed list, so changing the country clears the feeds you already picked. Tap 'Continue' to clear them, or 'Cancel' to keep the country you had."
  - title: "'Some values were adjusted to fit the allowed range'"
    text: "A saved case had a value outside today's range, so the app moved it into the range. Check the values before you continue."
  - title: "'Distance walked must be at least 1 km'"
    text: "With 'Active Grazing' on, enter the distance walked, 1 km or more. If the animal does not graze, switch it off."
