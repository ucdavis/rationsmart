steps:
  - text: "Forgot your PIN? On the Login screen tap 'Forgot PIN? Tap here', type your registered email address and tap 'Proceed'."
    image: pin-account-01.webp
    video_start: 10
  - text: "Open the email from RationSmart and tap 'Reset my PIN'. A page opens: type your new 6-digit PIN twice and tap 'Save new PIN'. The link works once, for 30 minutes; until you save, your old PIN still works."
    image: pin-account-02.webp
    video_start: 21
  - text: "Log in with your new PIN. To change your PIN another time while you remember it, open the menu, tap 'Profile', then 'Change PIN': enter your current PIN, then the new one twice, and tap 'Update PIN'."
    video_start: 34
  - text: "To change your name, country or language, open 'Profile', make the change and tap 'Update Profile'. The button works only after you change something."
    image: pin-account-04.webp
    video_start: 54
  - text: "Still have an old 4-digit PIN? When you log in with it, the app asks you to set a 6-digit PIN. Enter the old PIN and the new one twice."
    video_start: 65
  - text: "To delete your account, open 'Profile', tap 'Delete', then 'Yes', and confirm with your PIN. To come back later, register again with the same email address: your saved reports return."
    video_start: 75
problems:
  - title: "No email arrived"
    text: "Look in the spam folder and check the address you typed. You can ask again after one minute. For your safety, the app shows the same message for every address."
  - title: "'Link expired'"
    text: "The reset link works once and only for 30 minutes. Open the app, tap 'Forgot PIN? Tap here' again and use the newest email."
  - title: "'New PINs do not match'"
    text: "Type exactly the same new PIN in both boxes."
  - title: "'Invalid PIN.' when deleting"
    text: "The PIN was wrong, so nothing was deleted. Type your current PIN."
  - title: "'Name cannot be empty'"
    text: "Type a name before tapping 'Update Profile'."
