title: "PIN and account"
summary: "Forgot PIN, change PIN, edit your profile or delete your account."
updated: "2026-11-19"
video:
  youtube_id: "DLETcIm7PLI"
  seconds: 88
  poster: pin-account-video-9x16.webp
  chapters:
    - {start: 0, label: "What this video shows"}
    - {start: 10, label: "Forgot your PIN"}
    - {start: 21, label: "Set a new PIN"}
    - {start: 34, label: "Change your PIN"}
    - {start: 54, label: "Update your profile"}
    - {start: 65, label: "An old 4-digit PIN"}
