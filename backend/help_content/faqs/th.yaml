# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
forage-required:
  question: ทำไมแอปจึงแสดง 'ต้องการอาหารหยาบ'?
  answer: ทุกสูตรอาหารต้องมีอาหารประเภทอาหารหยาบอย่างน้อยหนึ่งชนิด แตะ 'ตกลง เพิ่มอาหารหยาบ' เลือกอาหารหยาบในหน้าการเลือกอาหาร แล้วสร้างใหม่อีกครั้ง
no-diet-found:
  question: รายงานแสดง 'ไม่พบสูตรที่เหมาะสมที่สุด' ฉันทำอะไรได้บ้าง?
  answer: 'อาหารของคุณไม่สามารถตอบสนองความต้องการของสัตว์ตัวนี้ได้ อ่านหมายเหตุ: เพิ่มอาหารที่ให้สิ่งที่ขาด (แร่ธาตุ โปรตีน หรือพลังงาน) ผ่อนขีดจำกัดที่คุณตั้งไว้ หรือตรวจสอบเป้าหมายน้ำนม ดู ''เมื่อไม่พบสูตรอาหาร'''
feed-missing:
  question: ทำไมฉันหาอาหารบางชนิดในรายการไม่เจอ?
  answer: รายการแสดงอาหารของประเทศที่เลือกไว้ในหน้าข้อมูลโค รวมกับอาหารกำหนดเองของคุณ ตรวจสอบประเทศ ค้นหาด้วยส่วนหนึ่งของชื่อ หรือเพิ่มอาหารเองด้วย 'อาหารกำหนดเอง'
own-values:
  question: ฉันใช้อาหารของฉันเอง หรือค่าจากห้องปฏิบัติการของฉันเองได้ไหม?
  answer: ได้ 'อาหารกำหนดเอง' ใช้เพิ่มอาหารใหม่ ส่วนดินสอบนการ์ดอาหารจะบันทึกสำเนาของคุณเองพร้อมค่าของคุณ มีเพียงคุณที่เห็นอาหารกำหนดเองของคุณ
margin-meaning:
  question: ส่วนต่างน้ำนมในรายงานคือกำไรของฉันใช่ไหม?
  answer: 'ไม่ใช่ เป็นราคานมลบค่าอาหารต่อลิตร: คือรายได้จากน้ำนมที่เหลือหลังหักค่าอาหารเท่านั้น ไม่รวมค่าแรง ค่าสัตวแพทย์ และค่าใช้จ่ายอื่น'
eval-cost-per-litre:
  question: ในการประเมิน ควรใช้ต้นทุนต่อลิตรค่าไหน?
  answer: ใช้ 'ต้นทุน/ลิตรนม' ในการวิเคราะห์ต้นทุน ค่านี้คือต้นทุนอาหารหารด้วยปริมาณน้ำนมที่สูตรอาหารรองรับได้จริง ('นมแท้') ซึ่งอาจน้อยกว่าเป้าหมายของคุณ
calf-milk:
  question: ลูกโคของฉันควรได้นมเท่าไร?
  answer: เลือก 'ลูกโค' ในหน้าข้อมูลโค แล้วพิมพ์น้ำหนักตัว แผนจะให้นมวันละหนึ่งในสิบของน้ำหนักตัวเป็นลิตร แบ่ง 2 มื้อ และหย่านมภายใน 56 วัน ปรับใช้ร่วมกับสัตวแพทย์ของคุณ
limit-feed:
  question: จะทำอย่างไรไม่ให้สูตรอาหารใช้อาหารชนิดหนึ่งมากเกินไป?
  answer: บนการ์ดของอาหารนั้น เปิด 'กำหนดปริมาณการใช้' แล้วพิมพ์ค่าสูงสุดเป็น kg ต่อวัน การ์ด 'ขีดจำกัดที่คุณตั้งไว้' ในรายงานจะแสดงว่าสูตรอาหารใช้ไปเท่าไร
saved-reports:
  question: รายงานที่ฉันบันทึกไว้อยู่ที่ไหน?
  answer: เปิดเมนูแล้วแตะ 'รายงานอาหาร' 'ดูรายงาน' เปิด PDF รายงานที่คุณไม่ได้บันทึกจะไม่แสดงที่นั่น
pdf-pending:
  question: รายงานของฉันแสดง 'กำลังสร้างไฟล์ PDF'
  answer: PDF จะถูกสร้างอยู่เบื้องหลังหลังจากคุณบันทึก เปิด 'รายงานอาหาร' อีกครั้งหลังผ่านไปหนึ่งนาที
forgot-pin:
  question: ฉันลืม PIN ต้องทำอย่างไร?
  answer: ที่หน้าเข้าสู่ระบบ แตะ 'Forgot PIN? Tap here' แล้วพิมพ์อีเมลของคุณ เปิดอีเมล แตะ 'Reset my PIN' แล้วตั้ง PIN ใหม่ 6 หลัก PIN เดิมยังใช้ได้จนกว่าคุณจะตั้งใหม่
change-language:
  question: จะใช้แอปเป็นภาษาของฉันได้อย่างไร?
  answer: เลือกภาษาในหน้าข้อมูลโคสำหรับรายงานนี้ หรือตั้งภาษาเริ่มต้นในโปรไฟล์แล้วแตะ 'อัปเดตข้อมูลส่วนตัว' ภาษาที่มีให้เลือกขึ้นอยู่กับประเทศ
contact-team:
  question: จะติดต่อทีม RationSmart ได้อย่างไร?
  answer: เปิดเมนู แตะ 'ความช่วยเหลือและการสนับสนุน' แล้วแตะ 'ติดต่อเรา' แอปอีเมลของคุณจะเปิดขึ้น
