# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
forage-required:
  question: ऐप 'चारा आवश्यक' क्यों दिखाता है?
  answer: हर आहार में कम से कम एक पशु आहार चारा (Forage) प्रकार का होना चाहिए। 'ठीक है, चारा जोड़ें' पर टैप करें, पशु आहार का चयन स्क्रीन पर कोई चारा चुनें और फिर से आहार तैयार करें।
no-diet-found:
  question: रिपोर्ट में 'कोई अनुकूलित समाधान नहीं मिला' लिखा है। मैं क्या करूँ?
  answer: 'आपके पशु आहार इस पशु की ज़रूरतें पूरी नहीं कर सकते। नोट्स पढ़ें: ऐसा पशु आहार जोड़ें जो कमी पूरी करे (खनिज, प्रोटीन या ऊर्जा), आपकी तय की गई सीमाएँ ढीली करें, या दूध का लक्ष्य जाँचें। ''जब कोई आहार न मिले'' देखें।'
feed-missing:
  question: मुझे सूची में कोई पशु आहार क्यों नहीं मिल रहा?
  answer: सूचियों में पशुओ से संबंधित जानकारी पर चुने गए देश के पशु आहार दिखते हैं, साथ में आपके अपने अनुकूलित पशु आहार। देश जाँचें, नाम का कुछ हिस्सा लिखकर खोजें, या 'अनुकूलित पशु आहार' से वह पशु आहार खुद जोड़ें।
own-values:
  question: क्या मैं अपना पशु आहार या अपनी लैब जाँच के मान इस्तेमाल कर सकता हूँ?
  answer: हाँ। 'अनुकूलित पशु आहार' नया पशु आहार जोड़ता है; पशु आहार कार्ड पर पेंसिल से आपके मानों वाली आपकी अपनी कॉपी सहेजी जाती है। आपके अनुकूलित पशु आहार सिर्फ़ आप देख सकते हैं।
margin-meaning:
  question: क्या रिपोर्ट पर दिखाया गया दूध मार्जिन मेरा मुनाफ़ा है?
  answer: 'नहीं। यह प्रति लीटर दूध की कीमत में से प्रति लीटर पशु आहार की लागत घटाकर निकलता है: यानी दूध सिर्फ़ पशु आहार की लागत के ऊपर कितना कमाता है। मज़दूरी, पशु चिकित्सा और दूसरे खर्च इसमें शामिल नहीं हैं।'
eval-cost-per-litre:
  question: मूल्यांकन में मुझे प्रति लीटर कौन-सी लागत इस्तेमाल करनी चाहिए?
  answer: लागत विश्लेषण में दी गई 'प्रति लीटर दूध की लागत' इस्तेमाल करें। इसमें आहार की लागत को उस दूध से भाग दिया जाता है जिसके लिए यह आहार सच में काफ़ी है ('वास्तविक दूध'), जो आपके लक्ष्य से कम हो सकता है।
calf-milk:
  question: मेरे बछड़े को कितना दूध मिलना चाहिए?
  answer: पशुओ से संबंधित जानकारी पर 'बछड़े' चुनें और शरीर का वजन लिखें। योजना हर दिन शरीर के वजन का दसवाँ हिस्सा लीटर में देती है, 2 बार में, और 56 दिन तक दूध छुड़ाने की सलाह देती है। अपने पशु चिकित्सक की सलाह से इसमें बदलाव करें।
limit-feed:
  question: आहार में किसी एक पशु आहार का बहुत ज़्यादा इस्तेमाल कैसे रोकूँ?
  answer: उस पशु आहार के कार्ड पर 'समावेशन सीमाएं सेट करें' चालू करें और kg प्रति दिन में अधिकतम (Max) लिखें। रिपोर्ट का 'आपके द्वारा तय सीमाएँ' कार्ड दिखाता है कि आहार में कितना इस्तेमाल हुआ।
saved-reports:
  question: मेरी सहेजी गई रिपोर्टें कहाँ हैं?
  answer: मेनू खोलें और 'पशु आहार रिपोर्ट' पर टैप करें। 'रिपोर्ट देखें' PDF खोलता है। जो रिपोर्टें आपने नहीं सहेजीं, वे वहाँ नहीं दिखतीं।
pdf-pending:
  question: मेरी रिपोर्ट पर 'PDF तैयार होना बाकी है' दिख रहा है।
  answer: सहेजने के बाद PDF पीछे (बैकग्राउंड में) बनती है। एक मिनट बाद 'पशु आहार रिपोर्ट' फिर से खोलें।
forgot-pin:
  question: मैं अपना PIN भूल गया हूँ। मैं क्या करूँ?
  answer: लॉगिन स्क्रीन पर 'Forgot PIN? Tap here' (PIN भूल गए? यहाँ टैप करें) पर टैप करें और अपना ईमेल पता लिखें। ईमेल खोलें, 'Reset my PIN' (मेरा PIN रीसेट करें) पर टैप करें और नया 6 अंकों का PIN चुनें। जब तक आप ऐसा नहीं करते, आपका पुराना PIN काम करता रहता है।
change-language:
  question: मैं ऐप को अपनी भाषा में कैसे इस्तेमाल करूँ?
  answer: इस रिपोर्ट के लिए पशुओ से संबंधित जानकारी पर भाषा चुनें, या प्रोफ़ाइल में अपनी डिफ़ॉल्ट भाषा तय करें और 'प्रोफ़ाइल अपडेट करें' पर टैप करें। कौन-सी भाषाएँ मिलेंगी, यह देश पर निर्भर करता है।
contact-team:
  question: मैं RationSmart टीम से संपर्क कैसे करूँ?
  answer: मेनू खोलें, 'सहायता एवं समर्थन' पर टैप करें, फिर 'संपर्क करें' पर। इससे आपका ईमेल ऐप खुल जाता है।
