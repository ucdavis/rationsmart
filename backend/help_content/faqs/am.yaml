# Written by scripts_2/help_translations.py from a translation workbook; edit through the workbook.
forage-required:
  question: መተግበሪያው ለምን 'የሚያስፈልግ አሰራማ መኖ (Forage)' ይላል?
  answer: እያንዳንዱ አመጋገብ የመኖ ዓይነቱ አሰራማ መኖ (Forage) የሆነ ቢያንስ አንድ መኖ ያስፈልገዋል። 'እሺ፣ አሰራማ መኖ (Forage) ጨምር' የሚለውን ይንኩ፣ በመኖ ምርጫ ገጽ ላይ አሰራማ መኖ ይምረጡ እና እንደገና ያመንጩ።
no-diet-found:
  question: ሪፖርቱ 'የተመቻቸ መፍትሄ አልተገኘም' ይላል። ምን ማድረግ እችላለሁ?
  answer: መኖዎችዎ የዚህን እንስሳ ፍላጎት ማሟላት አይችሉም። ማስታወሻዎቹን ያንብቡ፦ የጎደለውን (ማዕድናት፣ ፕሮቲን ወይም ኃይል) የሚያሟላ መኖ ያክሉ፣ ያስቀመጧቸውን ገደቦች ያላሉ፣ ወይም የወተት ዒላማውን ይፈትሹ። 'When no diet is found' (አመጋገብ ሳይገኝ ሲቀር) የሚለውን ርዕስ ይመልከቱ።
feed-missing:
  question: በዝርዝሩ ውስጥ አንድ መኖ ለምን ማግኘት አልችልም?
  answer: ዝርዝሮቹ በከብት መረጃ ገጽ ላይ የተመረጠውን አገር መኖዎች እና የራስዎን ብጁ መኖዎች ያሳያሉ። አገሩን ይፈትሹ፣ በስሙ በከፊል ይፈልጉ፣ ወይም መኖውን ራስዎ በ'ብጁ መኖ' ያክሉ።
own-values:
  question: የራሴን መኖ ወይም የራሴን የላቦራቶሪ እሴቶች መጠቀም እችላለሁ?
  answer: አዎ። 'ብጁ መኖ' አዲስ መኖ ያክላል፤ በመኖ ካርድ ላይ ያለው እርሳስ ከእሴቶችዎ ጋር የራስዎን ቅጂ ያስቀምጣል። ብጁ መኖዎችዎን ማየት የሚችሉት እርስዎ ብቻ ነዎት።
margin-meaning:
  question: በሪፖርቱ ላይ ያለው የወተት ህዳግ ትርፌ ነው?
  answer: አይደለም። የወተት ዋጋ ሲቀነስ የአንድ ሊትር የመኖ ወጪ ነው፦ ወተቱ ከመኖ ወጪ ብቻ በላይ የሚያስገኘው። የጉልበት፣ የእንስሳት ሕክምና እና ሌሎች ወጪዎች አልተካተቱበትም።
eval-cost-per-litre:
  question: በግምገማ ውስጥ የትኛውን የአንድ ሊትር ወጪ መጠቀም አለብኝ?
  answer: በወጪ ትንተና ስር ያለውን 'ወጪ/ሊትር ወተት' ይጠቀሙ። የአመጋገቡን ወጪ ራሽኑ በእውነት ሊያስገኝ በሚችለው ወተት ('እውን የወተት ምርት') ያካፍላል፤ ይህ ከዒላማዎ ያነሰ ሊሆን ይችላል።
calf-milk:
  question: ጥጃዬ ምን ያህል ወተት ማግኘት አለበት?
  answer: በከብት መረጃ ገጽ ላይ 'ጥጃዎች' ይምረጡ እና የሰውነት ክብደቱን ይጻፉ። ዕቅዱ በቀን የሰውነት ክብደቱን አንድ አሥረኛ በሊትር ይሰጣል፤ በ2 ምገባዎች ተከፍሎ፣ እስከ 56 ቀናት ድረስ ጡት በማስጣል። ከእንስሳት ሐኪምዎ ጋር ሆነው ያስተካክሉት።
limit-feed:
  question: አመጋገቡ ከአንድ መኖ በጣም ብዙ እንዳይጠቀም እንዴት ማድረግ እችላለሁ?
  answer: በዚያ መኖ ካርድ ላይ 'የማካተት ገደቦችን ያቀናብሩ' የሚለውን ያብሩ እና ከፍተኛ (Max) መጠን በቀን kg ይጻፉ። በሪፖርቱ ውስጥ ያለው 'ያስቀመጧቸው ገደቦች' ካርድ አመጋገቡ ምን ያህል እንደተጠቀመ ያሳያል።
saved-reports:
  question: የተቀመጡ ሪፖርቶቼ የት ናቸው?
  answer: ምናሌውን ይክፈቱ እና 'የመኖ ሪፖርቶች' የሚለውን ይንኩ። 'ሪፖርት ይመልከቱ' PDFውን ይከፍታል። ያላስቀመጧቸው ሪፖርቶች እዚያ አይዘረዘሩም።
pdf-pending:
  question: ሪፖርቴ 'PDF እየተጠበቀ ነው' ያሳያል።
  answer: PDFው ካስቀመጡ በኋላ ከበስተጀርባ ይዘጋጃል። ከአንድ ደቂቃ በኋላ 'የመኖ ሪፖርቶች' የሚለውን እንደገና ይክፈቱ።
forgot-pin:
  question: PINዬን ረሳሁ። ምን ላድርግ?
  answer: በመግቢያ ገጹ ላይ 'Forgot PIN? Tap here' (PIN ረሱ? እዚህ ይንኩ) የሚለውን ይንኩ እና የኢሜይል አድራሻዎን ይጻፉ። ኢሜይሉን ይክፈቱ፣ 'Reset my PIN' (PINዬን ዳግም አስጀምር) የሚለውን ይንኩ እና አዲስ ባለ 6 አሃዝ PIN ይምረጡ። ይህን እስኪያደርጉ ድረስ የቆየው PINዎ ይሠራል።
change-language:
  question: መተግበሪያውን በቋንቋዬ እንዴት መጠቀም እችላለሁ?
  answer: ለዚህ ሪፖርት በከብት መረጃ ገጽ ላይ ቋንቋውን ይምረጡ፣ ወይም በመገለጫ ውስጥ ነባሪ ቋንቋዎን ያስቀምጡ እና 'መገለጫ ያዘምኑ' የሚለውን ይንኩ። የሚቀርቡት ቋንቋዎች በአገሩ ላይ ይወሰናሉ።
contact-team:
  question: የRationSmart ቡድንን እንዴት ማግኘት እችላለሁ?
  answer: ምናሌውን ይክፈቱ፣ 'እርዳታ እና ድጋፍ' የሚለውን ይንኩ፣ ከዚያ 'ያግኙን'። የኢሜይል መተግበሪያዎን ይከፍታል።
