howto_title: Paano gamitin ang gabay na ito
howto_topics_lead: Sinusundan ng mga paksa ang app.
howto_topics: Bawat paksa ay isang gawain, ayon sa pagkakasunod-sunod ng paggamit mo ng app. Pareho ang mga numero sa screen na 'Tulong at Suporta' ng app, kaya maituturo mo sa mga magsasaka ang parehong paksa sa kanilang phone.
howto_scan_lead: I-scan ang QR code para manood.
howto_scan: Buksan ang camera ng phone at itutok ito sa code. Magbubukas sa YouTube ang maikling video ng paksa. Nasa ilalim ng bawat code ang link, kung mas gusto mong i-type ito.
videos_english: Nasa English ang mga video.
howto_time_lead: Ang ▶ 0:21 ay nangangahulugang “nasa video ang hakbang na ito sa 0 min 21 seg”.
howto_time: Gamitin ito para lumundag sa isang hakbang habang nagtuturo ka.
howto_problems_lead: “Kung may problema”
howto_problems: sa dulo ng bawat paksa ay naglilista ng mga mensaheng pinakamadalas makita ng mga tao at kung ano ang gagawin.
tip_lead: 'Payo para sa mga trainer:'
tip: magsimula sa paksa {number}, {title}, at sa video nito. Ipinapakita nito ang buong app sa loob ng wala pang dalawang minuto. Galing sa app ang mga larawan; maaaring medyo iba ang hitsura ng iyong screen.
