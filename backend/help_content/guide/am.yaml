howto_topics: እያንዳንዱ ርዕስ አንድ ሥራ ነው፤ መተግበሪያውን በሚጠቀሙበት ቅደም ተከተል ተቀምጠዋል። ቁጥሮቹ በመተግበሪያው 'እርዳታ እና ድጋፍ' ገጽ ላይ ካሉት ጋር አንድ ናቸው፤ ስለዚህ አርሶ አደሮችን በስልካቸው ወደዚያው ርዕስ መምራት ይችላሉ።
howto_scan_lead: ለማየት የQR ኮዱን ይቃኙ።
