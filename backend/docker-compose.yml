# PostgreSQL runs natively on the host (port 9900) — no db service here.
# Containers reach the host DB via host.docker.internal (resolved by extra_hosts below).
# Set POSTGRES_HOST=host.docker.internal in .env on the server.

# Pinned project name: compose would otherwise name the project after this folder
# ("backend"), and on the server that starts a second set of containers beside the
# running rationsmart-* ones instead of replacing them, plus a new empty Redis volume.
# For an isolated second copy on the same machine, override it: docker compose -p <name> ...
name: rationsmart

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # scripts_2/db_reset.py writes its pre-reset pg_dump here: the repo root's
    # backups/ (~/rationsmart/backups on the server, beside the deploy's dumps).
    volumes:
      - ../backups:/backups
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers ${WORKERS:-3}
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A app.celery_app worker
        --loglevel=info
        --concurrency=4
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A app.celery_app beat
        --loglevel=info
        --schedule /tmp/celerybeat-schedule
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Loopback only: the services above reach Redis over the compose network
    # (redis://redis:6379), and Redis runs without a password, so it must not be
    # published on the server's public interfaces. Host-side debugging and a local
    # uvicorn against this Redis still work via localhost:6379.
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
